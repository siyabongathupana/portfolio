  <style>
    .analytics-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
    }
    .stat-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-3px);
    }
    .stat-card .stat-icon {
      font-size: 2rem;
      color: #2fc7ff;
      margin-bottom: 10px;
    }
    .stat-card .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .stat-card .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 5px;
    }
    .chart-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }
    .chart-card h5 {
      margin-bottom: 20px;
      color: var(--text-primary);
      font-weight: 600;
    }
    .filter-bar {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }
    .date-range-picker {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .date-range-picker select {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-primary);
    }
    .btn-export {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-export:hover {
      background: #218838;
    }
    .insight-box {
      background: linear-gradient(135deg, #2fc7ff10 0%, #0b2b3b10 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #2fc7ff;
    }
    .insight-box h6 {
      color: #2fc7ff;
      margin-bottom: 10px;
    }
    .insight-box p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .location-item {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .location-item:last-child {
      border-bottom: none;
    }
    .access-denied {
      text-align: center;
      padding: 60px 20px;
    }
    .access-denied i {
      font-size: 4rem;
      color: #dc3545;
      margin-bottom: 20px;
    }
    .access-denied h3 {
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .access-denied p {
      color: var(--text-muted);
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(20px); }
      10% { opacity: 1; transform: translateX(0); }
      90% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(20px); }
    }
    @media (max-width: 768px) {
      .analytics-container {
        padding: 10px;
      }
      .stat-card .stat-number {
        font-size: 1.5rem;
      }
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .location-item {
        flex-direction: column;
        text-align: center;
        gap: 8px;
      }
    }
  </style>
</head>
