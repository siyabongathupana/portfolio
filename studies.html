<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Manager · Engineering Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="api.js"></script>
    <script src="shared.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        /* ─── same base styles, with mobile improvements ─── */
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111927;
            --border-subtle: rgba(47, 199, 255, 0.08);
            --text-primary: #e0e8ee;
            --text-secondary: #8a9fb0;
            --accent: #2fc7ff;
            --accent-glow: rgba(47, 199, 255, 0.15);
            --green: #00b894;
            --orange: #fdcb6e;
            --red: #e17055;
            --purple: #a29bfe;
            --blue: #0984e3;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10, 14, 23, 0.85) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 0;
            position: relative;
            z-index: 100;
        }
        .navbar-brand { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; }
        .navbar-brand span { color: var(--accent); }
        .nav-link { color: rgba(255,255,255,0.4) !important; font-size: 0.8rem; transition: 0.2s; letter-spacing: 0.03em; }
        .nav-link:hover { color: var(--accent) !important; }
        .nav-link.active { color: var(--accent) !important; }

        .study-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px 100px;
        }

        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 0 30px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 30px;
        }
        .study-header h1 {
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .study-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .study-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .study-header .actions .btn {
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 20px;
            transition: 0.25s;
            border: none;
            min-height: 44px;
        }
        .btn-sync {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .btn-sync:hover {
            background: rgba(47,199,255,0.12);
            color: var(--accent);
        }
        .btn-primary-glow {
            background: linear-gradient(135deg, var(--accent), #0984e3);
            color: #0a0e17;
        }
        .btn-primary-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(47,199,255,0.2);
            color: #0a0e17;
        }
        .btn-success-glow {
            background: linear-gradient(135deg, var(--green), #00a86b);
            color: white;
        }
        .btn-success-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0,184,148,0.2);
            color: white;
        }
        .btn-excel {
            background: #28a745;
            color: white;
        }
        .btn-excel:hover {
            background: #218838;
            transform: scale(1.03);
            color: white;
        }
        .btn-grade {
            background: rgba(162, 155, 254, 0.15);
            color: var(--purple);
        }
        .btn-grade:hover {
            background: rgba(162, 155, 254, 0.25);
            color: var(--purple);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-subtle);
            text-align: center;
            transition: 0.2s;
        }
        .stat-item:hover {
            border-color: rgba(47,199,255,0.2);
            transform: translateY(-2px);
        }
        .stat-item .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
        .stat-item .number.green { color: var(--green); }
        .stat-item .number.orange { color: var(--orange); }
        .stat-item .number.blue { color: var(--accent); }
        .stat-item .number.purple { color: var(--purple); }
        .stat-item .number.red { color: var(--red); }

        .level-section {
            margin-bottom: 16px;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg-card);
        }
        .level-header {
            padding: 12px 18px;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: 0.2s;
        }
        .level-header:hover {
            background: rgba(255,255,255,0.04);
        }
        .level-header .name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .level-header .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .level-header .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .level-header .actions .btn {
            border-radius: 40px;
            font-size: 0.7rem;
            padding: 6px 14px;
            min-height: 36px;
            border: none;
            transition: 0.2s;
        }
        .btn-add {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
        }
        .btn-add:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .btn-del {
            background: rgba(225,112,85,0.08);
            color: var(--red);
        }
        .btn-del:hover {
            background: rgba(225,112,85,0.15);
        }
        .btn-edit {
            background: rgba(47,199,255,0.06);
            color: var(--accent);
        }
        .btn-edit:hover {
            background: rgba(47,199,255,0.12);
        }

        .level-body {
            padding: 14px 18px;
            display: none;
        }
        .level-body.open {
            display: block;
        }

        .child-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .child-card {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            transition: 0.2s;
            cursor: pointer;
        }
        .child-card:hover {
            border-color: rgba(47,199,255,0.2);
            background: rgba(255,255,255,0.04);
        }
        .child-card .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .child-card .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .child-card .progress-track {
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 0 3px;
        }
        .child-card .progress-track .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--green));
            transition: width 0.6s ease;
        }

        .topic-item {
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            overflow: hidden;
        }
        .topic-header {
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.02);
        }
        .topic-header:hover {
            background: rgba(255,255,255,0.04);
        }
        .topic-header .check {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
        }
        .topic-header .check.checked {
            background: var(--green);
            border-color: var(--green);
        }
        .topic-header .check.checked i {
            color: #fff;
        }
        .topic-header .check i {
            font-size: 11px;
            color: transparent;
        }
        .topic-header .name {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .topic-header .meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .topic-header .actions .btn {
            border-radius: 40px;
            font-size: 0.65rem;
            padding: 4px 12px;
            min-height: 30px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .topic-header .actions .btn:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .topic-header .actions .btn-del:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }
        .topic-header .expand-icon {
            color: var(--text-secondary);
            font-size: 0.7rem;
            transition: 0.2s;
            margin-left: 4px;
        }

        .subtopic-list {
            padding: 0 14px 10px 44px;
            display: none;
        }
        .subtopic-list.open {
            display: block;
        }
        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .subtopic-item:last-child {
            border-bottom: none;
        }
        .subtopic-item .sub-check {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 2px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
        }
        .subtopic-item .sub-check.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .subtopic-item .sub-check.checked i {
            color: #fff;
        }
        .subtopic-item .sub-check i {
            font-size: 9px;
            color: transparent;
        }
        .subtopic-item .sub-label {
            flex: 1;
        }
        .subtopic-item .sub-label.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .subtopic-item .sub-actions .btn {
            border-radius: 40px;
            font-size: 0.6rem;
            padding: 2px 10px;
            min-height: 24px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .subtopic-item .sub-actions .btn:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }

        .subtopic-add-row {
            margin-top: 6px;
        }
        .subtopic-add-row .btn {
            border-radius: 40px;
            font-size: 0.7rem;
            padding: 4px 14px;
            min-height: 32px;
            border: 1px dashed var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .subtopic-add-row .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        .assignments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }
        .assignments-section .section-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .assignments-section .section-title i {
            color: var(--accent);
        }

        .assignment-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: 0.2s;
            flex-wrap: wrap;
        }
        .assignment-item:hover {
            border-color: var(--border-subtle);
            background: rgba(255,255,255,0.04);
        }
        .assignment-item .ass-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 100px;
        }
        .assignment-item .ass-due {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 70px;
        }
        .assignment-item .ass-status {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .assignment-item .ass-status.pending {
            background: rgba(225,112,85,0.12);
            color: var(--red);
        }
        .assignment-item .ass-status.in-progress {
            background: rgba(253,203,110,0.12);
            color: var(--orange);
        }
        .assignment-item .ass-status.submitted {
            background: rgba(0,184,148,0.12);
            color: var(--green);
        }
        .assignment-item .ass-marks {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 40px;
            text-align: right;
        }
        .assignment-item .ass-actions {
            display: flex;
            gap: 4px;
        }
        .assignment-item .ass-actions .btn {
            border-radius: 40px;
            font-size: 0.65rem;
            padding: 2px 12px;
            min-height: 28px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .assignment-item .ass-actions .btn-edit-ass:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .assignment-item .ass-actions .btn-del-ass:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }
        .btn-add-ass {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
            border-radius: 40px;
            padding: 4px 14px;
            min-height: 32px;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .btn-add-ass:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        /* ─── Grade Modal ─── */
        .grade-modal .modal-box {
            max-width: 680px;
        }
        .grade-modal .grade-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 16px 0 20px;
        }
        .grade-modal .grade-summary .card {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 12px 16px;
            text-align: center;
            border: 1px solid var(--border-subtle);
        }
        .grade-modal .grade-summary .card .value {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
        }
        .grade-modal .grade-summary .card .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .grade-modal .grade-summary .card .value.green { color: var(--green); }
        .grade-modal .grade-summary .card .value.orange { color: var(--orange); }
        .grade-modal .grade-summary .card .value.red { color: var(--red); }
        .grade-modal .grade-summary .card .value.purple { color: var(--purple); }

        .grade-modal .assignment-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .grade-modal .assignment-row:hover {
            border-color: var(--border-subtle);
            background: rgba(255,255,255,0.04);
        }
        .grade-modal .assignment-row .name {
            flex: 1;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .grade-modal .assignment-row .weight {
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-width: 50px;
        }
        .grade-modal .assignment-row .marks-input {
            width: 70px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.85rem;
            text-align: right;
            outline: none;
            transition: 0.2s;
        }
        .grade-modal .assignment-row .marks-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,199,255,0.1);
        }
        .grade-modal .assignment-row .status-badge {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 40px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .grade-modal .assignment-row .status-badge.pending { background: rgba(225,112,85,0.12); color: var(--red); }
        .grade-modal .assignment-row .status-badge.submitted { background: rgba(0,184,148,0.12); color: var(--green); }

        .grade-modal .what-if {
            margin-top: 16px;
            padding: 14px 16px;
            background: rgba(47,199,255,0.04);
            border-radius: 12px;
            border: 1px solid rgba(47,199,255,0.1);
        }
        .grade-modal .what-if .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .grade-modal .what-if input[type="number"] {
            width: 100px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .grade-modal .what-if input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,199,255,0.1);
        }
        .grade-modal .what-if .result {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .grade-modal .what-if .result .needed {
            color: var(--green);
        }
        .grade-modal .what-if .result .impossible {
            color: var(--red);
        }

        /* ─── Modal common ─── */
        .modal-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-custom.open {
            display: flex;
        }
        .modal-custom .modal-box {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-custom .modal-box h3 {
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
        }
        .modal-custom .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-custom .modal-box .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .modal-custom .modal-box .form-group input,
        .modal-custom .modal-box .form-group select,
        .modal-custom .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
        }
        .modal-custom .modal-box .form-group input:focus,
        .modal-custom .modal-box .form-group select:focus,
        .modal-custom .modal-box .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,199,255,0.1);
        }
        .modal-custom .modal-box .form-group select option {
            background: #1a2233;
        }
        .modal-custom .modal-box .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-custom .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .modal-custom .modal-box .modal-actions .btn {
            border-radius: 40px;
            padding: 8px 24px;
            min-height: 44px;
            font-weight: 600;

            if (window.SessionManager?.getCurrentUser) {
                const u = window.SessionManager.getCurrentUser();

            }
            try {
                const stored = sessionStorage.getItem('portfolioUser');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.timestamp && Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {

                    }
                    sessionStorage.removeItem('portfolioUser');

            const json = JSON.stringify(data);
            const key = window.APP_CONFIG.dogsname;
            const encrypted = await window.CryptoUtil.encrypt(json, key);
            return encrypted;
        }

            const key = window.APP_CONFIG.dogsname;
            const decrypted = await window.CryptoUtil.decrypt(encrypted, key);
            return JSON.parse(decrypted);
        }

        //  GITHUB STORAGE (encrypted) with retry & SHA conflict handling
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getStudyPath() {
            const { dataPath } = window.REPO_CONFIG;
            const encUser = encodeURIComponent(user.username);
            return `${dataPath}/users/${encUser}/studies.enc`;
        }

        async function saveStudyDataWithRetry(attempt = 0, maxAttempts = 5) {
            if (isSaving) {
                await new Promise(r => setTimeout(r, 200));
                return saveStudyDataWithRetry(attempt, maxAttempts);
            }
            isSaving = true;
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const encrypted = await encryptData(studyData);
                const content = JSON.stringify(encrypted, null, 2);

                let sha = null;
                try {
                    const existing = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                    if (existing && existing.sha) sha = existing.sha;
                } catch (e) {}

                await GitHubAPI.updateFile(owner, repo, path, content, 'Update study data (encrypted)', branch, user.pat,
                    sha);
                console.log('✅ Study data saved (encrypted) to GitHub');
                showToast('✅ Saved', 'success');
                isSaving = false;
                return true;
            } catch (err) {
                console.error('Save attempt failed:', err);
                if (attempt < maxAttempts) {
                    const delay = Math.pow(2, attempt) * 500 + Math.random() * 500;
                    console.log(`Retrying in ${delay}ms (attempt ${attempt + 1}/${maxAttempts})`);
                    await new Promise(r => setTimeout(r, delay));
                    return saveStudyDataWithRetry(attempt + 1, maxAttempts);
                } else {
                    showToast('❌ Save failed after multiple attempts: ' + err.message, 'error');
                    isSaving = false;
                    return false;
                }
            }
        }

        const saveStudyData = saveStudyDataWithRetry;

        async function loadStudyData() {
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const file = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                if (file && file.content) {
                    let parsed;
                    try {
                        parsed = JSON.parse(file.content);
                    } catch (e) {
                        parsed = null;
                    }
                    if (parsed && typeof parsed === 'object' && parsed.salt && parsed.iv && parsed.ciphertext) {
                        const decrypted = await decryptData(parsed);
                        if (decrypted && decrypted.years) {
                            studyData = decrypted;
                            console.log('✅ Study data loaded (decrypted) from GitHub');
                            return true;
                        }
                    } else if (parsed && parsed.years) {
                        studyData = parsed;
                        console.log('✅ Study data loaded (plain) from GitHub');
                        await saveStudyData();
                        return true;
                    }
                }
            } catch (err) {
                console.log('No existing study data, initializing...');
            }
            return false;

        //  RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            renderStats();
            renderTree();
        }

        function renderStats() {
            let totalYears = studyData.years.length;
            let totalUnits = 0,
                totalWeeks = 0,
                totalTopics = 0,
                doneTopics = 0;
            let totalAssignments = 0,
                pendingAssignments = 0;

            studyData.years.forEach(y => {
                y.semesters.forEach(s => {
                    s.units.forEach(u => {
                        totalUnits++;
                        (u.weeks || []).forEach(w => {
                            totalWeeks++;
                            (w.topics || []).forEach(t => {
                                totalTopics++;
                                if (t.completed) doneTopics++;
                            });
                            (w.assignments || []).forEach(a => {
                                totalAssignments++;
                                if (a.status === 'pending' || a.status === 'in-progress')
                                    pendingAssignments++;
                            });
                        });
                    });
                });
            });

            document.getElementById('statYears').textContent = totalYears;
            document.getElementById('statUnits').textContent = totalUnits;
            document.getElementById('statWeeks').textContent = totalWeeks;
            document.getElementById('statTopicsDone').textContent = doneTopics + '/' + totalTopics;
            document.getElementById('statAssignments').textContent = totalAssignments;
            document.getElementById('statPending').textContent = pendingAssignments;
        }

        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            studyData.years.forEach((year, yi) => {
                const yearKey = `year_${yi}`;
                const isOpen = expanded[yearKey] || false;

                const sec = document.createElement('div');
                sec.className = 'level-section';

                            <div class="name">📅 ${escapeHtml(year.name)}</div>
                            <div class="meta">${year.semesters.length} semesters</div>

                        <div class="actions">

                            <i class="fa fa-chevron-${isOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>

                    </div>
                    <div class="level-body ${isOpen ? 'open' : ''}">

                // Semesters
                year.semesters.forEach((semester, si) => {
                    const semKey = `semester_${yi}_${si}`;

                    const semDiv = document.createElement('div');
                    semDiv.className = 'level-section';
                    semDiv.style.marginBottom = '12px';
                    semDiv.innerHTML = `
                        <div class="level-header" onclick="toggleExpand('${semKey}')">

                            <div class="actions">
                                <button class="btn btn-add" onclick="event.stopPropagation();addUnit(${yi}, ${si})"><i class="fa fa-plus"></i> Unit</button>

                                <button class="btn btn-del" onclick="event.stopPropagation();deleteSemester(${yi}, ${si})"><i class="fa fa-trash"></i></button>

                        </div>
                        <div class="level-body ${semOpen ? 'open' : ''}">
                    `;

                    // Units
                    semester.units.forEach((unit, ui) => {
                        const unitKey = `unit_${yi}_${si}_${ui}`;
                        const unitOpen = expanded[unitKey] || false;
                        const weeks = unit.weeks || [];
                        const totalWeeks = weeks.length;
                        const doneWeeks = weeks.filter(w => {
                            const topics = w.topics || [];
                            return topics.every(t => t.completed);

                        const pct = totalWeeks > 0 ? Math.round((doneWeeks / totalWeeks) * 100) : 0;

                        const unitCard = document.createElement('div');

                        // Weeks
                        weeks.forEach((week, wi) => {

                            // Topics
                            topics.forEach((topic, ti) => {

                                        <span class="expand-icon"><i class="fa fa-chevron-${topicExpanded ? 'up' : 'down'}"></i></span>
                                    </div>
                                    <div class="subtopic-list ${topicExpanded ? 'open' : ''}">
                                        ${subTopics.map((sub, si2) => {
                                            const subChecked = (topic.subCompleted && topic.subCompleted[si2]) || false;
                                            return `
                                                <div class="subtopic-item">
                                                    <div class="sub-check ${subChecked ? 'checked' : ''}" onclick="toggleSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti}, ${si2})">

                                    </div>
                                `;
                                weekDiv.querySelector('.level-body').appendChild(tDiv);
                            });

                            // Assignments for this week
                            const assignments = week.assignments || [];
                            if (assignments.length) {
                                const assSection = document.createElement('div');
                                assSection.className = 'assignments-section';
                                let assHtml = `
                                    <div class="section-title"><i class="fa fa-tasks"></i> Assignments

                                        a.status === 'in-progress' ? 'In Progress' : '✅ Submitted';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function calculateUnitGrade(unit) {
            const allAssignments = [];
            (unit.weeks || []).forEach(week => {
                (week.assignments || []).forEach(ass => {
                    allAssignments.push(ass);
                });
            });

            let totalWeight = 0,
                weightedSum = 0,
                missingMarks = 0;

            allAssignments.forEach(ass => {
                const weight = parseFloat(ass.weight) || 0;
                totalWeight += weight;
                const marks = parseFloat(ass.marks);
                if (!isNaN(marks) && marks >= 0 && marks <= 100) {
                    weightedSum += marks * (weight / 100);
                } else {
                    missingMarks += weight;
                }
            });

            if (allAssignments.length === 0 || totalWeight === 0) return null;

            const achievedWeight = totalWeight - missingMarks;
            const currentGrade = achievedWeight > 0 ? (weightedSum / achievedWeight) * 100 : null;

            return {
                grade: currentGrade,
                totalWeight,
                weightedSum,
                missingMarks,
                allAssignments,
                achievedWeight
            };
        }

        function renderGradeModal(yi, si, ui) {
            const unit = studyData.years[yi]?.semesters[si]?.units[ui];
            if (!unit) return;

            const result = calculateUnitGrade(unit);
            const body = document.getElementById('gradeModalBody');
            let html = '';

            // Summary cards
            let gradeDisplay = 'N/A',
                gradeColor = 'red',
                gradeValue = 0;
            if (result) {
                if (result.grade !== null) {
                    gradeValue = Math.round(result.grade);
                    gradeDisplay = gradeValue + '%';
                    gradeColor = gradeValue >= 70 ? 'green' : (gradeValue >= 50 ? 'orange' : 'red');
                } else {
                    gradeDisplay = '—';
                }
            } else {
                gradeDisplay = 'No assignments';
            }

            html += `
                <div class="grade-summary">
                    <div class="card">
                        <div class="value ${gradeColor}">${gradeDisplay}</div>
                        <div class="label">Current Grade</div>
                    </div>
                    <div class="card">
                        <div class="value">${result ? (result.missingMarks > 0 ? '⏳' : '✅') : '—'}</div>
                        <div class="label">${result ? (result.missingMarks > 0 ? result.missingMarks.toFixed(0)+'% pending' : 'All marked') : '—'}</div>
                    </div>
                    <div class="card">
                        <div class="value">${result ? result.allAssignments.length : 0}</div>
                        <div class="label">Assignments</div>
                    </div>
                </div>
            `;

            if (result && result.allAssignments.length > 0) {
                html += `<div style="margin-top:12px;max-height:260px;overflow-y:auto;">`;
                result.allAssignments.forEach((ass, idx) => {
                    const marksVal = ass.marks || '';
                    const isPending = ass.status === 'pending' || ass.status === 'in-progress';
                    const statusClass = isPending ? 'pending' : 'submitted';
                    const statusLabel = isPending ? 'Pending' : 'Submitted';
                    html += `
                        <div class="assignment-row" data-idx="${idx}">
                            <div class="name">${escapeHtml(ass.name)}</div>
                            <div class="weight">${ass.weight || 0}%</div>
                            <input type="number" class="marks-input" value="${marksVal}" min="0" max="100" step="0.5"
                                data-yi="${yi}" data-si="${si}" data-ui="${ui}" data-idx="${idx}"
                                onchange="updateGradeMark(this)" placeholder="Marks">
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                    `;
                });
                html += `</div>`;

                // What-if
                const currentGrade = result.grade;
                const missingWeight = result.missingMarks || 0;
                const achievedWeight = result.achievedWeight || 0;
                const totalWeight = result.totalWeight || 100;

                html += `
                    <div class="what-if">
                        <div style="font-weight:600;margin-bottom:8px;">🎯 What-If Scenario</div>
                        <div class="input-group">
                            <span>Target grade:</span>
                            <input type="number" id="targetGradeInput" value="${Math.round(currentGrade || 70)}" min="0" max="100" step="0.5"
                                oninput="updateWhatIf(${yi}, ${si}, ${ui}, this.value)">
                            <span>%</span>
                        </div>
                        <div id="whatIfResult" style="margin-top:8px;">
                            ${currentGrade !== null ? (missingWeight > 0 ? 'Enter marks to see what-if.' : '✅ All done!') : 'Enter marks to see what-if.'}
                        </div>
                    </div>
                `;
            } else {
                html += `<p style="color:var(--text-secondary);">No assignments found for this unit.</p>`;
            }

            body.innerHTML = html;
            document.getElementById('gradeModalTitle').textContent = `📊 Grade Calculator – ${unit.code} ${unit.name}`;

            // Auto-calculate what-if on load
            if (result && result.grade !== null) {
                setTimeout(() => {
                    const targetInput = document.getElementById('targetGradeInput');
                    if (targetInput) updateWhatIf(yi, si, ui, targetInput.value);
                }, 100);
            }
        }

        // Update grade mark – saves and updates modal in-place
        window.updateGradeMark = function(input) {
            const yi = parseInt(input.dataset.yi);
            const si = parseInt(input.dataset.si);
            const ui = parseInt(input.dataset.ui);
            const idx = parseInt(input.dataset.idx);

            const unit = studyData.years[yi]?.semesters[si]?.units[ui];
            if (!unit) return;

            // Find the assignment by flattening weeks and assignments
            const flatAssignments = [];
            (unit.weeks || []).forEach(week => {
                (week.assignments || []).forEach(ass => {
                    flatAssignments.push(ass);
                });
            });
            if (idx < flatAssignments.length) {
                const ass = flatAssignments[idx];
                ass.marks = input.value;
                // Save after update
                saveStudyData().then(() => {
                    // Re-render the modal content (in-place update)
                    if (gradeModalOpen) {
                        renderGradeModal(yi, si, ui);
                        // Restore focus
                        const newInput = document.querySelector(`.marks-input[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-idx="${idx}"]`);
                        if (newInput) newInput.focus();
                    }
                    showToast('✅ Marks updated', 'success');
                });
            }
        };

        // What-if calculation – now uses live values from the modal
        window.updateWhatIf = function(yi, si, ui, target) {
            const unit = studyData.years[yi]?.semesters[si]?.units[ui];
            if (!unit) return;

            const result = calculateUnitGrade(unit);
            if (!result || result.grade === null) {
                document.getElementById('whatIfResult').innerHTML = 'Enter marks to see what-if.';
                return;
            }

            const currentGrade = result.grade;
            const missingWeight = result.missingMarks || 0;
            const achievedWeight = result.achievedWeight || 0;
            const totalWeight = result.totalWeight || 100;

            const targetNum = parseFloat(target);
            if (isNaN(targetNum) || targetNum < 0 || targetNum > 100) {
                document.getElementById('whatIfResult').innerHTML = 'Please enter a valid target (0-100).';
                return;
            }

            const resultDiv = document.getElementById('whatIfResult');

            if (missingWeight === 0) {
                resultDiv.innerHTML =
                    `✅ All assignments already have marks. Your grade is <strong>${Math.round(currentGrade)}%</strong>.`;
                return;
            }

            const needed = (targetNum * totalWeight - currentGrade * achievedWeight / 100) / missingWeight * 100;

            if (needed > 100) {
                resultDiv.innerHTML =
                    `❌ <span class="impossible">Even scoring 100% on all remaining assignments (${missingWeight}%) will only get you ${((currentGrade * achievedWeight / 100 + missingWeight) / totalWeight * 100).toFixed(1)}%</span>`;
            } else if (needed < 0) {
                resultDiv.innerHTML =
                    `✅ You already have <strong>${Math.round(currentGrade)}%</strong>. You can score 0% on remaining assignments and still reach ${targetNum}%.`;
            } else {
                resultDiv.innerHTML =
                    `💡 To reach <strong>${targetNum}%</strong>, you need <strong class="needed">${needed.toFixed(1)}%</strong> average on the remaining <strong>${missingWeight}%</strong> of assignments.`;
            }
        };

        // ─── MODAL HELPERS ───
        function openModal(title, bodyHTML, onSave) {
            const modal = document.getElementById('genericModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            modal.classList.add('open');
            modal._onSave = onSave;
        }

        document.getElementById('modalCancel').addEventListener('click', () => {
            document.getElementById('genericModal').classList.remove('open');
        });

        document.getElementById('modalSave').addEventListener('click', () => {
            const modal = document.getElementById('genericModal');
            const onSave = modal._onSave;
            if (typeof onSave === 'function') {
                const result = onSave();
                if (result !== false) {
                    modal.classList.remove('open');
                    saveStudyData().then(render);
                    showToast('✅ Saved', 'success');
                }
            }
        });

        // ─── EXPORT TO EXCEL (professional, with cover and grade summary) ───
        async function exportToExcel() {
            if (!studyData.years.length) {
                showToast('No data to export.', 'error');
                return;
            }

            window.showLoading('Generating Excel...');
            try {
                const ExcelJS = window.ExcelJS;
                const workbook = new ExcelJS.Workbook();
                workbook.creator = user.username;
                workbook.created = new Date();

                // ── Cover Sheet ──
                const cover = workbook.addWorksheet('Cover', {
                    pageSetup: { orientation: 'portrait', fitToPage: true }
                });
                cover.mergeCells('A1:D1');
                const titleCell = cover.getCell('A1');
                titleCell.value = '📚 STUDY PLAN OVERVIEW';
                titleCell.font = { bold: true, size: 24, color: { argb: 'FF2FC7FF' } };
                titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
                cover.getRow(1).height = 50;

                cover.mergeCells('A2:D2');
                const subCell = cover.getCell('A2');
                subCell.value = `Generated for ${user.username}`;
                subCell.font = { size: 12, italic: true };
                subCell.alignment = { horizontal: 'center' };
                cover.getRow(2).height = 30;

                cover.addRow([]);
                cover.addRow(['Generated on:', new Date().toLocaleString()]);
                cover.addRow(['Total Years:', studyData.years.length]);

                let totalUnits = 0,
                    totalWeeks = 0,
                    totalTopics = 0,
                    doneTopics = 0;
                let totalAssignments = 0,
                    pendingAss = 0;
                studyData.years.forEach(y => {
                    y.semesters.forEach(s => {
                        s.units.forEach(u => {
                            totalUnits++;
                            (u.weeks || []).forEach(w => {
                                totalWeeks++;
                                (w.topics || []).forEach(t => {
                                    totalTopics++;
                                    if (t.completed) doneTopics++;
                                });
                                (w.assignments || []).forEach(a => {
                                    totalAssignments++;
                                    if (a.status === 'pending' || a.status === 'in-progress')
                                        pendingAss++;
                                });
                            });
                        });
                    });
                });
                cover.addRow(['Total Units:', totalUnits]);
                cover.addRow(['Total Weeks:', totalWeeks]);
                cover.addRow(['Topics Completed:', doneTopics + '/' + totalTopics]);
                cover.addRow(['Total Assignments:', totalAssignments]);
                cover.addRow(['Pending Assignments:', pendingAss]);

                // Grade summary per unit
                cover.addRow([]);
                cover.addRow(['Unit Grade Summary:']);
                const gradeHeader = cover.addRow(['Year', 'Semester', 'Unit', 'Current Grade', 'Pending Weight']);
                gradeHeader.eachCell(cell => {
                    cell.font = { bold: true };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B2B3B' } };
                    cell.font.color = { argb: 'FFFFFFFF' };
                });
                studyData.years.forEach(y => {
                    y.semesters.forEach(s => {
                        s.units.forEach(u => {
                            const result = calculateUnitGrade(u);
                            const grade = result && result.grade !== null ? Math.round(result.grade) + '%' :
                                'N/A';
                            const pending = result ? (result.missingMarks > 0 ? result.missingMarks
                                .toFixed(0) + '%' : '✅') : 'N/A';
                            cover.addRow([y.name, s.name, u.code + ' ' + u.name, grade, pending]);
                        });
                    });
                });
                cover.columns.forEach(col => { col.width = 25; });

                // ── Data Sheet ──
                const ws = workbook.addWorksheet('Full Data', {
                    pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, margins: {
                        left: 0.7, right: 0.7, top: 0.7, bottom: 0.7, header: 0.3, footer: 0.3
                    } }
                });

                const headers = ['Year', 'Semester', 'Unit', 'Week', 'Topic', 'Subtopic', 'Completed', 'Assignment',
                    'Due Date', 'Status', 'Marks', 'Weight'
                ];
                const headerRow = ws.addRow(headers);
                headerRow.eachCell(cell => {
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B2B3B' } };
                    cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
                    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                    cell.border = {
                        top: { style: 'thin' }, bottom: { style: 'thin' },
                        left: { style: 'thin' }, right: { style: 'thin' }
                    };
                });
                ws.getRow(1).height = 28;

                let rowIndex = 2;
                studyData.years.forEach(year => {
                    year.semesters.forEach(sem => {
                        sem.units.forEach(unit => {
                            unit.weeks.forEach(week => {
                                const topics = week.topics || [];
                                const assignments = week.assignments || [];
                                if (!topics.length && !assignments.length) {
                                    ws.addRow([
                                        year.name, sem.name, unit.code + ' ' + unit.name,
                                        'Week ' + week.number,
                                        '', '', '', '', '', '', '', ''
                                    ]);
                                    rowIndex++;
                                    return;
                                }
                                topics.forEach(topic => {
                                    const subTopics = topic.subtopics || [];
                                    if (!subTopics.length) {
                                        ws.addRow([
                                            year.name, sem.name, unit.code + ' ' + unit.name,
                                            'Week ' + week.number,
                                            topic.name, '',
                                            topic.completed ? 'Yes' : 'No',
                                            '', '', '', '', ''
                                        ]);
                                        rowIndex++;
                                    } else {
                                        subTopics.forEach((sub, si) => {
                                            const completed = (topic.subCompleted && topic
                                                .subCompleted[si]) || false;
                                            ws.addRow([
                                                year.name, sem.name, unit.code + ' ' + unit
                                                .name,
                                                'Week ' + week.number,
                                                topic.name, sub,
                                                completed ? 'Yes' : 'No',
                                                '', '', '', '', ''
                                            ]);
                                            rowIndex++;
                                        });
                                    }
                                });
                                assignments.forEach(ass => {
                                    ws.addRow([
                                        year.name, sem.name, unit.code + ' ' + unit.name,
                                        'Week ' + week.number,
                                        '', '',
                                        '', // topic completed not applicable
                                        ass.name,
                                        ass.due || '',
                                        ass.status || 'pending',
                                        ass.marks || '',
                                        ass.weight || ''
                                    ]);
                                    rowIndex++;
                                });
                            });
                        });
                    });
                });

                ws.columns.forEach(col => {
                    let maxLength = 10;
                    col.eachCell({ includeEmpty: true }, cell => {
                        const val = cell.value ? cell.value.toString() : '';
                        if (val.length > maxLength) maxLength = val.length;
                    });
                    col.width = Math.min(maxLength + 3, 40);
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                saveAs(blob, `StudyPlan_${new Date().toISOString().slice(0,10)}.xlsx`);
                showToast('✅ Excel exported successfully!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Export failed: ' + err.message, 'error');
            } finally {
                window.hideLoading();
            }
        }

        // ─── UTILITY ───
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(20px)';
                setTimeout(() => el.remove(), 400);
            }, 3500);
        }

        // ─── SYNC / RESET ───
        document.getElementById('syncBtn').addEventListener('click', async () => {
            showToast('🔄 Syncing...', 'info');
            const loaded = await loadStudyData();
            if (!loaded) {
                studyData = getDefaultData();
                await saveStudyData();
            }
            render();
            showToast('✅ Synced from GitHub', 'success');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('⚠️ Reset ALL data? This will restore the default study plan. Any custom data will be lost.'))
                return;
            studyData = getDefaultData();
            expanded = {};
            saveStudyData().then(() => {
                render();
                showToast('🔄 Reset to default', 'info');
            });
        });

        document.getElementById('addYearBtn').addEventListener('click', window.addYear);
        document.getElementById('exportBtn').addEventListener('click', exportToExcel);

        // ─── FOOTER ───
        function updateFooter() {
            if (window.updateUserFooter) {
                window.updateUserFooter();
                const el = document.getElementById('footerStatus');
                const orig = document.getElementById('userFooterStatus');
                if (el && orig) {
                    el.innerHTML = orig.innerHTML;
                }
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function init() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="study-header">
                    <div>
                        <h1><i class="fa fa-graduation-cap" style="font-size:1.8rem;margin-right:12px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i> Study Manager</h1>
                        <div class="subtitle">Years → Semesters → Units → Weeks → Topics → Subtopics · <span id="userDisplay"></span></div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sync" id="syncBtn"><i class="fa fa-cloud-download"></i> Sync</button>
                        <button class="btn btn-excel" id="exportBtn"><i class="fa fa-file-excel-o"></i> Export</button>
                        <button class="btn btn-success-glow" id="addYearBtn"><i class="fa fa-plus"></i> Add Year</button>
                        <button class="btn btn-outline-light" id="resetBtn" style="border:1px solid var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-refresh"></i> Reset</button>
                    </div>
                </div>

                <div class="stats-bar" id="statsBar">
                    <div class="stat-item"><div class="number blue" id="statYears">0</div><div class="label">Years</div></div>
                    <div class="stat-item"><div class="number purple" id="statUnits">0</div><div class="label">Units</div></div>
                    <div class="stat-item"><div class="number orange" id="statWeeks">0</div><div class="label">Weeks</div></div>
                    <div class="stat-item"><div class="number green" id="statTopicsDone">0</div><div class="label">Topics Done</div></div>
                    <div class="stat-item"><div class="number" id="statAssignments">0</div><div class="label">Assignments</div></div>
                    <div class="stat-item"><div class="number red" id="statPending">0</div><div class="label">Pending</div></div>
                </div>

                <div id="treeContainer"></div>

                <div class="text-center text-muted-light small py-4" style="border-top:1px solid var(--border-subtle);margin-top:20px;">
                    <span id="footerStatus"></span>
                </div>
            `;

            // Re-bind event listeners
            document.getElementById('syncBtn').addEventListener('click', async () => {
                showToast('🔄 Syncing...', 'info');
                const loaded = await loadStudyData();
                if (!loaded) {
                    studyData = getDefaultData();
                    await saveStudyData();
                }
                render();
                showToast('✅ Synced from GitHub', 'success');
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                if (!confirm('⚠️ Reset ALL data? This will restore the default study plan. Any custom data will be lost.'))
                    return;
                studyData = getDefaultData();
                expanded = {};
                saveStudyData().then(() => {
                    render();
                    showToast('🔄 Reset to default', 'info');
                });
            });

            document.getElementById('addYearBtn').addEventListener('click', window.addYear);
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);

            window.showLoading('Loading study data...');
            const loaded = await loadStudyData();
            if (!loaded) {
                studyData = getDefaultData();
                await saveStudyData();
            }

            document.getElementById('userDisplay').textContent = '🔒 ' + user.username;

            render();
            updateFooter();
            window.hideLoading();

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    saveStudyData();
                }
            });
        }

        // ─── START ───
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.studyManager = { studyData, render, saveStudyData };
    </script>
</body>
</html>
