      const DEBOUNCE_DELAY = 1000;        // 1 second
      const MAX_SAVE_DELAY = 5000;        // 5 seconds

      // Offline detection
      let isOffline = false;
      window.addEventListener('online', () => {
        isOffline = false;
        updateSaveStatusUI('saved');
        if (savedVersion !== saveVersion) {
          scheduleSave();
        }
      });
      window.addEventListener('offline', () => {
        isOffline = true;
        updateSaveStatusUI('offline');
      });

      function updateSaveStatusUI(status) {
        saveStatus = status;
        const dot = document.getElementById('saveStatusDot');
        const label = document.getElementById('saveStatusLabel');
        if (!dot || !label) return;
        dot.className = 'dot ' + status;
        const messages = {
          saved: 'Saved',
          saving: 'Saving…',
          error: 'Error',
          offline: 'Offline'
        };
        label.textContent = messages[status] || 'Saved';
        // If offline, also show a small indicator
        if (status === 'offline') {
          label.textContent = 'Offline (local)';
        }
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  CACHE (localStorage) – immediate persistence
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      const CACHE_KEY = 'studies_data_cache';

      function saveToCache(data) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now(), version: '2.0' }));
        } catch(e) {}
      }

      function loadFromCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.data && parsed.data.years) {
              console.log('📦 Loaded from cache');
              return parsed.data;
            }
          }
        } catch(e) {}
        return null;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  GITHUB PATH
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function getStudyPath() {
        const { dataPath } = window.REPO_CONFIG || { dataPath: 'data' };
        const encUser = encodeURIComponent(user.username);
        return `${dataPath}/users/${encUser}/studies.json`;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  LOAD DATA
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      async function loadData() {
        console.log('📂 loadData started');
        const loader = document.getElementById('initialLoading');
        if (loader) loader.style.display = 'flex';

        try {
          let data = loadFromCache();
          if (data) {
            studyData = data;
            console.log('✅ Loaded from cache');
            render();
          }

          // Try GitHub
          try {
            const result = await loadFromGitHub();
            if (result) {
              studyData = result.data;
              currentFileSha = result.sha;   // store SHA for future saves
              console.log('✅ Updated from GitHub, SHA stored');
              render();
              saveToCache(studyData);
            }
          } catch (err) {
            console.warn('GitHub load failed:', err);
            if (!studyData.years || studyData.years.length === 0) {
              studyData = getDefaultData();
              render();
              markDirty();
            }
          }

          if (!studyData.years || studyData.years.length === 0) {
            studyData = getDefaultData();
            render();
            markDirty();
          }

          console.log('✅ loadData finished');
          return true;
        } catch (err) {
          console.error('Error loading data:', err);
          showToast('Failed to load study data: ' + err.message, 'error');
          const container = document.getElementById('treeContainer');
          if (container) {
            container.innerHTML = `
              <div class="error-display">
                <div class="icon"><i class="fa fa-exclamation-circle"></i></div>
                <h3>Error Loading Data</h3>
                <p>${err.message}</p>
                <pre>${err.stack}</pre>
                <button class="btn btn-delta mt-3" onclick="window.location.reload()">Retry</button>
              </div>
            `;
          }
          return false;
        } finally {
          if (loader) loader.style.display = 'none';
          updateSaveStatusUI('saved');
        }
      }

      async function loadFromGitHub() {
        const { owner, repo, branch } = window.REPO_CONFIG;
        const path = getStudyPath();
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
        const resp = await fetch(url, { headers: { Authorization: `token ${user.pat}` } });
        if (!resp.ok) {
          if (resp.status === 404) return null;
          throw new Error(`GitHub error: ${resp.status}`);
        }
        const data = await resp.json();
        const content = atob(data.content.replace(/\n/g, ''));
        const parsed = JSON.parse(content);
        if (parsed && parsed.years) {
          return { data: parsed, sha: data.sha };
        }
        return null;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  NEW SAVE MANAGER
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      // Called whenever data changes (CRUD, toggles, etc.)
      function markDirty() {
        // 1. Immediately persist to localStorage
        saveToCache(studyData);

        // 2. Increment version – this is the only thing that matters
        saveVersion++;

        // 3. Update status
        if (!isOffline) {
          updateSaveStatusUI('saving');
        } else {
          updateSaveStatusUI('offline');
        }

        // 4. Schedule a GitHub save
        scheduleSave();
      }

      function scheduleSave() {
        clearTimeout(debounceTimer);
        clearTimeout(maxWaitTimer);

        // Debounce timer
        debounceTimer = setTimeout(() => {
          debounceTimer = null;
          maxWaitTimer = null;
          runSaveManager();
        }, DEBOUNCE_DELAY);

        // Maximum wait – never let unsaved changes stay longer than 5s
        maxWaitTimer = setTimeout(() => {
          maxWaitTimer = null;
          if (debounceTimer) {
            clearTimeout(debounceTimer);
            debounceTimer = null;
          }
          runSaveManager();
        }, MAX_SAVE_DELAY);
      }

      async function runSaveManager() {
        // If we're offline, skip and wait for online event
        if (isOffline) {
          updateSaveStatusUI('offline');
          return;
        }

        // If already saving, the version counter will trigger another save later
        if (isSaving) {
          return;
        }

        // No new changes
        if (savedVersion === saveVersion) {
          updateSaveStatusUI('saved');
          return;
        }

        isSaving = true;
        updateSaveStatusUI('saving');

        try {
          // Loop until we catch up with all changes
          while (savedVersion !== saveVersion) {
            const versionToSave = saveVersion;
            // Snapshot current data
            const dataToSave = JSON.parse(JSON.stringify(studyData));

            try {
              await saveToGitHub(dataToSave);
              // If successful, mark this version as saved
              savedVersion = versionToSave;
              updateSaveStatusUI('saved');
            } catch (err) {
              // Handle 409 Conflict – refresh SHA and retry
              if (err.status === 409) {
                console.warn('409 Conflict – refreshing SHA and retrying...');
                try {
                  const latest = await refreshSHAFromGitHub();
                  if (latest) {
                    currentFileSha = latest.sha;
                    // Retry the same version (loop will continue)
                    continue;
                  } else {
                    throw new Error('Could not refresh SHA');
                  }
                } catch (refreshErr) {
                  console.error('Failed to refresh SHA:', refreshErr);
                  // Fall through – we'll handle the error below
                  throw refreshErr;
                }
              } else {
                // Other errors – rethrow
                throw err;
              }
            }
          }
          // All changes saved
          updateSaveStatusUI('saved');
        } catch (err) {
          console.error('Save failed:', err);
          updateSaveStatusUI('error');
          // Smart retry: if it's a network or 5xx error, retry after a delay
          if (err.status >= 500 || err.message.includes('network') || err.message.includes('fetch')) {
            setTimeout(() => {
              if (savedVersion !== saveVersion) {
                runSaveManager();
              }
            }, 5000);
          } else if (err.status === 401) {
            // Token expired – redirect to login
            showToast('GitHub token expired. Please log in again.', 'error');
            window.SessionManager.logout();
            window.location.href = 'login.html?redirect=studies';
          } else {
            // For other errors, try again after 10s
            setTimeout(() => {
              if (savedVersion !== saveVersion) {
                runSaveManager();
              }
            }, 10000);
          }
        } finally {
          isSaving = false;
          // If new changes came in during the save, start a new save
          if (savedVersion !== saveVersion) {
            runSaveManager();
          }
        }
      }

      async function saveToGitHub(data) {
        const { owner, repo, branch } = window.REPO_CONFIG;
        const path = getStudyPath();
        // Use cached SHA – this is the key improvement
        let sha = currentFileSha;

        try {
          const result = await GitHubAPI.updateFile(
            owner,
            repo,
            path,
            data,
            'Update study data',
            branch,
            user.pat,
            sha
          );
          // Update SHA from response
          if (result && result.content && result.content.sha) {
            currentFileSha = result.content.sha;
          } else {
            // Fallback: fetch the file to get SHA
            const file = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
            if (file && file.sha) currentFileSha = file.sha;
          }
          return true;
        } catch (err) {
          // Check for 409 conflict
          if (err.message && err.message.includes('409')) {
            err.status = 409;
          }
          throw err;
        }
      }

      async function refreshSHAFromGitHub() {
        const { owner, repo, branch } = window.REPO_CONFIG;
        const path = getStudyPath();
        try {
          const file = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
          if (file && file.sha) {
            return { sha: file.sha, content: file.content };
          }
        } catch(e) {}
        return null;
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  HELPERS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m); }
      function showToast(msg, type = 'info') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = `toast-item ${type}`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 400); }, 3000);
      }
      function getTopic(yi, si, ui, wi, ti) {
        try { return studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti]; } catch { return null; }
      }
      function recalcTopicCompletion(topic) {
        if (!topic.subtopics || !topic.subCompleted) { topic.completed = false; return; }
        while (topic.subCompleted.length < topic.subtopics.length) topic.subCompleted.push(false);
        while (topic.subCompleted.length > topic.subtopics.length) topic.subCompleted.pop();
        topic.completed = topic.subCompleted.every(Boolean);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  RENDER FUNCTIONS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function safeRender(fn) {
        try { fn(); } catch (e) { console.error('Render error:', e); showToast('Render error: ' + e.message, 'error'); }
      }

      function renderStats() {
        let totalUnits = 0, totalWeeks = 0, totalTopics = 0, doneTopics = 0, totalAssign = 0, pendingAssign = 0;
        studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => {
          totalUnits++;
          u.weeks.forEach(w => {
            totalWeeks++;
            w.topics.forEach(t => {
              totalTopics++;
              if (t.completed) doneTopics++;
            });
            w.assignments.forEach(a => {
              totalAssign++;
              if (a.status === 'pending' || a.status === 'in-progress') pendingAssign++;
            });
          });
        })));
        const el = (id) => document.getElementById(id);
        if (el('statYears')) el('statYears').textContent = studyData.years.length;
        if (el('statUnits')) el('statUnits').textContent = totalUnits;
        if (el('statWeeks')) el('statWeeks').textContent = totalWeeks;
        if (el('statTopicsDone')) el('statTopicsDone').textContent = doneTopics + '/' + totalTopics;
        if (el('statAssignments')) el('statAssignments').textContent = totalAssign;
        if (el('statPending')) el('statPending').textContent = pendingAssign;
      }

      function renderDeadlines() {
        const container = document.getElementById('deadlinesContainer');
        if (!container) return;
        const all = [];
        studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => u.weeks.forEach(w => w.assignments.forEach(a => {
          if (a.due) all.push({ ...a, week: w.number, unit: u.code });
        })))));
        all.sort((a,b) => new Date(a.due) - new Date(b.due));
        const upcoming = all.slice(0, 5);
        let html = `<div class="deadlines-widget"><h4>⏰ Upcoming Deadlines</h4>`;
        if (!upcoming.length) html += `<p class="text-muted-light">No upcoming deadlines. 🎉</p>`;
        else {
          const today = new Date();
          upcoming.forEach(a => {
            const days = Math.ceil((new Date(a.due) - today) / (1000*60*60*24));
            let cls = '', label = '';
            if (days < 0) { cls = 'overdue'; label = ' (Overdue)'; }
            else if (days <= 3) { cls = 'due-soon'; label = ' (Soon)'; }
            html += `<div class="deadline-item"><span>${escapeHtml(a.name)} <span class="text-muted-light">(${a.unit} W${a.week})</span></span><span class="${cls}">${a.due}${label}</span></div>`;
          });
        }
        html += `</div>`;
        container.innerHTML = html;
      }

      function renderAnalytics() {
        const container = document.getElementById('analyticsContainer');
        if (!container) return;
        const unitData = [];
        studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => {
          let totalSub = 0, doneSub = 0;
          u.weeks.forEach(w => w.topics.forEach(t => {
            totalSub += t.subtopics.length;
            doneSub += t.subCompleted.filter(Boolean).length;
          }));
          const pct = totalSub > 0 ? Math.round((doneSub/totalSub)*100) : 0;
          unitData.push({ code: u.code, pct });
        })));
        let html = `<div class="analytics-dashboard"><div class="analytics-card"><h4>📊 Unit Progress</h4>`;
        unitData.forEach(u => {
          html += `<div class="stat-row"><span class="label">${escapeHtml(u.code)}</span><span class="value">${u.pct}%</span></div>
                   <div class="mini-progress"><div class="fill" style="width:${u.pct}%"></div></div>`;
        });
        html += `</div>`;
        let totalTopics = 0, doneTopics = 0, totalAssign = 0, pendingAssign = 0;
        studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => u.weeks.forEach(w => {
          w.topics.forEach(t => { totalTopics++; if (t.completed) doneTopics++; });
          w.assignments.forEach(a => { totalAssign++; if (a.status === 'pending' || a.status === 'in-progress') pendingAssign++; });
        }))));
        const overall = totalTopics > 0 ? Math.round((doneTopics/totalTopics)*100) : 0;
        html += `<div class="analytics-card"><h4>📈 Overall Progress</h4>
          <div class="stat-row"><span class="label">Topics completed</span><span class="value">${doneTopics}/${totalTopics}</span></div>
          <div class="mini-progress"><div class="fill" style="width:${overall}%"></div></div>
          <div class="stat-row" style="margin-top:8px;"><span class="label">Assignments</span><span class="value">${totalAssign}</span></div>
          <div class="stat-row"><span class="label">Pending</span><span class="value">${pendingAssign}</span></div>
        </div>`;
        html += `<div class="analytics-card"><h4>📅 Weekly Activity</h4><div class="chart-container"><canvas id="weeklyAnalyticsChart"></canvas></div></div>`;
        html += `</div>`;
        container.innerHTML = html;
        setTimeout(() => {
          const canvas = document.getElementById('weeklyAnalyticsChart');
          if (!canvas) return;
          const weekly = {};
          studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => u.weeks.forEach(w => {
            const key = y.name + ' W' + w.number;
            let total = 0, done = 0;
            w.topics.forEach(t => {
              total += t.subtopics.length;
              done += t.subCompleted.filter(Boolean).length;
            });
            if (!weekly[key]) weekly[key] = { total: 0, done: 0 };
            weekly[key].total += total;
            weekly[key].done += done;
          }))));
          const labels = Object.keys(weekly).sort();
          const doneData = labels.map(k => weekly[k].done);
          const totalData = labels.map(k => weekly[k].total);
          if (analyticsChart) analyticsChart.destroy();
          analyticsChart = new Chart(canvas, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [
                { label: 'Completed', data: doneData, backgroundColor: 'rgba(0,184,148,0.6)' },
                { label: 'Total', data: totalData, backgroundColor: 'rgba(47,199,255,0.2)' }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { labels: { color: '#e0e8ee', font: { size: 9 } } }
              },
              scales: {
                x: { ticks: { color: '#8a9fb0', font: { size: 8 } } },
                y: { ticks: { color: '#8a9fb0', font: { size: 8 } } }
              }
            }
          });
        }, 200);
      }

      function renderTree() {
        const container = document.getElementById('treeContainer');
        if (!container) return;
        container.innerHTML = '';
        if (!studyData.years || studyData.years.length === 0) {
          container.innerHTML = `<div class="text-center text-muted-light py-5"><i class="fa fa-graduation-cap" style="font-size:3rem;display:block;margin-bottom:12px;opacity:0.3;"></i><h4>No study data yet</h4></div>`;
          return;
        }

        const searchLower = searchTerm.toLowerCase().trim();

        studyData.years.forEach((year, yi) => {
          const yearKey = `year_${yi}`;
          const isOpen = expanded[yearKey] || false;
          const sec = document.createElement('div');
          sec.className = 'level-section';
          sec.innerHTML = `
            <div class="level-header" onclick="toggleExpand('${yearKey}')">
              <div>
                <div class="name">📅 ${escapeHtml(year.name)}</div>
                <div class="meta">${year.semesters.length} semesters</div>
              </div>
              <div class="actions">
                <button class="btn btn-add" onclick="event.stopPropagation();addSemester(${yi})"><i class="fa fa-plus"></i> Semester</button>
                <button class="btn btn-edit" onclick="event.stopPropagation();editYear(${yi})"><i class="fa fa-pencil"></i></button>
                <button class="btn btn-del" onclick="event.stopPropagation();deleteYear(${yi})"><i class="fa fa-trash"></i></button>
                <i class="fa fa-chevron-${isOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
              </div>
            </div>
            <div class="level-body ${isOpen ? 'open' : ''}">
          `;
          year.semesters.forEach((semester, si) => {
            const semKey = `semester_${yi}_${si}`;
            const semOpen = expanded[semKey] || false;
            const semDiv = document.createElement('div');
            semDiv.className = 'level-section';
            semDiv.style.marginBottom = '12px';
            semDiv.innerHTML = `
              <div class="level-header" onclick="toggleExpand('${semKey}')">
                <div>
                  <div class="name">📘 ${escapeHtml(semester.name)}</div>
                  <div class="meta">${semester.units.length} units</div>
                </div>
                <div class="actions">
                  <button class="btn btn-add" onclick="event.stopPropagation();addUnit(${yi}, ${si})"><i class="fa fa-plus"></i> Unit</button>
                  <button class="btn btn-edit" onclick="event.stopPropagation();editSemester(${yi}, ${si})"><i class="fa fa-pencil"></i></button>
                  <button class="btn btn-del" onclick="event.stopPropagation();deleteSemester(${yi}, ${si})"><i class="fa fa-trash"></i></button>
                  <i class="fa fa-chevron-${semOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
                </div>
              </div>
              <div class="level-body ${semOpen ? 'open' : ''}">
            `;
            semester.units.forEach((unit, ui) => {
              const unitKey = `unit_${yi}_${si}_${ui}`;
              const unitOpen = expanded[unitKey] || false;
              const weeks = unit.weeks || [];
              let totalSub = 0, doneSub = 0;
              weeks.forEach(w => w.topics.forEach(t => { totalSub += t.subtopics.length; doneSub += t.subCompleted.filter(Boolean).length; }));
              const pct = totalSub > 0 ? Math.round((doneSub/totalSub)*100) : 0;
              const doneWeeks = weeks.filter(w => w.topics.every(t => t.completed)).length;
              const unitCard = document.createElement('div');
              unitCard.className = 'level-section';
              unitCard.style.marginBottom = '12px';
              unitCard.style.borderLeft = unit.color ? `4px solid ${unit.color}` : '';
              unitCard.innerHTML = `
                <div class="level-header" onclick="toggleExpand('${unitKey}')">
                  <div>
                    <div class="name">${escapeHtml(unit.code)} – ${escapeHtml(unit.name)}</div>

                    <button class="btn btn-edit" onclick="event.stopPropagation();editUnit(${yi}, ${si}, ${ui})"><i class="fa fa-pencil"></i></button>
                    <button class="btn btn-del" onclick="event.stopPropagation();deleteUnit(${yi}, ${si}, ${ui})"><i class="fa fa-trash"></i></button>

              weeks.forEach((week, wi) => {

                if (searchLower) {
                  hasMatch = topics.some(t => t.name.toLowerCase().includes(searchLower));
                }
                if (searchLower && !hasMatch) return;
                let totalSubW = 0, doneSubW = 0;
                topics.forEach(t => {
                  totalSubW += t.subtopics.length;
                  doneSubW += t.subCompleted.filter(Boolean).length;

                const weekDiv = document.createElement('div');
                weekDiv.className = 'level-section';
                weekDiv.style.marginBottom = '8px';
                weekDiv.style.borderColor = 'var(--border-subtle)';
                weekDiv.innerHTML = `
                  <div class="level-header" onclick="toggleExpand('${weekKey}')" style="padding:8px 14px;">
                    <div>
                      <div class="name">📌 Week ${week.number}</div>
                      <div class="meta">${doneSubW}/${totalSubW} subtopics · ${pctW}%</div>
                    </div>
                    <div class="actions">
                      <button class="btn btn-add" onclick="event.stopPropagation();addTopic(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Topic</button>
                      <button class="btn btn-add" onclick="event.stopPropagation();addAssignment(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Assignment</button>
                      <button class="btn btn-edit" onclick="event.stopPropagation();editWeek(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-pencil"></i></button>
                      <button class="btn btn-del" onclick="event.stopPropagation();deleteWeek(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-trash"></i></button>
                      <button class="btn btn-bulk" onclick="event.stopPropagation();bulkToggleWeek(${yi},${si},${ui},${wi},true)">✅ All</button>
                      <button class="btn btn-bulk" onclick="event.stopPropagation();bulkToggleWeek(${yi},${si},${ui},${wi},false)">↩️ None</button>
                    </div>
                  </div>
                  <div class="level-body ${weekOpen ? 'open' : ''}">
                `;
                topics.forEach((topic, ti) => {
                  if (searchLower && !topic.name.toLowerCase().includes(searchLower)) return;
                  recalcTopicCompletion(topic);
                  const subTopics = topic.subtopics || [];
                  const subDone = topic.subCompleted.filter(Boolean).length;
                  const checked = topic.completed || false;
                  const topicKey = `topic_${yi}_${si}_${ui}_${wi}_${ti}`;
                  const topicExpanded = expanded[topicKey] || false;
                  const tDiv = document.createElement('div');
                  tDiv.className = `topic-item ${compactMode ? 'compact' : ''}`;

                                 onclick="toggleSubtopic(this, ${yi}, ${si}, ${ui}, ${wi}, ${ti}, ${si2})">
                              <i class="fa fa-check"></i>
                            </div>
                            <div class="sub-label ${subChecked ? 'done' : ''}">${escapeHtml(sub)}</div>
                            <div class="sub-actions">
                              <button class="btn" onclick="deleteSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti}, ${si2})"><i class="fa fa-times"></i></button>

                      <div class="subtopic-add-row">

                    <div class="section-title"><i class="fa fa-tasks"></i> Assignments
                      <button class="btn btn-add-ass" onclick="addAssignment(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Add</button>
                    </div>
                  `;
                  assignments.forEach((a, ai) => {
                    const statusClass = a.status === 'pending' ? 'pending' :
                      a.status === 'in-progress' ? 'in-progress' : 'submitted';
                    const statusLabel = a.status === 'pending' ? 'Pending' :
                      a.status === 'in-progress' ? 'In Progress' : '✅ Submitted';
                    assHtml += `
                      <div class="assignment-item">

                        <div class="ass-due">${a.due || 'No due date'}</div>

                        <div class="ass-marks">${a.marks || '—'}</div>

                          <button class="btn btn-edit-ass" onclick="editAssignment(${yi}, ${si}, ${ui}, ${wi}, ${ai})"><i class="fa fa-pencil"></i></button>

                weekDiv.querySelector('.level-body').innerHTML += `</div>`;
                weekDiv.innerHTML += `</div>`;

              });
              unitCard.querySelector('.level-body').innerHTML += `</div>`;
              unitCard.innerHTML += `</div>`;
              semDiv.querySelector('.level-body').appendChild(unitCard);
            });
            semDiv.querySelector('.level-body').innerHTML += `</div>`;
            semDiv.innerHTML += `</div>`;
            sec.querySelector('.level-body').appendChild(semDiv);

          sec.querySelector('.level-body').innerHTML += `</div>`;
          sec.innerHTML += `</div>`;

      function render() {
        safeRender(renderStats);
        safeRender(renderDeadlines);
        safeRender(renderAnalytics);
        safeRender(renderTree);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  TOGGLE FUNCTIONS (they now call markDirty)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      window.toggleExpand = function(key) {
        expanded[key] = !expanded[key];
        render();
      };
      window.toggleTopicComplete = function(el, yi, si, ui, wi, ti) {
        const topic = getTopic(yi, si, ui, wi, ti);
        if (!topic) return;
        topic.completed = !topic.completed;
        if (topic.subtopics.length) {
          topic.subCompleted = topic.subtopics.map(() => topic.completed);
        } else {
          topic.subCompleted = [];
        }
        el.classList.toggle('checked', topic.completed);
        const topicItem = el.closest('.topic-item');
        if (topicItem) {
          topicItem.querySelectorAll('.sub-check').forEach(sub => sub.classList.toggle('checked', topic.completed));
          topicItem.querySelectorAll('.sub-label').forEach(label => label.classList.toggle('done', topic.completed));
        }
        renderStats();
        renderAnalytics();
        renderDeadlines();
        markDirty(); // This replaces scheduleSave
      };
      window.toggleSubtopic = function(el, yi, si, ui, wi, ti, si2) {
        const topic = getTopic(yi, si, ui, wi, ti);
        if (!topic) return;
        if (!topic.subCompleted) topic.subCompleted = topic.subtopics.map(() => false);
        topic.subCompleted[si2] = !topic.subCompleted[si2];
        recalcTopicCompletion(topic);
        el.classList.toggle('checked', topic.subCompleted[si2]);
        const label = el.parentElement.querySelector('.sub-label');
        if (label) label.classList.toggle('done', topic.subCompleted[si2]);
        const topicItem = el.closest('.topic-item');
        if (topicItem) {
          const parentCheck = topicItem.querySelector('.topic-header .check');
          if (parentCheck) parentCheck.classList.toggle('checked', topic.completed);
          const allSubs = topicItem.querySelectorAll('.sub-check');
          allSubs.forEach((sub, idx) => {
            const subLabel = sub.parentElement.querySelector('.sub-label');
            if (subLabel) subLabel.classList.toggle('done', topic.subCompleted[idx]);
          });
        }
        renderStats();
        renderAnalytics();
        renderDeadlines();
        markDirty();
      };
      window.bulkToggleWeek = function(yi, si, ui, wi, complete) {
        const week = studyData.years[yi]?.semesters[si]?.units[ui]?.weeks[wi];
        if (!week) return;
        week.topics.forEach(topic => {
          topic.completed = complete;
          if (topic.subtopics && topic.subtopics.length) {
            topic.subCompleted = topic.subtopics.map(() => complete);
          } else {
            topic.subCompleted = [];
          }
        });
        render();
        markDirty();
        showToast(complete ? '✅ All topics marked complete' : '↩️ All topics uncompleted', 'info');
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  EXPAND / COLLAPSE ALL
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      window.expandAll = function() {
        document.querySelectorAll('.level-body').forEach(el => el.classList.add('open'));
        document.querySelectorAll('.level-header .fa-chevron-down, .level-header .fa-chevron-up').forEach(el => {
          el.classList.toggle('fa-chevron-down');
          el.classList.toggle('fa-chevron-up');
        });
      };
      window.collapseAll = function() {
        document.querySelectorAll('.level-body').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.level-header .fa-chevron-down, .level-header .fa-chevron-up').forEach(el => {
          if (el.classList.contains('fa-chevron-up')) {
            el.classList.remove('fa-chevron-up');
            el.classList.add('fa-chevron-down');
          }
        });
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  IMPORT / EXPORT JSON
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function exportJSON() {
        const blob = new Blob([JSON.stringify(studyData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `study_plan_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 Study plan exported', 'success');
      }

      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data.years || !Array.isArray(data.years)) {
              showToast('❌ Invalid file: missing "years" array', 'error');
              return;
            }
            if (!confirm('This will replace ALL current data. Continue?')) return;
            studyData = data;
            expanded = {};
            render();
            markDirty();
            showToast('✅ Study plan imported successfully', 'success');
          } catch (err) {
            showToast('❌ Failed to parse JSON: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      }

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  KEYBOARD SHORTCUTS
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'e') { e.preventDefault(); expandAll(); }
        if (e.ctrlKey && e.key === 'w') { e.preventDefault(); collapseAll(); }
        if (e.ctrlKey && e.key === 's') { e.preventDefault(); markDirty(); showToast('🔄 Saving…', 'info'); }
        if (e.ctrlKey && e.key === 'f') {
          e.preventDefault();
          const searchInput = document.getElementById('searchInput');
          if (searchInput) { searchInput.focus(); searchInput.select(); }
        }
      });

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  GRADE CALCULATOR
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function calculateUnitGrade(unit) {
        const allAssignments = [];
        (unit.weeks || []).forEach(week => {
          (week.assignments || []).forEach(ass => {
            allAssignments.push(ass);
          });
        });
        let totalWeight = 0, weightedSum = 0, missingMarks = 0;
        allAssignments.forEach(ass => {
          const weight = parseFloat(ass.weight) || 0;
          totalWeight += weight;
          const marks = parseFloat(ass.marks);
          if (!isNaN(marks) && marks >= 0 && marks <= 100) {
            weightedSum += marks * (weight / 100);
          } else {
            missingMarks += weight;
          }
        });
        if (allAssignments.length === 0 || totalWeight === 0) return null;
        const achievedWeight = totalWeight - missingMarks;
        const currentGrade = achievedWeight > 0 ? (weightedSum / achievedWeight) * 100 : null;
        return { grade: currentGrade, totalWeight, weightedSum, missingMarks, allAssignments, achievedWeight };
      }

      function renderGradeModal(yi, si, ui) {
        const unit = studyData.years[yi]?.semesters[si]?.units[ui];
        if (!unit) return;
        const result = calculateUnitGrade(unit);
        const body = document.getElementById('gradeModalBody');
        let html = '';
        let gradeDisplay = 'N/A', gradeColor = 'red', gradeValue = 0;
        if (result) {
          if (result.grade !== null) {
            gradeValue = Math.round(result.grade);
            gradeDisplay = gradeValue + '%';
            gradeColor = gradeValue >= 70 ? 'green' : (gradeValue >= 50 ? 'orange' : 'red');
          } else {
            gradeDisplay = '—';
          }
        } else {
          gradeDisplay = 'No assignments';
        }
        html += `
          <div class="grade-summary">
            <div class="card"><div class="value ${gradeColor}">${gradeDisplay}</div><div class="label">Current Grade</div></div>
            <div class="card"><div class="value">${result ? (result.missingMarks > 0 ? '⏳' : '✅') : '—'}</div><div class="label">${result ? (result.missingMarks > 0 ? result.missingMarks.toFixed(0)+'% pending' : 'All marked') : '—'}</div></div>
            <div class="card"><div class="value">${result ? result.allAssignments.length : 0}</div><div class="label">Assignments</div></div>
          </div>
        `;
        if (result && result.allAssignments.length > 0) {
          html += `<div style="margin-top:12px;max-height:260px;overflow-y:auto;">`;
          result.allAssignments.forEach((ass, idx) => {
            const marksVal = ass.marks || '';
            const isPending = ass.status === 'pending' || ass.status === 'in-progress';
            const statusClass = isPending ? 'pending' : 'submitted';
            const statusLabel = isPending ? 'Pending' : 'Submitted';
            html += `
              <div class="assignment-row" data-idx="${idx}">
                <div class="name">${escapeHtml(ass.name)}</div>
                <div class="weight">${ass.weight || 0}%</div>
                <input type="number" class="marks-input" value="${marksVal}" min="0" max="100" step="0.5"
                  data-yi="${yi}" data-si="${si}" data-ui="${ui}" data-idx="${idx}"
                  onchange="updateGradeMark(this)" placeholder="Marks">
                <span class="status-badge ${statusClass}">${statusLabel}</span>
              </div>
            `;
          });
          html += `</div>`;
          const currentGrade = result.grade;
          const missingWeight = result.missingMarks || 0;
          const achievedWeight = result.achievedWeight || 0;
          const totalWeight = result.totalWeight || 100;
          html += `
            <div class="what-if">
              <div style="font-weight:600;margin-bottom:8px;">🎯 What-If Scenario</div>
              <div class="input-group">
                <span>Target grade:</span>
                <input type="number" id="targetGradeInput" value="${Math.round(currentGrade || 70)}" min="0" max="100" step="0.5"
                  oninput="updateWhatIf(${yi}, ${si}, ${ui}, this.value)">
                <span>%</span>
              </div>
              <div id="whatIfResult" style="margin-top:8px;">
                ${currentGrade !== null ? (missingWeight > 0 ? 'Enter marks to see what-if.' : '✅ All done!') : 'Enter marks to see what-if.'}
              </div>
            </div>
          `;
        } else {
          html += `<p style="color:var(--text-secondary);">No assignments found for this unit.</p>`;
        }
        body.innerHTML = html;
        document.getElementById('gradeModalTitle').textContent = `📊 Grade Calculator – ${unit.code} ${unit.name}`;
        if (result && result.grade !== null) {
          setTimeout(() => {
            const targetInput = document.getElementById('targetGradeInput');
            if (targetInput) updateWhatIf(yi, si, ui, targetInput.value);
          }, 100);
        }
      }

      window.updateGradeMark = function(input) {
        const yi = parseInt(input.dataset.yi);
        const si = parseInt(input.dataset.si);
        const ui = parseInt(input.dataset.ui);
        const idx = parseInt(input.dataset.idx);
        const unit = studyData.years[yi]?.semesters[si]?.units[ui];
        if (!unit) return;
        const flatAssignments = [];
        (unit.weeks || []).forEach(week => {
          (week.assignments || []).forEach(ass => {
            flatAssignments.push(ass);
          });
        });
        if (idx < flatAssignments.length) {
          const ass = flatAssignments[idx];
          ass.marks = input.value;
          markDirty();
          if (gradeModalOpen) {
            renderGradeModal(yi, si, ui);
            const newInput = document.querySelector(`.marks-input[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-idx="${idx}"]`);
            if (newInput) newInput.focus();
          }
          showToast('✅ Marks updated', 'success');
        }
      };

      window.updateWhatIf = function(yi, si, ui, target) {
        const unit = studyData.years[yi]?.semesters[si]?.units[ui];
        if (!unit) return;
        const result = calculateUnitGrade(unit);
        if (!result || result.grade === null) {
          document.getElementById('whatIfResult').innerHTML = 'Enter marks to see what-if.';
          return;
        }
        const currentGrade = result.grade;
        const missingWeight = result.missingMarks || 0;
        const achievedWeight = result.achievedWeight || 0;
        const totalWeight = result.totalWeight || 100;
        const targetNum = parseFloat(target);
        if (isNaN(targetNum) || targetNum < 0 || targetNum > 100) {
          document.getElementById('whatIfResult').innerHTML = 'Please enter a valid target (0-100).';
          return;
        }
        const resultDiv = document.getElementById('whatIfResult');
        if (missingWeight === 0) {
          resultDiv.innerHTML = `✅ All assignments already have marks. Your grade is <strong>${Math.round(currentGrade)}%</strong>.`;
          return;
        }
        const needed = (targetNum * totalWeight - currentGrade * achievedWeight / 100) / missingWeight * 100;
        if (needed > 100) {
          resultDiv.innerHTML = `❌ <span class="impossible">Even scoring 100% on all remaining assignments (${missingWeight}%) will only get you ${((currentGrade * achievedWeight / 100 + missingWeight) / totalWeight * 100).toFixed(1)}%</span>`;
        } else if (needed < 0) {
          resultDiv.innerHTML = `✅ You already have <strong>${Math.round(currentGrade)}%</strong>. You can score 0% on remaining assignments and still reach ${targetNum}%.`;
        } else {

          deadSheet.getCell(`B${dRowDead}`).font = { size: 18, bold: true, color: { argb: 'FF0B2B3B' } };
          deadSheet.mergeCells(`B${dRowDead}:G${dRowDead}`);
          dRowDead += 1;

          const deadHeaders2 = ['Priority', 'Assignment', 'Unit', 'Due Date', 'Days Remaining', 'Status'];
          const deadCols2 = ['B', 'C', 'D', 'E', 'F', 'G'];
          const hRowDead = deadSheet.getRow(dRowDead);
          deadHeaders2.forEach((h, idx) => {
            const cell = hRowDead.getCell(deadCols2[idx]);
            cell.value = h;
            cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B2B3B' } };
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
          });
          dRowDead++;
          deadSheet.getColumn('B').width = 14;
          deadSheet.getColumn('C').width = 28;
          deadSheet.getColumn('D').width = 14;
          deadSheet.getColumn('E').width = 16;
          deadSheet.getColumn('F').width = 16;
          deadSheet.getColumn('G').width = 16;

          allAssign.sort((a,b) => new Date(a.due) - new Date(b.due));
          allAssign.forEach(a => {
            const due = new Date(a.due);
            const days = Math.ceil((due - today) / (1000*60*60*24));
            const row = deadSheet.getRow(dRowDead);
            let priority = '🟢 LATER';
            let daysCls = 'FF00B894';
            if (days < 0) { priority = '🔴 OVERDUE'; daysCls = 'FFE17055'; }
            else if (days <= 3) { priority = '🔴 URGENT'; daysCls = 'FFE17055'; }
            else if (days <= 7) { priority = '🟠 SOON'; daysCls = 'FFFDCB6E'; }
            row.getCell('B').value = priority;
            row.getCell('C').value = a.name;
            row.getCell('D').value = a.unit;
            row.getCell('E').value = a.due;
            row.getCell('F').value = days + ' days';
            row.getCell('F').font = { bold: true, color: { argb: daysCls } };
            row.getCell('G').value = a.status === 'submitted' ? '✅ Submitted' : (a.status === 'in-progress' ? '🟡 In Progress' : '🔴 Pending');
            const statusCell = row.getCell('G');
            if (a.status === 'submitted') statusCell.font = { color: { argb: 'FF00B894' }, bold: true };
            else if (a.status === 'in-progress') statusCell.font = { color: { argb: 'FFFDCB6E' }, bold: true };
            else statusCell.font = { color: { argb: 'FFE17055' }, bold: true };
            dRowDead++;
          });

          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          //  5. ANALYTICS SHEET (data bars + tables, no charts)
          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          const analyticsSheet = workbook.addWorksheet('Analytics', {
            pageSetup: { orientation: 'landscape', fitToPage: true }
          });
          analyticsSheet.views = [{ showGridLines: false, showRowColHeaders: false }];
          let aRow = addNavigation(analyticsSheet, 1) + 1;

          analyticsSheet.getCell(`B${aRow}`).value = '📈 ANALYTICS DASHBOARD';
          analyticsSheet.getCell(`B${aRow}`).font = { size: 18, bold: true, color: { argb: 'FF0B2B3B' } };
          analyticsSheet.mergeCells(`B${aRow}:M${aRow}`);
          aRow += 2;

          analyticsSheet.getCell(`B${aRow}`).value = 'UNIT PROGRESS (%)';
          analyticsSheet.getCell(`B${aRow}`).font = { size: 12, bold: true, color: { argb: 'FF0B2B3B' } };
          aRow += 1;
          unitProgressData.forEach((u, idx) => {
            const row = aRow + idx;
            analyticsSheet.getCell(`B${row}`).value = u.code;
            analyticsSheet.getCell(`B${row}`).font = { bold: true, size: 9 };
            analyticsSheet.getCell(`C${row}`).value = u.pct;
            try {
              analyticsSheet.addConditionalFormatting({
                ref: `C${row}`,
                rules: [{
                  type: 'dataBar',
                  cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 100 }],
                  color: { argb: u.color || 'FF2FC7FF' }
                }]
              });
            } catch(e) {}
            analyticsSheet.getCell(`D${row}`).value = u.pct + '%';
            analyticsSheet.getCell(`D${row}`).font = { size: 8, color: { argb: 'FF4A627A' } };
            analyticsSheet.getRow(row).height = 18;
          });
          aRow += unitProgressData.length + 1;

          const weeklyData = {};
          studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => u.weeks.forEach(w => {
            const key = y.name + ' W' + w.number;
            let total = 0, done = 0;
            w.topics.forEach(t => { total += t.subtopics.length; done += t.subCompleted.filter(Boolean).length; });
            if (!weeklyData[key]) weeklyData[key] = { total: 0, done: 0 };
            weeklyData[key].total += total;
            weeklyData[key].done += done;
          }))));
          const weeks = Object.keys(weeklyData).sort();
          const pctData = weeks.map(k => weeklyData[k].total > 0 ? Math.round((weeklyData[k].done / weeklyData[k].total) * 100) : 0);

          analyticsSheet.getCell(`F${aRow - unitProgressData.length - 2}`).value = 'WEEKLY PROGRESS (%)';
          analyticsSheet.getCell(`F${aRow - unitProgressData.length - 2}`).font = { size: 12, bold: true, color: { argb: 'FF0B2B3B' } };
          const wkRowStart = aRow - unitProgressData.length - 1;
          weeks.forEach((wk, idx) => {
            const row = wkRowStart + idx;
            analyticsSheet.getCell(`F${row}`).value = wk;
            analyticsSheet.getCell(`F${row}`).font = { size: 8 };
            analyticsSheet.getCell(`G${row}`).value = pctData[idx];
            try {
              analyticsSheet.addConditionalFormatting({
                ref: `G${row}`,
                rules: [{
                  type: 'dataBar',
                  cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 100 }],
                  color: { argb: 'FF2FC7FF' }
                }]
              });
            } catch(e) {}
            analyticsSheet.getCell(`H${row}`).value = pctData[idx] + '%';
            analyticsSheet.getCell(`H${row}`).font = { size: 8, color: { argb: 'FF4A627A' } };
            analyticsSheet.getRow(row).height = 16;
          });
          aRow = wkRowStart + weeks.length + 2;

          analyticsSheet.getCell(`B${aRow}`).value = 'ASSIGNMENT STATUS';
          analyticsSheet.getCell(`B${aRow}`).font = { size: 12, bold: true, color: { argb: 'FF0B2B3B' } };
          aRow += 1;
          const statData = [
            ['✅ Submitted', totalAssign - pendingAssign],
            ['🔴 Pending', pendingAssign]
          ];
          statData.forEach(([label, count], idx) => {
            const row = aRow + idx;
            analyticsSheet.getCell(`B${row}`).value = label;
            analyticsSheet.getCell(`C${row}`).value = count;
            analyticsSheet.getCell(`D${row}`).value = totalAssign > 0 ? Math.round((count / totalAssign) * 100) + '%' : '0%';
            analyticsSheet.getRow(row).height = 18;
          });
          aRow += statData.length + 1;

          const topicData = {};
          studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => u.weeks.forEach(w => w.topics.forEach(t => {
            const subCount = t.subtopics.length;
            const doneCount = (t.subCompleted || []).filter(Boolean).length;
            const pct = subCount > 0 ? Math.round((doneCount / subCount) * 100) : (t.completed ? 100 : 0);
            if (!topicData[u.code]) topicData[u.code] = { total: 0, done: 0 };
            topicData[u.code].total += subCount;
            topicData[u.code].done += doneCount;
          })))));
          const codes = Object.keys(topicData);
          analyticsSheet.getCell(`F${aRow - statData.length - 2}`).value = 'TOPIC COMPLETION BY UNIT';
          analyticsSheet.getCell(`F${aRow - statData.length - 2}`).font = { size: 12, bold: true, color: { argb: 'FF0B2B3B' } };
          const tcRow = aRow - statData.length - 1;
          codes.forEach((code, idx) => {
            const total = topicData[code].total;
            const done = topicData[code].done;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            const row = tcRow + idx;
            analyticsSheet.getCell(`F${row}`).value = code;
            analyticsSheet.getCell(`G${row}`).value = pct;
            try {
              analyticsSheet.addConditionalFormatting({
                ref: `G${row}`,
                rules: [{
                  type: 'dataBar',
                  cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 100 }],
                  color: { argb: unitColors[code]?.main || 'FF2FC7FF' }
                }]
              });
            } catch(e) {}
            analyticsSheet.getCell(`H${row}`).value = pct + '%';
            analyticsSheet.getCell(`H${row}`).font = { size: 8, color: { argb: 'FF4A627A' } };
            analyticsSheet.getRow(row).height = 16;
          });

          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          //  6. UNIT SHEETS
          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          studyData.years.forEach(y => y.semesters.forEach(s => s.units.forEach(u => {
            const color = unitColors[u.code] || defaultColor;
            const sheet = workbook.addWorksheet(u.code, {
              pageSetup: { orientation: 'landscape', fitToPage: true }
            });
            sheet.views = [{ showGridLines: true, state: 'frozen', ySplit: 2 }];
            let uRow = addNavigation(sheet, 1) + 1;

            sheet.mergeCells(`B${uRow}:H${uRow}`);
            const uTitle = sheet.getCell(`B${uRow}`);
            uTitle.value = `${u.code} – ${u.name}`;
            uTitle.font = { size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
            uTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: color.dark || 'FF0B2B3B' } };
            uTitle.alignment = { horizontal: 'center', vertical: 'middle' };
            sheet.getRow(uRow).height = 32;
            uRow += 1;

            const wHeaders = ['Week', 'Topic', 'Subtopics', 'Progress', 'Assignments'];
            const wCols = ['B', 'C', 'D', 'E', 'F'];
            const hRowUnit = sheet.getRow(uRow);
            wHeaders.forEach((h, idx) => {
              const cell = hRowUnit.getCell(wCols[idx]);
              cell.value = h;
              cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: color.dark || 'FF0B2B3B' } };
              cell.alignment = { horizontal: 'center', vertical: 'middle' };
            });
            uRow++;
            sheet.getColumn('B').width = 10;
            sheet.getColumn('C').width = 30;
            sheet.getColumn('D').width = 35;
            sheet.getColumn('E').width = 16;
            sheet.getColumn('F').width = 25;

            u.weeks.forEach(w => {
              w.topics.forEach(t => {
                const row = sheet.getRow(uRow);
                row.getCell('B').value = 'W' + w.number;
                row.getCell('C').value = t.name;
                row.getCell('D').value = (t.subtopics || []).join('; ');
                const subCount = t.subtopics.length;
                const doneCount = (t.subCompleted || []).filter(Boolean).length;
                const pct = subCount > 0 ? Math.round((doneCount / subCount) * 100) : (t.completed ? 100 : 0);
                row.getCell('E').value = pct;
                try {
                  sheet.addConditionalFormatting({
                    ref: `E${uRow}`,
                    rules: [{
                      type: 'dataBar',
                      cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 100 }],
                      color: { argb: color.main || 'FF2FC7FF' }
                    }]
                  });
                } catch(e) {}
                row.getCell('E').alignment = { horizontal: 'left', vertical: 'middle' };
                const assNames = w.assignments.map(a => a.name).join('; ');
                row.getCell('F').value = assNames || '—';
                uRow++;
              });
            });
          })));

          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          //  RAW DATA (hidden)
          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          const rawSheet = workbook.addWorksheet('Raw Data', {
            pageSetup: { orientation: 'landscape', fitToPage: true }
          });
          rawSheet.state = 'hidden';
          rawSheet.views = [{ showGridLines: true }];
          const rawData = JSON.stringify(studyData, null, 2);
          rawSheet.getCell('A1').value = 'Full JSON Data:';
          rawSheet.getCell('A2').value = rawData;
          rawSheet.getColumn('A').width = 200;

          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          //  SAVE
          // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          const buffer = await workbook.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          saveAs(blob, `StudyPlan_2026_${new Date().toISOString().slice(0,10)}.xlsx`);
          showToast('✅ Academic dashboard exported successfully!', 'success');
        } catch (err) {
          console.error(err);
          showToast('Export failed: ' + err.message, 'error');
        } finally {
          window.hideLoading();
        }
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  CRUD OPERATIONS (now call markDirty instead of scheduleSave)
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      function openModal(title, bodyHTML, onSave) {
        const modal = document.getElementById('genericModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = bodyHTML;
        modal.classList.add('open');
        modal._onSave = onSave;
      }

      document.getElementById('modalCancel').addEventListener('click', function() {
        document.getElementById('genericModal').classList.remove('open');
      });

      document.getElementById('modalSave').addEventListener('click', function() {
        const modal = document.getElementById('genericModal');
        const onSave = modal._onSave;
        if (typeof onSave === 'function') {
          const result = onSave();
          if (result !== false) {
            modal.classList.remove('open');
            render();
            markDirty();
            showToast('✅ Saved', 'success');
          }
        }
      });

      // ─── Years ───
      window.addYear = function() {
        openModal('Add Year', `
          <div class="form-group"><label>Year Name (e.g. 2026)</label><input type="text" id="yearName" placeholder="2026" /></div>
        `, () => {
          const name = document.getElementById('yearName').value.trim();
          if (!name) { showToast('Please enter a year name.', 'error'); return false; }
          studyData.years.push({ name, semesters: [] });
          return true;
        });
      };

      window.editYear = function(yi) {
        const year = studyData.years[yi];
        openModal('Edit Year', `
          <div class="form-group"><label>Year Name</label><input type="text" id="yearName" value="${escapeHtml(year.name)}" /></div>
        `, () => {
          const name = document.getElementById('yearName').value.trim();
          if (!name) { showToast('Please enter a year name.', 'error'); return false; }
          year.name = name;
          return true;
        });
      };

      window.deleteYear = function(yi) {
        if (!confirm('Delete this year and all its semesters, units, weeks, topics, and assignments?')) return;
        studyData.years.splice(yi, 1);
        render();
        markDirty();
      };

      // ─── Semesters ───
      window.addSemester = function(yi) {
        openModal('Add Semester', `
          <div class="form-group"><label>Semester Name (e.g. Semester 2)</label><input type="text" id="semesterName" placeholder="Semester 2" /></div>
        `, () => {
          const name = document.getElementById('semesterName').value.trim();
          if (!name) { showToast('Please enter a semester name.', 'error'); return false; }
          studyData.years[yi].semesters.push({ name, units: [] });
          return true;
        });
      };

      window.editSemester = function(yi, si) {
        const sem = studyData.years[yi].semesters[si];
        openModal('Edit Semester', `
          <div class="form-group"><label>Semester Name</label><input type="text" id="semesterName" value="${escapeHtml(sem.name)}" /></div>
        `, () => {
          const name = document.getElementById('semesterName').value.trim();
          if (!name) { showToast('Please enter a semester name.', 'error'); return false; }
          sem.name = name;
          return true;
        });
      };

      window.deleteSemester = function(yi, si) {
        if (!confirm('Delete this semester and all its units?')) return;
        studyData.years[yi].semesters.splice(si, 1);
        render();
        markDirty();
      };

      // ─── Units ───
      window.addUnit = function(yi, si) {
        openModal('Add Unit', `
          <div class="form-group"><label>Unit Code</label><input type="text" id="unitCode" placeholder="BSC106" /></div>
          <div class="form-group"><label>Unit Name</label><input type="text" id="unitName" placeholder="Engineering Mathematics 2" /></div>
          <div class="form-group"><label>Color</label><input type="text" id="unitColor" value="#2fc7ff" /></div>
        `, () => {
          const code = document.getElementById('unitCode').value.trim();
          const name = document.getElementById('unitName').value.trim();
          const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';
          if (!name) { showToast('Please enter a unit name.', 'error'); return false; }
          studyData.years[yi].semesters[si].units.push({ code, name, color, weeks: [] });
          return true;
        });
      };

      window.editUnit = function(yi, si, ui) {
        const unit = studyData.years[yi].semesters[si].units[ui];
        openModal('Edit Unit', `
          <div class="form-group"><label>Unit Code</label><input type="text" id="unitCode" value="${escapeHtml(unit.code)}" /></div>
          <div class="form-group"><label>Unit Name</label><input type="text" id="unitName" value="${escapeHtml(unit.name)}" /></div>
          <div class="form-group"><label>Color</label><input type="text" id="unitColor" value="${escapeHtml(unit.color)}" /></div>
        `, () => {
          const code = document.getElementById('unitCode').value.trim();
          const name = document.getElementById('unitName').value.trim();
          const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';

          unit.code = code;
          unit.name = name;
          unit.color = color;
          return true;
        });
      };

      window.deleteUnit = function(yi, si, ui) {

        studyData.years[yi].semesters[si].units.splice(ui, 1);

      // ─── Weeks ───
      window.addWeek = function(yi, si, ui) {

      window.addTopic = function(yi, si, ui, wi) {

        `, () => {

      window.editTopic = function(yi, si, ui, wi, ti) {
        const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];

          <div class="form-group"><label>Topic Name</label><input type="text" id="topicName" value="${escapeHtml(topic.name)}" /></div>
        `, () => {

          if (!name) { showToast('Please enter a topic name.', 'error'); return false; }

          return true;
        });

      window.deleteTopic = function(yi, si, ui, wi, ti) {

        const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
        week.topics.splice(ti, 1);
        render();
        markDirty();
      };

      // ─── Subtopics ───
      window.addSubtopic = function(yi, si, ui, wi, ti) {
        openModal('Add Subtopic', `
          <div class="form-group"><label>Subtopic Name</label><input type="text" id="subtopicName" placeholder="e.g. Partial derivatives" /></div>
        `, () => {
          const name = document.getElementById('subtopicName').value.trim();
          if (!name) { showToast('Please enter a subtopic name.', 'error'); return false; }
          const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
          if (!topic.subtopics) topic.subtopics = [];
          if (!topic.subCompleted) topic.subCompleted = [];
          topic.subtopics.push(name);
          topic.subCompleted.push(false);
          recalcTopicCompletion(topic);
          return true;
        });
      };

      window.deleteSubtopic = function(yi, si, ui, wi, ti, si2) {
        if (!confirm('Delete this subtopic?')) return;
        const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
        if (topic.subtopics && topic.subtopics.length > si2) {
          topic.subtopics.splice(si2, 1);
          if (topic.subCompleted && topic.subCompleted.length > si2) {
            topic.subCompleted.splice(si2, 1);
          }
          recalcTopicCompletion(topic);
        }
        render();
        markDirty();
      };

      // ─── Assignments ───
      window.addAssignment = function(yi, si, ui, wi) {
        openModal('Add Assignment', `
          <div class="form-group"><label>Assignment Name</label><input type="text" id="assName" placeholder="e.g. Quiz 1" /></div>
          <div class="form-group"><label>Due Date</label><input type="date" id="assDue" /></div>
          <div class="form-group"><label>Status</label>
            <select id="assStatus"><option value="pending">Pending</option><option value="in-progress">In Progress</option><option value="submitted">Submitted</option></select>
          </div>
          <div class="form-group"><label>Marks</label><input type="text" id="assMarks" placeholder="e.g. 85%" /></div>
          <div class="form-group"><label>Weighting (%)</label><input type="number" id="assWeight" placeholder="5" min="0" max="100" /></div>
        `, () => {
          const name = document.getElementById('assName').value.trim();
          const due = document.getElementById('assDue').value;
          const status = document.getElementById('assStatus').value;
          const marks = document.getElementById('assMarks').value.trim();
          const weight = parseFloat(document.getElementById('assWeight').value) || 0;
          if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
          const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
          if (!week.assignments) week.assignments = [];
          week.assignments.push({ name, due, status, marks, weight });
          return true;
        });
      };

      window.editAssignment = function(yi, si, ui, wi, ai) {
        const ass = studyData.years[yi].semesters[si].units[ui].weeks[wi].assignments[ai];
        openModal('Edit Assignment', `
          <div class="form-group"><label>Assignment Name</label><input type="text" id="assName" value="${escapeHtml(ass.name)}" /></div>
          <div class="form-group"><label>Due Date</label><input type="date" id="assDue" value="${ass.due || ''}" /></div>
          <div class="form-group"><label>Status</label>
            <select id="assStatus"><option value="pending" ${ass.status === 'pending' ? 'selected' : ''}>Pending</option><option value="in-progress" ${ass.status === 'in-progress' ? 'selected' : ''}>In Progress</option><option value="submitted" ${ass.status === 'submitted' ? 'selected' : ''}>Submitted</option></select>
          </div>
          <div class="form-group"><label>Marks</label><input type="text" id="assMarks" value="${escapeHtml(ass.marks || '')}" /></div>
          <div class="form-group"><label>Weighting (%)</label><input type="number" id="assWeight" value="${ass.weight || ''}" min="0" max="100" /></div>
        `, () => {
          const name = document.getElementById('assName').value.trim();
          const due = document.getElementById('assDue').value;
          const status = document.getElementById('assStatus').value;
          const marks = document.getElementById('assMarks').value.trim();
          const weight = parseFloat(document.getElementById('assWeight').value) || 0;
          if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
          ass.name = name;
          ass.due = due;
          ass.status = status;
          ass.marks = marks;
          ass.weight = weight;
          return true;
        });
      };

      window.deleteAssignment = function(yi, si, ui, wi, ai) {
        if (!confirm('Delete this assignment?')) return;
        const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
        week.assignments.splice(ai, 1);
        render();
        markDirty();
      };

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      //  INIT
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      async function init() {
        console.log('📦 Study Manager initializing...');
        const contentArea = document.getElementById('contentArea');

        contentArea.innerHTML = `
          <div class="study-header">
            <div>
              <h1><i class="fa fa-graduation-cap" style="font-size:1.8rem;margin-right:12px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i> Study Manager</h1>
              <div class="subtitle">Years → Semesters → Units → Weeks → Topics → Subtopics · <span id="userDisplay">🔒 ${user.username}</span></div>
            </div>
            <div class="actions">
              <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search topics..." aria-label="Search topics">
                <div class="compact-toggle">
                  <span>Compact</span>
                  <div id="compactSwitch" class="switch ${compactMode ? 'active' : ''}" onclick="toggleCompact()" role="button" tabindex="0" aria-label="Toggle compact view"></div>
                </div>
              </div>
              <button class="btn btn-sync" id="syncBtn" title="Ctrl+S to save"><i class="fa fa-cloud-download"></i> Sync</button>
              <button class="btn btn-excel" id="exportBtn"><i class="fa fa-file-excel-o"></i> Excel</button>
              <button class="btn btn-outline-secondary" id="exportJsonBtn" style="border-color:var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-download"></i> JSON</button>
              <button class="btn btn-outline-secondary" id="importJsonBtn" style="border-color:var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-upload"></i> Import</button>
              <button class="btn btn-success-glow" id="addYearBtn"><i class="fa fa-plus"></i> Add Year</button>
              <button class="btn btn-outline-light" id="resetBtn" style="border:1px solid var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-refresh"></i> Reset</button>
              <div class="save-status">
                <span class="dot saved" id="saveStatusDot"></span>
                <span id="saveStatusLabel">Saved</span>
              </div>
            </div>
          </div>

          <div id="deadlinesContainer"></div>
          <div id="analyticsContainer"></div>

          <div class="stats-bar" id="statsBar">
            <div class="stat-item"><div class="number blue" id="statYears">0</div><div class="label">Years</div><div class="stat-tooltip">Total academic years</div></div>
            <div class="stat-item"><div class="number purple" id="statUnits">0</div><div class="label">Units</div><div class="stat-tooltip">Total units/modules</div></div>
            <div class="stat-item"><div class="number orange" id="statWeeks">0</div><div class="label">Weeks</div><div class="stat-tooltip">Total weeks across all units</div></div>
            <div class="stat-item"><div class="number green" id="statTopicsDone">0</div><div class="label">Topics Done</div><div class="stat-tooltip">Completed topics / total topics</div></div>
            <div class="stat-item"><div class="number" id="statAssignments">0</div><div class="label">Assignments</div><div class="stat-tooltip">Total assignments</div></div>
            <div class="stat-item"><div class="number red" id="statPending">0</div><div class="label">Pending</div><div class="stat-tooltip">Assignments not yet submitted</div></div>
          </div>

          <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
            <button class="btn btn-sm btn-outline-secondary" onclick="expandAll()" style="border-color:var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-plus-square"></i> Expand All <span class="shortcut-hint">(Ctrl+E)</span></button>
            <button class="btn btn-sm btn-outline-secondary" onclick="collapseAll()" style="border-color:var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-minus-square"></i> Collapse All <span class="shortcut-hint">(Ctrl+W)</span></button>
          </div>

          <div id="treeContainer"></div>

          <div class="text-center text-muted-light small py-4" style="border-top:1px solid var(--border-subtle);margin-top:20px;">
            <span id="footerStatus"></span>
          </div>
        `;

        // ─── Bind buttons ───
        document.getElementById('syncBtn').addEventListener('click', async function() {
          showToast('🔄 Syncing...', 'info');
          try {
            const result = await loadFromGitHub();
            if (result) {
              studyData = result.data;
              currentFileSha = result.sha;
              render();
              saveToCache(studyData);
              showToast('✅ Synced from GitHub', 'success');
              updateSaveStatusUI('saved');
            } else {
              showToast('ℹ️ No valid study data on GitHub. Keeping local data.', 'info');
            }
          } catch (err) {
            console.error('Sync error:', err);
            showToast('❌ Sync failed: ' + err.message, 'error');
          }
        });

        document.getElementById('resetBtn').addEventListener('click', function() {
          if (!confirm('⚠️ Reset ALL data? This will restore the default study plan. Any custom data will be lost.')) return;
          studyData = getDefaultData();
          expanded = {};
          render();
          markDirty();
          showToast('🔄 Reset to default', 'info');
        });

        document.getElementById('addYearBtn').addEventListener('click', window.addYear);
        document.getElementById('exportBtn').addEventListener('click', window.exportToExcel);
        document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
        document.getElementById('importJsonBtn').addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.json';
          input.onchange = (e) => {
            if (e.target.files.length) importJSON(e.target.files[0]);
            e.target.value = '';
          };
          input.click();
        });

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
          searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
              searchTerm = this.value;
              render();
            }, 300);
          });
        }

        // Initial load
        await loadData();
        // Ensure status is correct
        updateSaveStatusUI('saved');
        console.log('✅ Study Manager ready');
      }

      // ─── Compact mode toggle ───
      window.toggleCompact = function() {
        compactMode = !compactMode;
        const sw = document.getElementById('compactSwitch');
        if (sw) sw.classList.toggle('active', compactMode);
        render();
      };

      // ─── START ───
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      // Expose globals
      window.toggleExpand = toggleExpand;
      window.toggleTopicComplete = toggleTopicComplete;
      window.toggleSubtopic = toggleSubtopic;
      window.bulkToggleWeek = bulkToggleWeek;
      window.expandAll = expandAll;
      window.collapseAll = collapseAll;
      window.exportJSON = exportJSON;
      window.importJSON = importJSON;
      window.addSemester = addSemester;
      window.editSemester = editSemester;
      window.deleteSemester = deleteSemester;
      window.addUnit = addUnit;
      window.editUnit = editUnit;
      window.deleteUnit = deleteUnit;
      window.addWeek = addWeek;
      window.editWeek = editWeek;
      window.deleteWeek = deleteWeek;
      window.addTopic = addTopic;
      window.editTopic = editTopic;
      window.deleteTopic = deleteTopic;
      window.addSubtopic = addSubtopic;
      window.deleteSubtopic = deleteSubtopic;
      window.addAssignment = addAssignment;
      window.editAssignment = editAssignment;
      window.deleteAssignment = deleteAssignment;
      window.addYear = addYear;
      window.editYear = editYear;
      window.deleteYear = deleteYear;
      window.openGradeModal = openGradeModal;
      window.updateGradeMark = updateGradeMark;
      window.updateWhatIf = updateWhatIf;
      window.studyManager = { studyData, render, markDirty };
    })();
  </script>
</body>
</html>
