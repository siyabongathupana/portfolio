    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  CACHE & SYNC – PLAIN JSON (NO ENCRYPTION)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const CACHE_KEY = 'studies_data_cache';

    function saveToCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          data: data,
          timestamp: Date.now(),
          version: '2.0' // plain JSON
        }));
      } catch (e) {}
    }

    function loadFromCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.data && parsed.data.years) {
            console.log('📦 Loaded from cache');
            return parsed.data;
          }
        }
      } catch (e) {}
      return null;
    }

    function getStudyPath() {
      const { dataPath } = window.REPO_CONFIG || { dataPath: 'data' };
      const encUser = encodeURIComponent(user.username);
      return `${dataPath}/users/${encUser}/studies.json`;
    }

    // ─── Retry helper ───
    async function retry(fn, retries = 3, delay = 1000) {
      let lastError;
      for (let i = 0; i < retries; i++) {
        try {
          return await fn();
        } catch (err) {
          lastError = err;
          console.warn(`Retry ${i+1}/${retries} failed:`, err);
          if (i < retries - 1) await new Promise(r => setTimeout(r, delay * (i + 1)));
        }
      }
      throw lastError;
    }

    // ─── loadFromGitHub – plain JSON, with fallback for old encrypted files ───
    async function loadFromGitHub() {
      return retry(async () => {
        const { owner, repo, branch } = window.REPO_CONFIG || { owner: 'siyabongathupana', repo: 'portfolio', branch: 'main' };
        const path = getStudyPath();
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);

        const response = await fetch(url, {
          headers: {
            Authorization: `token ${user.pat}`,
            Accept: 'application/vnd.github.v3+json'
          },
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          if (response.status === 404) {
            console.log('📭 No file on GitHub');
            return null;
          }
          if (response.status === 401 || response.status === 403) {
            throw new Error('GitHub token invalid or expired. Please update your token.');
          }
          throw new Error(`GitHub error: ${response.status} - ${response.statusText}`);
        }

        const data = await response.json();
        if (!data || !data.content) {
          throw new Error('Invalid response from GitHub: missing content');
        }

        let parsed;
        try {
          const content = atob(data.content.replace(/\n/g, ''));
          parsed = JSON.parse(content);
        } catch (e) {
          console.warn('⚠️ Could not parse file content – treating as no data.');
          return null;
        }

        // Check if it's the old encrypted format
        if (parsed && typeof parsed === 'object' && parsed.salt && parsed.iv && parsed.ciphertext) {
          console.log('🔐 Old encrypted file detected – attempting to decrypt...');
          try {
            const key = window.APP_CONFIG?.dogsname || 'default-key';
            const decryptedStr = await window.CryptoUtil.decrypt(parsed, key);
            const decrypted = JSON.parse(decryptedStr);
            if (decrypted && decrypted.years) {
              console.log('✅ Decrypted successfully – will overwrite with plain JSON on next save.');
              return decrypted;
            } else {
              console.warn('⚠️ Decrypted data missing "years" – returning null.');
              return null;
            }
          } catch (e) {
            console.warn('⚠️ Decryption failed – returning null.', e);
            return null;
          }
        }

        // Plain JSON – check for "years"
        if (parsed && typeof parsed === 'object' && parsed.years) {
          console.log('✅ Loaded from GitHub (plain JSON)');
          saveToCache(parsed);
          return parsed;
        } else {
          console.warn('⚠️ Invalid study data structure (missing "years") – returning null.');
          return null;
        }
      }, 3, 1500);
    }

    // ─── Save to GitHub – plain JSON with retry ───
    async function saveToGitHub(dataToSave) {
      if (isSaving) {
        await new Promise(r => setTimeout(r, 200));
        return saveToGitHub(dataToSave);
      }
      isSaving = true;
      try {
        // Validate data
        if (!dataToSave.years || !Array.isArray(dataToSave.years)) {
          throw new Error('Invalid data structure: "years" must be an array.');
        }

        const { owner, repo, branch } = window.REPO_CONFIG || { owner: 'siyabongathupana', repo: 'portfolio', branch: 'main' };
        const path = getStudyPath();
        const content = JSON.stringify(dataToSave, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(content)));

        let sha = null;
        try {
          const existing = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
          if (existing && existing.sha) sha = existing.sha;
        } catch (e) {}

        await retry(async () => {
          await GitHubAPI.updateFile(owner, repo, path, content, 'Update study data (plain JSON)', branch, user.pat, sha);
        }, 3, 1000);

        console.log('✅ Saved to GitHub (plain JSON)');
        saveToCache(dataToSave);
        showToast('✅ Saved', 'success');
        isSaving = false;
        return true;
      } catch (err) {
        console.error('Save failed:', err);
        if (err.message && err.message.includes('does not match') && !err._retried) {
          err._retried = true;
          console.log('🔄 Retrying save...');
          await new Promise(r => setTimeout(r, 500));
          return saveToGitHub(dataToSave);
        }
        showToast('❌ Save failed: ' + err.message, 'error');
        isSaving = false;
        return false;
      }
    }

    // ─── Load data (cache first, then GitHub) ───
    function loadData() {
      try {
        const cached = loadFromCache();
        if (cached) {
          studyData = cached;
          console.log('✅ Loaded from cache');
          render();
          // Background sync
          setTimeout(async () => {
            try {
              const githubData = await loadFromGitHub();
              if (githubData) {
                studyData = githubData;
                render();
                console.log('✅ Updated from GitHub');
              }
            } catch (err) {
              console.warn('Background sync failed:', err);
              showToast('⚠️ Could not sync with GitHub: ' + err.message, 'error');
            }
          }, 100);
          return true;
        }

        // No cache – use default and try GitHub
        studyData = getDefaultData();
        render();
        setTimeout(async () => {
          try {
            const githubData = await loadFromGitHub();
            if (githubData) {
              studyData = githubData;
              render();
              console.log('✅ Loaded from GitHub');
            } else {
              // Save default to GitHub
              await saveToGitHub(studyData);
            }
          } catch (err) {
            console.error('GitHub load error:', err);
            showToast('❌ Could not load data from GitHub: ' + err.message, 'error');
          }
        }, 200);
        return true;
      } catch (err) {
        console.error('Error loading data:', err);
        showToast('Failed to load study data: ' + err.message, 'error');
        const container = document.getElementById('treeContainer');
        if (container) {
          container.innerHTML = `
            <div class="error-display">
              <div class="icon"><i class="fa fa-exclamation-circle"></i></div>
              <h3>Error Loading Data</h3>
              <p>${err.message}</p>
              <pre>${err.stack}</pre>
              <button class="btn btn-delta mt-3" onclick="window.location.reload()">Retry</button>
            </div>
          `;
        }
        return false;
      }
    }

    async function saveStudyData() {
      saveToCache(studyData);
      await saveToGitHub(studyData);
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      try {

            <div class="error-display">

              <pre>${e.stack}</pre>

    function renderStats() {
      try {
        let totalYears = studyData.years.length;
        let totalUnits = 0, totalWeeks = 0, totalTopics = 0, doneTopics = 0;
        let totalAssignments = 0, pendingAssignments = 0;

        studyData.years.forEach(y => {
          y.semesters.forEach(s => {
            s.units.forEach(u => {
              totalUnits++;
              (u.weeks || []).forEach(w => {
                totalWeeks++;
                (w.topics || []).forEach(t => {
                  totalTopics++;
                  if (t.completed) doneTopics++;
                });
                (w.assignments || []).forEach(a => {
                  totalAssignments++;
                  if (a.status === 'pending' || a.status === 'in-progress')
                    pendingAssignments++;
                });
              });
            });
          });
        });

        document.getElementById('statYears').textContent = totalYears;
        document.getElementById('statUnits').textContent = totalUnits;
        document.getElementById('statWeeks').textContent = totalWeeks;
        document.getElementById('statTopicsDone').textContent = doneTopics + '/' + totalTopics;
        document.getElementById('statAssignments').textContent = totalAssignments;
        document.getElementById('statPending').textContent = pendingAssignments;
      } catch (e) {
        console.warn('Stats render error:', e);
      }
    }

    //  CHECKBOX TOGGLES (instant)
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function toggleTopicComplete(yi, si, ui, wi, ti) {
      const topic = getTopic(yi, si, ui, wi, ti);
      if (!topic) return;
      topic.completed = !topic.completed;
      if (topic.subtopics && topic.subtopics.length) {
        topic.subCompleted = topic.subtopics.map(() => topic.completed);
      }
      // Update UI
      const check = document.querySelector(`.topic-header .check[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-wi="${wi}"][data-ti="${ti}"]`);
      if (check) check.classList.toggle('checked', topic.completed);
      const subs = document.querySelectorAll(`.sub-check[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-wi="${wi}"][data-ti="${ti}"]`);
      subs.forEach(el => {
        el.classList.toggle('checked', topic.completed);
        const label = el.parentElement.querySelector('.sub-label');
        if (label) label.classList.toggle('done', topic.completed);
      });

      saveStudyData();

    function toggleSubtopic(yi, si, ui, wi, ti, si2) {
      const topic = getTopic(yi, si, ui, wi, ti);
      if (!topic) return;
      if (!topic.subCompleted) topic.subCompleted = topic.subtopics.map(() => false);
      topic.subCompleted[si2] = !topic.subCompleted[si2];
      const allDone = topic.subCompleted.every(Boolean);
      topic.completed = allDone;

      const check = document.querySelector(`.sub-check[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-wi="${wi}"][data-ti="${ti}"][data-si2="${si2}"]`);
      if (check) {
        check.classList.toggle('checked', topic.subCompleted[si2]);
        const label = check.parentElement.querySelector('.sub-label');
        if (label) label.classList.toggle('done', topic.subCompleted[si2]);
      }
      const parentCheck = document.querySelector(`.topic-header .check[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-wi="${wi}"][data-ti="${ti}"]`);
      if (parentCheck) parentCheck.classList.toggle('checked', allDone);
      renderStats();
      saveStudyData();

    function getTopic(yi, si, ui, wi, ti) {
      try {
        return studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  GRADE CALCULATOR
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function calculateUnitGrade(unit) {
      const allAssignments = [];
      (unit.weeks || []).forEach(week => {
        (week.assignments || []).forEach(ass => {
          allAssignments.push(ass);
        });
      });
      let totalWeight = 0, weightedSum = 0, missingMarks = 0;
      allAssignments.forEach(ass => {
        const weight = parseFloat(ass.weight) || 0;
        totalWeight += weight;
        const marks = parseFloat(ass.marks);
        if (!isNaN(marks) && marks >= 0 && marks <= 100) {
          weightedSum += marks * (weight / 100);
        } else {
          missingMarks += weight;
        }
      });
      if (allAssignments.length === 0 || totalWeight === 0) return null;
      const achievedWeight = totalWeight - missingMarks;
      const currentGrade = achievedWeight > 0 ? (weightedSum / achievedWeight) * 100 : null;
      return { grade: currentGrade, totalWeight, weightedSum, missingMarks, allAssignments, achievedWeight };
    }

    function renderGradeModal(yi, si, ui) {
      const unit = studyData.years[yi]?.semesters[si]?.units[ui];
      if (!unit) return;
      const result = calculateUnitGrade(unit);
      const body = document.getElementById('gradeModalBody');
      let html = '';
      let gradeDisplay = 'N/A', gradeColor = 'red', gradeValue = 0;
      if (result) {
        if (result.grade !== null) {
          gradeValue = Math.round(result.grade);
          gradeDisplay = gradeValue + '%';
          gradeColor = gradeValue >= 70 ? 'green' : (gradeValue >= 50 ? 'orange' : 'red');
        } else {
          gradeDisplay = '—';
        }
      } else {
        gradeDisplay = 'No assignments';
      }
      html += `
        <div class="grade-summary">
          <div class="card"><div class="value ${gradeColor}">${gradeDisplay}</div><div class="label">Current Grade</div></div>
          <div class="card"><div class="value">${result ? (result.missingMarks > 0 ? '⏳' : '✅') : '—'}</div><div class="label">${result ? (result.missingMarks > 0 ? result.missingMarks.toFixed(0)+'% pending' : 'All marked') : '—'}</div></div>
          <div class="card"><div class="value">${result ? result.allAssignments.length : 0}</div><div class="label">Assignments</div></div>
        </div>
      `;
      if (result && result.allAssignments.length > 0) {
        html += `<div style="margin-top:12px;max-height:260px;overflow-y:auto;">`;
        result.allAssignments.forEach((ass, idx) => {
          const marksVal = ass.marks || '';
          const isPending = ass.status === 'pending' || ass.status === 'in-progress';
          const statusClass = isPending ? 'pending' : 'submitted';
          const statusLabel = isPending ? 'Pending' : 'Submitted';
          html += `
            <div class="assignment-row" data-idx="${idx}">
              <div class="name">${escapeHtml(ass.name)}</div>
              <div class="weight">${ass.weight || 0}%</div>
              <input type="number" class="marks-input" value="${marksVal}" min="0" max="100" step="0.5"
                data-yi="${yi}" data-si="${si}" data-ui="${ui}" data-idx="${idx}"
                onchange="updateGradeMark(this)" placeholder="Marks">
              <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
          `;
        });
        html += `</div>`;
        const currentGrade = result.grade;
        const missingWeight = result.missingMarks || 0;
        const achievedWeight = result.achievedWeight || 0;
        const totalWeight = result.totalWeight || 100;
        html += `
          <div class="what-if">
            <div style="font-weight:600;margin-bottom:8px;">🎯 What-If Scenario</div>
            <div class="input-group">
              <span>Target grade:</span>
              <input type="number" id="targetGradeInput" value="${Math.round(currentGrade || 70)}" min="0" max="100" step="0.5"
                oninput="updateWhatIf(${yi}, ${si}, ${ui}, this.value)">
              <span>%</span>
            </div>
            <div id="whatIfResult" style="margin-top:8px;">
              ${currentGrade !== null ? (missingWeight > 0 ? 'Enter marks to see what-if.' : '✅ All done!') : 'Enter marks to see what-if.'}
            </div>
          </div>
        `;
      } else {
        html += `<p style="color:var(--text-secondary);">No assignments found for this unit.</p>`;
      }
      body.innerHTML = html;
      document.getElementById('gradeModalTitle').textContent = `📊 Grade Calculator – ${unit.code} ${unit.name}`;
      if (result && result.grade !== null) {
        setTimeout(() => {
          const targetInput = document.getElementById('targetGradeInput');
          if (targetInput) updateWhatIf(yi, si, ui, targetInput.value);
        }, 100);
      }
    }

    window.updateGradeMark = function(input) {
      const yi = parseInt(input.dataset.yi);
      const si = parseInt(input.dataset.si);
      const ui = parseInt(input.dataset.ui);
      const idx = parseInt(input.dataset.idx);
      const unit = studyData.years[yi]?.semesters[si]?.units[ui];
      if (!unit) return;
      const flatAssignments = [];
      (unit.weeks || []).forEach(week => {
        (week.assignments || []).forEach(ass => {
          flatAssignments.push(ass);
        });
      });
      if (idx < flatAssignments.length) {
        const ass = flatAssignments[idx];
        ass.marks = input.value;
        saveStudyData().then(() => {
          if (gradeModalOpen) {
            renderGradeModal(yi, si, ui);
            const newInput = document.querySelector(`.marks-input[data-yi="${yi}"][data-si="${si}"][data-ui="${ui}"][data-idx="${idx}"]`);
            if (newInput) newInput.focus();
          }
          showToast('✅ Marks updated', 'success');
        });
      }
    };

    window.updateWhatIf = function(yi, si, ui, target) {
      const unit = studyData.years[yi]?.semesters[si]?.units[ui];
      if (!unit) return;
      const result = calculateUnitGrade(unit);
      if (!result || result.grade === null) {
        document.getElementById('whatIfResult').innerHTML = 'Enter marks to see what-if.';
        return;
      }
      const currentGrade = result.grade;
      const missingWeight = result.missingMarks || 0;
      const achievedWeight = result.achievedWeight || 0;
      const totalWeight = result.totalWeight || 100;
      const targetNum = parseFloat(target);
      if (isNaN(targetNum) || targetNum < 0 || targetNum > 100) {
        document.getElementById('whatIfResult').innerHTML = 'Please enter a valid target (0-100).';
        return;
      }
      const resultDiv = document.getElementById('whatIfResult');
      if (missingWeight === 0) {
        resultDiv.innerHTML = `✅ All assignments already have marks. Your grade is <strong>${Math.round(currentGrade)}%</strong>.`;
        return;
      }
      const needed = (targetNum * totalWeight - currentGrade * achievedWeight / 100) / missingWeight * 100;
      if (needed > 100) {
        resultDiv.innerHTML = `❌ <span class="impossible">Even scoring 100% on all remaining assignments (${missingWeight}%) will only get you ${((currentGrade * achievedWeight / 100 + missingWeight) / totalWeight * 100).toFixed(1)}%</span>`;
      } else if (needed < 0) {
        resultDiv.innerHTML = `✅ You already have <strong>${Math.round(currentGrade)}%</strong>. You can score 0% on remaining assignments and still reach ${targetNum}%.`;
      } else {
        resultDiv.innerHTML = `💡 To reach <strong>${targetNum}%</strong>, you need <strong class="needed">${needed.toFixed(1)}%</strong> average on the remaining <strong>${missingWeight}%</strong> of assignments.`;
      }
    };

              (u.weeks || []).forEach(w => {
                totalWeeks++;
                (w.topics || []).forEach(t => {
                  totalTopics++;
                  if (t.completed) doneTopics++;
                });
                (w.assignments || []).forEach(a => {
                  totalAssignments++;
                  if (a.status === 'pending' || a.status === 'in-progress') pendingAss++;
                });
              });
            });
          });
        });
        cover.addRow(['Total Units:', totalUnits]);
        cover.addRow(['Total Weeks:', totalWeeks]);
        cover.addRow(['Topics Completed:', doneTopics + '/' + totalTopics]);
        cover.addRow(['Total Assignments:', totalAssignments]);
        cover.addRow(['Pending Assignments:', pendingAss]);

        cover.addRow([]);
        cover.addRow(['Unit Grade Summary:']);
        const gradeHeader = cover.addRow(['Year', 'Semester', 'Unit', 'Current Grade', 'Pending Weight']);
        gradeHeader.eachCell(cell => {
          cell.font = { bold: true };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B2B3B' } };
          cell.font.color = { argb: 'FFFFFFFF' };
        });
        studyData.years.forEach(y => {
          y.semesters.forEach(s => {
            s.units.forEach(u => {
              const result = calculateUnitGrade(u);
              const grade = result && result.grade !== null ? Math.round(result.grade) + '%' : 'N/A';
              const pending = result ? (result.missingMarks > 0 ? result.missingMarks.toFixed(0) + '%' : '✅') : 'N/A';
              cover.addRow([y.name, s.name, u.code + ' ' + u.name, grade, pending]);
            });
          });
        });
        cover.columns.forEach(col => { col.width = 25; });

        // Data sheet
        const ws = workbook.addWorksheet('Full Data', { pageSetup: { orientation: 'landscape', fitToPage: true } });
        ws.mergeCells('A1:F1');
        const wsTitle = ws.getCell('A1');
        wsTitle.value = '📋 UNIT – ASSIGNMENT DETAILS';
        wsTitle.font = { bold: true, size: 16, color: { argb: 'FF0B2B3B' } };
        wsTitle.alignment = { horizontal: 'center' };
        ws.getRow(1).height = 30;

        const dataHeaders = ['Year', 'Semester', 'Unit', 'Week', 'Assignment', 'Due Date', 'Status', 'Marks', 'Weight %'];
        const hRow = ws.addRow(dataHeaders);
        hRow.eachCell(cell => {
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0B2B3B' } };
          cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
          cell.alignment = { horizontal: 'center' };
        });

        studyData.years.forEach(y => {
          y.semesters.forEach(s => {
            s.units.forEach(u => {
              (u.weeks || []).forEach(w => {
                (w.assignments || []).forEach(a => {
                  ws.addRow([y.name, s.name, u.code + ' ' + u.name, 'Week ' + w.number, a.name, a.due || '', a.status, a.marks || '', a.weight || 0]);
                });
              });
            });
          });
        });
        ws.columns.forEach(col => col.width = 16);

        // Dashboard with charts
        const dash = workbook.addWorksheet('Dashboard', { pageSetup: { orientation: 'landscape', fitToPage: true } });
        dash.mergeCells('A1:F1');
        const dashTitle = dash.getCell('A1');
        dashTitle.value = '📈 STUDY DASHBOARD';
        dashTitle.font = { bold: true, size: 18, color: { argb: 'FF2FC7FF' } };
        dashTitle.alignment = { horizontal: 'center', vertical: 'middle' };
        dash.getRow(1).height = 40;

        const unitNames = [];
        const topicCounts = [];
        studyData.years.forEach(y => {
          y.semesters.forEach(s => {
            s.units.forEach(u => {
              unitNames.push(u.code + ' ' + u.name);
              let unitTotal = 0;
              u.weeks.forEach(w => {
                w.topics.forEach(t => {
                  unitTotal += (t.subtopics ? t.subtopics.length : 0);
                });
              });
              topicCounts.push(unitTotal);
            });
          });
        });

        try {
          const canvas1 = document.createElement('canvas');
          canvas1.width = 600;
          canvas1.height = 400;
          const ctx1 = canvas1.getContext('2d');
          new Chart(ctx1, {
            type: 'bar',
            data: { labels: unitNames.slice(0, 8), datasets: [{ label: 'Subtopics', data: topicCounts.slice(0, 8), backgroundColor: '#2fc7ff', borderColor: '#0984e3', borderWidth: 1 }] },
            options: { responsive: false, plugins: { title: { display: true, text: 'Subtopics per Unit', font: { size: 16 } }, legend: { display: false } }, scales: { y: { beginAtZero: true } } }
          });
          await new Promise(r => setTimeout(r, 300));
          const imgData1 = canvas1.toDataURL('image/png');
          const imageId1 = workbook.addImage({ base64: imgData1, extension: 'png' });
          dash.addImage(imageId1, { tl: { col: 0, row: 3 }, ext: { width: 500, height: 300 } });
        } catch(e) { console.warn('Chart generation failed', e); }

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        saveAs(blob, `StudyPlan_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast('✅ Excel exported with charts!', 'success');
      } catch (err) {
        console.error(err);
        showToast('Export failed: ' + err.message, 'error');
      } finally {
        window.hideLoading();
      }
    };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    //  UTILITY
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast-item ${type}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 400);
      }, 3500);
    }

    // ─── GLOBAL EXPOSURE ───
    window.toggleExpand = function(key) { expanded[key] = !expanded[key]; render(); };
    window.toggleTopicExpand = function(key) { expanded[key] = !expanded[key]; render(); };
    window.toggleTopicComplete = toggleTopicComplete;
    window.toggleSubtopic = toggleSubtopic;
    window.saveStudyData = saveStudyData;

    // ─── INIT ───
    function init() {
      console.log('📦 Study Manager initializing...');
      const contentArea = document.getElementById('contentArea');

      contentArea.innerHTML = `
        <div class="study-header">
          <div>
            <h1><i class="fa fa-graduation-cap" style="font-size:1.8rem;margin-right:12px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;"></i> Study Manager</h1>
            <div class="subtitle">Years → Semesters → Units → Weeks → Topics → Subtopics · <span id="userDisplay">🔒 ${user.username}</span></div>
          </div>
          <div class="actions">
            <button class="btn btn-sync" id="syncBtn"><i class="fa fa-cloud-download"></i> Sync</button>
            <button class="btn btn-excel" id="exportBtn"><i class="fa fa-file-excel-o"></i> Export</button>
            <button class="btn btn-success-glow" id="addYearBtn"><i class="fa fa-plus"></i> Add Year</button>
            <button class="btn btn-outline-light" id="resetBtn" style="border:1px solid var(--border-subtle);color:var(--text-secondary);"><i class="fa fa-refresh"></i> Reset</button>
          </div>
        </div>

        <div class="stats-bar" id="statsBar">
          <div class="stat-item"><div class="number blue" id="statYears">0</div><div class="label">Years</div></div>
          <div class="stat-item"><div class="number purple" id="statUnits">0</div><div class="label">Units</div></div>
          <div class="stat-item"><div class="number orange" id="statWeeks">0</div><div class="label">Weeks</div></div>
          <div class="stat-item"><div class="number green" id="statTopicsDone">0</div><div class="label">Topics Done</div></div>
          <div class="stat-item"><div class="number" id="statAssignments">0</div><div class="label">Assignments</div></div>
          <div class="stat-item"><div class="number red" id="statPending">0</div><div class="label">Pending</div></div>
        </div>

        <div id="treeContainer"></div>

        <div class="text-center text-muted-light small py-4" style="border-top:1px solid var(--border-subtle);margin-top:20px;">
          <span id="footerStatus"></span>
        </div>
      `;

      // ─── Sync button ───
      document.getElementById('syncBtn').addEventListener('click', async function() {
        showToast('🔄 Syncing...', 'info');
        try {
          const data = await loadFromGitHub();
          if (data) {
            studyData = data;
            render();
            showToast('✅ Synced from GitHub', 'success');
          } else {
            showToast('ℹ️ No valid study data on GitHub. Keeping local data.', 'info');
          }
        } catch (err) {
          console.error('Sync error:', err);
          showToast('❌ Sync failed: ' + err.message, 'error');
        }
      });

      document.getElementById('resetBtn').addEventListener('click', function() {
        if (!confirm('⚠️ Reset ALL data? This will restore the default study plan. Any custom data will be lost.')) return;
        studyData = getDefaultData();
        expanded = {};
        saveStudyData().then(() => {
          render();
          showToast('🔄 Reset to default', 'info');
        });
      });

      document.getElementById('addYearBtn').addEventListener('click', window.addYear);
      document.getElementById('exportBtn').addEventListener('click', window.exportToExcel);

      // Load data (cache first)
      loadData();
      console.log('✅ Study Manager ready');
    }

    // ─── START ───
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    window.studyManager = { studyData, render, saveStudyData };
  </script>
</body>
</html>
