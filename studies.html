<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Manager · Engineering Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="api.js"></script>
    <script src="shared.js"></script>

    <style>
        /* ─── Base ─── */
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111927;
            --border-subtle: rgba(47, 199, 255, 0.08);
            --text-primary: #e0e8ee;
            --text-secondary: #8a9fb0;
            --accent: #2fc7ff;
            --accent-glow: rgba(47, 199, 255, 0.15);
            --green: #00b894;
            --orange: #fdcb6e;
            --red: #e17055;
            --purple: #a29bfe;
            --blue: #0984e3;
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10, 14, 23, 0.85) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 0;
            position: relative;
            z-index: 100;
        }
        .navbar-brand { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; }
        .navbar-brand span { color: var(--accent); }
        .nav-link { color: rgba(255,255,255,0.4) !important; font-size: 0.8rem; transition: 0.2s; letter-spacing: 0.03em; }
        .nav-link:hover { color: var(--accent) !important; }
        .nav-link.active { color: var(--accent) !important; }

        .study-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px 100px;
        }

        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 0 30px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 30px;
        }
        .study-header h1 {
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .study-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .study-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .study-header .actions .btn {
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 20px;
            transition: 0.25s;
            border: none;
        }
        .btn-sync {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .btn-sync:hover {
            background: rgba(47,199,255,0.12);
            color: var(--accent);
        }
        .btn-primary-glow {
            background: linear-gradient(135deg, var(--accent), #0984e3);
            color: #0a0e17;
        }
        .btn-primary-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(47,199,255,0.2);
            color: #0a0e17;
        }
        .btn-success-glow {
            background: linear-gradient(135deg, var(--green), #00a86b);
            color: white;
        }
        .btn-success-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0,184,148,0.2);
            color: white;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-subtle);
            text-align: center;
            transition: 0.2s;
        }
        .stat-item:hover {
            border-color: rgba(47,199,255,0.2);
            transform: translateY(-2px);
        }
        .stat-item .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
        .stat-item .number.green { color: var(--green); }
        .stat-item .number.orange { color: var(--orange); }
        .stat-item .number.blue { color: var(--accent); }
        .stat-item .number.purple { color: var(--purple); }
        .stat-item .number.red { color: var(--red); }

        /* ─── Level Sections ─── */
        .level-section {
            margin-bottom: 16px;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
            background: var(--bg-card);
        }
        .level-header {
            padding: 12px 18px;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: 0.2s;
        }
        .level-header:hover {
            background: rgba(255,255,255,0.04);
        }
        .level-header .name {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .level-header .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .level-header .actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .level-header .actions .btn {
            border-radius: 40px;
            font-size: 0.65rem;
            padding: 3px 12px;
            border: none;
            transition: 0.2s;
        }
        .btn-add {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
        }
        .btn-add:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .btn-del {
            background: rgba(225,112,85,0.08);
            color: var(--red);
        }
        .btn-del:hover {
            background: rgba(225,112,85,0.15);
        }
        .btn-edit {
            background: rgba(47,199,255,0.06);
            color: var(--accent);
        }
        .btn-edit:hover {
            background: rgba(47,199,255,0.12);
        }

        .level-body {
            padding: 14px 18px;
            display: none;
        }
        .level-body.open {
            display: block;
        }

        .child-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .child-card {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            transition: 0.2s;
            cursor: pointer;
        }
        .child-card:hover {
            border-color: rgba(47,199,255,0.2);
            background: rgba(255,255,255,0.04);
        }
        .child-card .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .child-card .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .child-card .progress-track {
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 0 3px;
        }
        .child-card .progress-track .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--green));
            transition: width 0.6s ease;
        }

        /* ─── Topic / Subtopic ─── */
        .topic-item {
            margin-bottom: 8px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            overflow: hidden;
        }
        .topic-header {
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.02);
        }
        .topic-header:hover {
            background: rgba(255,255,255,0.04);
        }
        .topic-header .check {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
        }
        .topic-header .check.checked {
            background: var(--green);
            border-color: var(--green);
        }
        .topic-header .check.checked i {
            color: #fff;
        }
        .topic-header .check i {
            font-size: 11px;
            color: transparent;
        }
        .topic-header .name {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .topic-header .meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .topic-header .actions .btn {
            border-radius: 40px;
            font-size: 0.6rem;
            padding: 2px 10px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .topic-header .actions .btn:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .topic-header .actions .btn-del:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }
        .topic-header .expand-icon {
            color: var(--text-secondary);
            font-size: 0.7rem;
            transition: 0.2s;
            margin-left: 4px;
        }

        .subtopic-list {
            padding: 0 14px 10px 44px;
            display: none;
        }
        .subtopic-list.open {
            display: block;
        }
        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .subtopic-item:last-child {
            border-bottom: none;
        }
        .subtopic-item .sub-check {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 2px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
        }
        .subtopic-item .sub-check.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .subtopic-item .sub-check.checked i {
            color: #fff;
        }
        .subtopic-item .sub-check i {
            font-size: 9px;
            color: transparent;
        }
        .subtopic-item .sub-label {
            flex: 1;
        }
        .subtopic-item .sub-label.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .subtopic-item .sub-actions .btn {
            border-radius: 40px;
            font-size: 0.55rem;
            padding: 1px 8px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .subtopic-item .sub-actions .btn:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }

        .subtopic-add-row {
            margin-top: 6px;
        }
        .subtopic-add-row .btn {
            border-radius: 40px;
            font-size: 0.7rem;
            padding: 2px 14px;
            border: 1px dashed var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .subtopic-add-row .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        /* ─── Assignments ─── */
        .assignments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }
        .assignments-section .section-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .assignments-section .section-title i {
            color: var(--accent);
        }

        .assignment-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: 0.2s;
            flex-wrap: wrap;
        }
        .assignment-item:hover {
            border-color: var(--border-subtle);
            background: rgba(255,255,255,0.04);
        }
        .assignment-item .ass-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 100px;
        }
        .assignment-item .ass-due {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 70px;
        }
        .assignment-item .ass-status {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .assignment-item .ass-status.pending {
            background: rgba(225,112,85,0.12);
            color: var(--red);
        }
        .assignment-item .ass-status.in-progress {
            background: rgba(253,203,110,0.12);
            color: var(--orange);
        }
        .assignment-item .ass-status.submitted {
            background: rgba(0,184,148,0.12);
            color: var(--green);
        }
        .assignment-item .ass-marks {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 40px;
            text-align: right;
        }
        .assignment-item .ass-actions {
            display: flex;
            gap: 4px;
        }
        .assignment-item .ass-actions .btn {
            border-radius: 40px;
            font-size: 0.6rem;
            padding: 2px 10px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .assignment-item .ass-actions .btn-edit-ass:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .assignment-item .ass-actions .btn-del-ass:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }
        .btn-add-ass {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .btn-add-ass:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        /* ─── Modal ─── */
        .modal-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-custom.open {
            display: flex;
        }
        .modal-custom .modal-box {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-custom .modal-box h3 {
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
        }
        .modal-custom .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-custom .modal-box .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .modal-custom .modal-box .form-group input,
        .modal-custom .modal-box .form-group select,
        .modal-custom .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
        }
        .modal-custom .modal-box .form-group input:focus,
        .modal-custom .modal-box .form-group select:focus,
        .modal-custom .modal-box .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,199,255,0.1);
        }
        .modal-custom .modal-box .form-group select option {
            background: #1a2233;
        }
        .modal-custom .modal-box .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-custom .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .modal-custom .modal-box .modal-actions .btn {
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            transition: 0.2s;
        }
        .modal-custom .modal-box .modal-actions .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .modal-custom .modal-box .modal-actions .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .modal-custom .modal-box .modal-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0984e3);
            color: #0a0e17;
        }
        .modal-custom .modal-box .modal-actions .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(47,199,255,0.15);
        }

        /* ─── Toast ─── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1050;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-item {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: toastIn 0.3s ease;
            min-width: 240px;
            backdrop-filter: blur(8px);
        }
        .toast-item.success { border-left: 3px solid var(--green); }
        .toast-item.error { border-left: 3px solid var(--red); }
        .toast-item.info { border-left: 3px solid var(--accent); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .study-container { padding: 0 12px 80px; }
            .study-header h1 { font-size: 1.5rem; }
            .child-grid { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .stat-item .number { font-size: 1.2rem; }
            .level-header { flex-direction: column; align-items: stretch; }
            .level-header .actions { justify-content: flex-start; }
            .modal-custom .modal-box { padding: 20px; }
            .subtopic-list { padding: 0 10px 10px 30px; }
        }
        @media (max-width: 480px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .study-header .actions .btn { font-size: 0.65rem; padding: 6px 12px; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        .text-muted-light { color: var(--text-secondary); }
        .gap-2 { gap: 8px; }
        .flex-wrap { flex-wrap: wrap; }
        .cursor-pointer { cursor: pointer; }
        .no-select { user-select: none; }
    </style>
</head>

        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand" href="index.html"><span>✦</span> Your<span style="color:#e0e8ee;">Portfolio</span></a>
            <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navStudy">

            <div class="collapse navbar-collapse" id="navStudy">
                <ul class="navbar-nav ml-auto">

        </div>
    </nav>

    <!-- ─── MAIN ─── -->
    <div class="study-container" id="app">

        <!-- Header -->
        <div class="study-header">

                const stored = sessionStorage.getItem('portfolioUser');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.timestamp && Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {

                    sessionStorage.removeItem('portfolioUser');

            } catch {}
            return null;

            const json = JSON.stringify(data);
            const key = window.APP_CONFIG.dogsname;
            const encrypted = await window.CryptoUtil.encrypt(json, key);
            return encrypted;
        }

        async function decryptData(encrypted) {
            const key = window.APP_CONFIG.dogsname;
            const decrypted = await window.CryptoUtil.decrypt(encrypted, key);
            return JSON.parse(decrypted);
        }

        function getStudyPath() {
            const { dataPath } = window.REPO_CONFIG;
            const encUser = encodeURIComponent(user.username);
            return `${dataPath}/users/${encUser}/studies.enc`;
        }

        async function saveStudyData() {
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const encrypted = await encryptData(studyData);
                const content = JSON.stringify(encrypted, null, 2);

                let sha = null;
                try {
                    const existing = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                    if (existing && existing.sha) sha = existing.sha;
                } catch {}

                await GitHubAPI.updateFile(owner, repo, path, content, 'Update study data (encrypted)', branch, user.pat,
                    sha);
                console.log('✅ Study data saved (encrypted) to GitHub');
                return true;
            } catch (err) {
                console.error('Save failed:', err);
                showToast('Failed to save: ' + err.message, 'error');
                return false;
            }
        }

        async function loadStudyData() {
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const file = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                if (file && file.content) {
                    // Check if it's encrypted JSON or plain
                    let parsed;
                    try {
                        parsed = JSON.parse(file.content);
                    } catch (e) {
                        parsed = null;
                    }
                    if (parsed && typeof parsed === 'object' && parsed.salt && parsed.iv && parsed.ciphertext) {
                        // It's encrypted
                        const decrypted = await decryptData(parsed);
                        if (decrypted && decrypted.years) {
                            studyData = decrypted;
                            console.log('✅ Study data loaded (decrypted) from GitHub');
                            return true;
                        }
                    } else if (parsed && parsed.years) {
                        // Legacy plain JSON (for migration)
                        studyData = parsed;
                        console.log('✅ Study data loaded (plain) from GitHub');
                        // Re-encrypt and save
                        await saveStudyData();
                        return true;
                    }
                }
            } catch (err) {
                console.log('No existing study data, initializing...');
            }
            return false;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            renderStats();
            renderTree();
        }

        function renderStats() {
            let totalYears = studyData.years.length;
            let totalUnits = 0,
                totalWeeks = 0,
                totalTopics = 0,
                doneTopics = 0;
            let totalAssignments = 0,
                pendingAssignments = 0;

            studyData.years.forEach(y => {
                y.semesters.forEach(s => {
                    s.units.forEach(u => {
                        totalUnits++;
                        (u.weeks || []).forEach(w => {
                            totalWeeks++;
                            (w.topics || []).forEach(t => {
                                totalTopics++;
                                if (t.completed) doneTopics++;
                            });
                            (w.assignments || []).forEach(a => {
                                totalAssignments++;
                                if (a.status === 'pending' || a.status === 'in-progress')
                                    pendingAssignments++;
                            });
                        });
                    });
                });
            });

            document.getElementById('statYears').textContent = totalYears;
            document.getElementById('statUnits').textContent = totalUnits;
            document.getElementById('statWeeks').textContent = totalWeeks;
            document.getElementById('statTopicsDone').textContent = doneTopics + '/' + totalTopics;
            document.getElementById('statAssignments').textContent = totalAssignments;
            document.getElementById('statPending').textContent = pendingAssignments;
        }

        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            studyData.years.forEach((year, yi) => {
                const yearKey = `year_${yi}`;
                const isOpen = expanded[yearKey] || false;

                const sec = document.createElement('div');
                sec.className = 'level-section';
                sec.innerHTML = `
                    <div class="level-header" onclick="toggleExpand('${yearKey}')">
                        <div>
                            <div class="name">📅 ${escapeHtml(year.name)}</div>
                            <div class="meta">${year.semesters.length} semesters</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-add" onclick="event.stopPropagation();addSemester(${yi})"><i class="fa fa-plus"></i> Semester</button>
                            <button class="btn btn-edit" onclick="event.stopPropagation();editYear(${yi})"><i class="fa fa-pencil"></i></button>
                            <button class="btn btn-del" onclick="event.stopPropagation();deleteYear(${yi})"><i class="fa fa-trash"></i></button>
                            <i class="fa fa-chevron-${isOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
                        </div>
                    </div>
                    <div class="level-body ${isOpen ? 'open' : ''}">
                `;

                // Semesters
                year.semesters.forEach((semester, si) => {
                    const semKey = `semester_${yi}_${si}`;
                    const semOpen = expanded[semKey] || false;

                    const semDiv = document.createElement('div');
                    semDiv.className = 'level-section';
                    semDiv.style.marginBottom = '12px';
                    semDiv.innerHTML = `
                        <div class="level-header" onclick="toggleExpand('${semKey}')">
                            <div>
                                <div class="name">📘 ${escapeHtml(semester.name)}</div>
                                <div class="meta">${semester.units.length} units</div>
                            </div>
                            <div class="actions">
                                <button class="btn btn-add" onclick="event.stopPropagation();addUnit(${yi}, ${si})"><i class="fa fa-plus"></i> Unit</button>
                                <button class="btn btn-edit" onclick="event.stopPropagation();editSemester(${yi}, ${si})"><i class="fa fa-pencil"></i></button>
                                <button class="btn btn-del" onclick="event.stopPropagation();deleteSemester(${yi}, ${si})"><i class="fa fa-trash"></i></button>
                                <i class="fa fa-chevron-${semOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
                            </div>
                        </div>
                        <div class="level-body ${semOpen ? 'open' : ''}">
                    `;

                    // Units
                    semester.units.forEach((unit, ui) => {
                        const unitKey = `unit_${yi}_${si}_${ui}`;
                        const unitOpen = expanded[unitKey] || false;
                        const weeks = unit.weeks || [];
                        const totalWeeks = weeks.length;
                        const doneWeeks = weeks.filter(w => {
                            const topics = w.topics || [];
                            return topics.every(t => t.completed);
                        }).length;
                        const pct = totalWeeks > 0 ? Math.round((doneWeeks / totalWeeks) * 100) : 0;

                        const unitCard = document.createElement('div');
                        unitCard.className = 'level-section';
                        unitCard.style.marginBottom = '12px';
                        unitCard.style.borderColor = unit.color ? `rgba(0,0,0,0.2)` : '';
                        unitCard.style.borderLeft = unit.color ? `4px solid ${unit.color}` : '';
                        unitCard.innerHTML = `
                            <div class="level-header" onclick="toggleExpand('${unitKey}')">
                                <div>
                                    <div class="name">${escapeHtml(unit.code)} – ${escapeHtml(unit.name)}</div>
                                    <div class="meta">${doneWeeks}/${totalWeeks} weeks · ${pct}%</div>
                                </div>
                                <div class="actions">
                                    <button class="btn btn-add" onclick="event.stopPropagation();addWeek(${yi}, ${si}, ${ui})"><i class="fa fa-plus"></i> Week</button>
                                    <button class="btn btn-edit" onclick="event.stopPropagation();editUnit(${yi}, ${si}, ${ui})"><i class="fa fa-pencil"></i></button>
                                    <button class="btn btn-del" onclick="event.stopPropagation();deleteUnit(${yi}, ${si}, ${ui})"><i class="fa fa-trash"></i></button>
                                    <i class="fa fa-chevron-${unitOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
                                </div>
                            </div>
                            <div class="level-body ${unitOpen ? 'open' : ''}">
                        `;

                        // Weeks
                        weeks.forEach((week, wi) => {
                            const weekKey = `week_${yi}_${si}_${ui}_${wi}`;
                            const weekOpen = expanded[weekKey] || false;
                            const topics = week.topics || [];
                            const doneTopics = topics.filter(t => t.completed).length;
                            const pctWeek = topics.length > 0 ? Math.round((doneTopics / topics.length) * 100) :
                            0;

                            const weekDiv = document.createElement('div');
                            weekDiv.className = 'level-section';
                            weekDiv.style.marginBottom = '8px';
                            weekDiv.style.borderColor = 'var(--border-subtle)';
                            weekDiv.innerHTML = `
                                <div class="level-header" onclick="toggleExpand('${weekKey}')" style="padding:8px 14px;">
                                    <div>
                                        <div class="name">📌 Week ${week.number}</div>
                                        <div class="meta">${doneTopics}/${topics.length} topics · ${pctWeek}%</div>
                                    </div>
                                    <div class="actions">
                                        <button class="btn btn-add" onclick="event.stopPropagation();addTopic(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Topic</button>
                                        <button class="btn btn-add" onclick="event.stopPropagation();addAssignment(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Assignment</button>
                                        <button class="btn btn-edit" onclick="event.stopPropagation();editWeek(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-pencil"></i></button>
                                        <button class="btn btn-del" onclick="event.stopPropagation();deleteWeek(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-trash"></i></button>
                                        <i class="fa fa-chevron-${weekOpen ? 'up' : 'down'}" style="color:var(--text-secondary);"></i>
                                    </div>
                                </div>
                                <div class="level-body ${weekOpen ? 'open' : ''}">
                            `;

                            // Topics
                            topics.forEach((topic, ti) => {
                                const subTopics = topic.subtopics || [];
                                const subDone = (topic.subCompleted || []).filter(Boolean).length;
                                const allDone = subDone === subTopics.length && subTopics.length > 0;
                                const checked = topic.completed || false;

                                const topicKey = `topic_${yi}_${si}_${ui}_${wi}_${ti}`;
                                const topicExpanded = expanded[topicKey] || false;

                                const tDiv = document.createElement('div');
                                tDiv.className = 'topic-item';
                                tDiv.innerHTML = `
                                    <div class="topic-header" onclick="toggleTopicExpand('${topicKey}')">
                                        <div class="check ${checked ? 'checked' : ''}" onclick="event.stopPropagation();toggleTopicComplete(${yi}, ${si}, ${ui}, ${wi}, ${ti})">
                                            <i class="fa fa-check"></i>
                                        </div>
                                        <div class="name">${escapeHtml(topic.name)}</div>
                                        <div class="meta">${subDone}/${subTopics.length}</div>
                                        <div class="actions">
                                            <button class="btn" onclick="event.stopPropagation();addSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti})"><i class="fa fa-plus"></i></button>
                                            <button class="btn" onclick="event.stopPropagation();editTopic(${yi}, ${si}, ${ui}, ${wi}, ${ti})"><i class="fa fa-pencil"></i></button>
                                            <button class="btn btn-del" onclick="event.stopPropagation();deleteTopic(${yi}, ${si}, ${ui}, ${wi}, ${ti})"><i class="fa fa-trash"></i></button>
                                        </div>
                                        <span class="expand-icon"><i class="fa fa-chevron-${topicExpanded ? 'up' : 'down'}"></i></span>
                                    </div>
                                    <div class="subtopic-list ${topicExpanded ? 'open' : ''}">
                                        ${subTopics.map((sub, si2) => {
                                            const subChecked = (topic.subCompleted && topic.subCompleted[si2]) || false;
                                            return `
                                                <div class="subtopic-item">
                                                    <div class="sub-check ${subChecked ? 'checked' : ''}" onclick="toggleSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti}, ${si2})">
                                                        <i class="fa fa-check"></i>
                                                    </div>
                                                    <div class="sub-label ${subChecked ? 'done' : ''}">${escapeHtml(sub)}</div>
                                                    <div class="sub-actions">
                                                        <button class="btn" onclick="deleteSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti}, ${si2})"><i class="fa fa-times"></i></button>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                        <div class="subtopic-add-row">
                                            <button class="btn" onclick="addSubtopic(${yi}, ${si}, ${ui}, ${wi}, ${ti})"><i class="fa fa-plus"></i> Add subtopic</button>
                                        </div>
                                    </div>
                                `;
                                weekDiv.querySelector('.level-body').appendChild(tDiv);
                            });

                            // Assignments for this week
                            const assignments = week.assignments || [];
                            if (assignments.length) {
                                const assSection = document.createElement('div');
                                assSection.className = 'assignments-section';
                                let assHtml = `
                                    <div class="section-title"><i class="fa fa-tasks"></i> Assignments
                                        <button class="btn btn-add-ass" onclick="addAssignment(${yi}, ${si}, ${ui}, ${wi})"><i class="fa fa-plus"></i> Add</button>
                                    </div>
                                `;
                                assignments.forEach((a, ai) => {
                                    const statusClass = a.status === 'pending' ? 'pending' :
                                        a.status === 'in-progress' ? 'in-progress' : 'submitted';
                                    const statusLabel = a.status === 'pending' ? 'Pending' :
                                        a.status === 'in-progress' ? 'In Progress' : '✅ Submitted';
                                    assHtml += `
                                        <div class="assignment-item">
                                            <div class="ass-name">${escapeHtml(a.name)}</div>
                                            <div class="ass-due">${a.due || 'No due date'}</div>
                                            <div class="ass-status ${statusClass}">${statusLabel}</div>
                                            <div class="ass-marks">${a.marks || '—'}</div>
                                            <div class="ass-actions">
                                                <button class="btn btn-edit-ass" onclick="editAssignment(${yi}, ${si}, ${ui}, ${wi}, ${ai})"><i class="fa fa-pencil"></i></button>
                                                <button class="btn btn-del-ass" onclick="deleteAssignment(${yi}, ${si}, ${ui}, ${wi}, ${ai})"><i class="fa fa-trash"></i></button>
                                            </div>
                                        </div>
                                    `;
                                });
                                assSection.innerHTML = assHtml;
                                weekDiv.querySelector('.level-body').appendChild(assSection);
                            }

                            weekDiv.querySelector('.level-body').innerHTML += `</div>`;
                            weekDiv.innerHTML += `</div>`;
                            unitCard.querySelector('.level-body').appendChild(weekDiv);
                        });

                        unitCard.querySelector('.level-body').innerHTML += `</div>`;
                        unitCard.innerHTML += `</div>`;
                        semDiv.querySelector('.level-body').appendChild(unitCard);
                    });

                    semDiv.querySelector('.level-body').innerHTML += `</div>`;
                    semDiv.innerHTML += `</div>`;
                    sec.querySelector('.level-body').appendChild(semDiv);
                });

                sec.querySelector('.level-body').innerHTML += `</div>`;
                sec.innerHTML += `</div>`;
                container.appendChild(sec);
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EXPAND / COLLAPSE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.toggleExpand = function(key) {
            expanded[key] = !expanded[key];
            render();
        };

        window.toggleTopicExpand = function(key) {
            expanded[key] = !expanded[key];
            render();
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  COMPLETION TOGGLES (separate from expand)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.toggleTopicComplete = function(yi, si, ui, wi, ti) {
            const topic = getTopic(yi, si, ui, wi, ti);
            if (!topic) return;
            topic.completed = !topic.completed;
            if (topic.subtopics && topic.subtopics.length) {
                topic.subCompleted = topic.subtopics.map(() => topic.completed);
            }
            saveStudyData().then(render);
        };

        window.toggleSubtopic = function(yi, si, ui, wi, ti, si2) {
            const topic = getTopic(yi, si, ui, wi, ti);
            if (!topic) return;
            if (!topic.subCompleted) topic.subCompleted = topic.subtopics.map(() => false);
            topic.subCompleted[si2] = !topic.subCompleted[si2];
            const allDone = topic.subCompleted.every(Boolean);
            topic.completed = allDone;
            saveStudyData().then(render);
        };

        function getTopic(yi, si, ui, wi, ti) {
            try {
                return studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
            } catch { return null; }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CRUD OPERATIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // Years
        window.addYear = function() {
            openModal('Add Year', `
                <div class="form-group">
                    <label>Year Name (e.g. 2026)</label>
                    <input type="text" id="yearName" placeholder="2026" />
                </div>
            `, () => {
                const name = document.getElementById('yearName').value.trim();
                if (!name) { showToast('Please enter a year name.', 'error'); return false; }
                studyData.years.push({ name, semesters: [] });
                return true;
            });
        };

        window.editYear = function(yi) {
            const year = studyData.years[yi];
            openModal('Edit Year', `
                <div class="form-group">
                    <label>Year Name</label>
                    <input type="text" id="yearName" value="${escapeHtml(year.name)}" />
                </div>
            `, () => {
                const name = document.getElementById('yearName').value.trim();
                if (!name) { showToast('Please enter a year name.', 'error'); return false; }
                year.name = name;
                return true;
            });
        };

        window.deleteYear = function(yi) {
            if (!confirm('Delete this year and all its semesters, units, weeks, topics, and assignments?')) return;
            studyData.years.splice(yi, 1);
            saveStudyData().then(render);
        };

        // Semesters
        window.addSemester = function(yi) {
            openModal('Add Semester', `
                <div class="form-group">
                    <label>Semester Name (e.g. Semester 2)</label>
                    <input type="text" id="semesterName" placeholder="Semester 2" />
                </div>
            `, () => {
                const name = document.getElementById('semesterName').value.trim();
                if (!name) { showToast('Please enter a semester name.', 'error'); return false; }
                studyData.years[yi].semesters.push({ name, units: [] });
                return true;
            });
        };

        window.editSemester = function(yi, si) {
            const sem = studyData.years[yi].semesters[si];
            openModal('Edit Semester', `
                <div class="form-group">
                    <label>Semester Name</label>
                    <input type="text" id="semesterName" value="${escapeHtml(sem.name)}" />
                </div>
            `, () => {
                const name = document.getElementById('semesterName').value.trim();
                if (!name) { showToast('Please enter a semester name.', 'error'); return false; }
                sem.name = name;
                return true;
            });
        };

        window.deleteSemester = function(yi, si) {
            if (!confirm('Delete this semester and all its units?')) return;
            studyData.years[yi].semesters.splice(si, 1);
            saveStudyData().then(render);
        };

        // Units
        window.addUnit = function(yi, si) {
            openModal('Add Unit', `
                <div class="form-group">
                    <label>Unit Code (e.g. BSC106)</label>
                    <input type="text" id="unitCode" placeholder="BSC106" />
                </div>
                <div class="form-group">
                    <label>Unit Name</label>
                    <input type="text" id="unitName" placeholder="Engineering Mathematics 2" />
                </div>
                <div class="form-group">
                    <label>Color (hex, optional)</label>
                    <input type="text" id="unitColor" value="#2fc7ff" />
                </div>
            `, () => {
                const code = document.getElementById('unitCode').value.trim();
                const name = document.getElementById('unitName').value.trim();
                const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';
                if (!name) { showToast('Please enter a unit name.', 'error'); return false; }
                studyData.years[yi].semesters[si].units.push({ code, name, color, weeks: [] });
                return true;
            });
        };

        window.editUnit = function(yi, si, ui) {
            const unit = studyData.years[yi].semesters[si].units[ui];
            openModal('Edit Unit', `
                <div class="form-group">
                    <label>Unit Code</label>
                    <input type="text" id="unitCode" value="${escapeHtml(unit.code)}" />
                </div>
                <div class="form-group">
                    <label>Unit Name</label>
                    <input type="text" id="unitName" value="${escapeHtml(unit.name)}" />
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" id="unitColor" value="${escapeHtml(unit.color)}" />
                </div>
            `, () => {
                const code = document.getElementById('unitCode').value.trim();
                const name = document.getElementById('unitName').value.trim();
                const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';
                if (!name) { showToast('Please enter a unit name.', 'error'); return false; }
                unit.code = code;
                unit.name = name;
                unit.color = color;
                return true;
            });
        };

        window.deleteUnit = function(yi, si, ui) {
            if (!confirm('Delete this unit and all its weeks, topics, and assignments?')) return;
            studyData.years[yi].semesters[si].units.splice(ui, 1);
            saveStudyData().then(render);
        };

        // Weeks
        window.addWeek = function(yi, si, ui) {
            openModal('Add Week', `
                <div class="form-group">
                    <label>Week Number</label>
                    <input type="number" id="weekNumber" min="1" step="1" value="1" />
                </div>
            `, () => {
                const number = parseInt(document.getElementById('weekNumber').value);
                if (!number || number < 1) { showToast('Please enter a valid week number.', 'error'); return false; }
                const unit = studyData.years[yi].semesters[si].units[ui];
                unit.weeks.push({ number, topics: [], assignments: [] });
                return true;
            });
        };

        window.editWeek = function(yi, si, ui, wi) {
            const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
            openModal('Edit Week', `
                <div class="form-group">
                    <label>Week Number</label>
                    <input type="number" id="weekNumber" value="${week.number}" min="1" step="1" />
                </div>
            `, () => {
                const number = parseInt(document.getElementById('weekNumber').value);
                if (!number || number < 1) { showToast('Please enter a valid week number.', 'error'); return false; }
                week.number = number;
                return true;
            });
        };

        window.deleteWeek = function(yi, si, ui, wi) {
            if (!confirm('Delete this week and all its topics and assignments?')) return;
            studyData.years[yi].semesters[si].units[ui].weeks.splice(wi, 1);
            saveStudyData().then(render);
        };

        // Topics
        window.addTopic = function(yi, si, ui, wi) {
            openModal('Add Topic', `
                <div class="form-group">
                    <label>Topic Name</label>
                    <input type="text" id="topicName" placeholder="e.g. Multivariable Calculus" />
                </div>
            `, () => {
                const name = document.getElementById('topicName').value.trim();
                if (!name) { showToast('Please enter a topic name.', 'error'); return false; }
                const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
                week.topics.push({ name, subtopics: [], completed: false, subCompleted: [] });
                return true;
            });
        };

        window.editTopic = function(yi, si, ui, wi, ti) {
            const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
            openModal('Edit Topic', `
                <div class="form-group">
                    <label>Topic Name</label>
                    <input type="text" id="topicName" value="${escapeHtml(topic.name)}" />
                </div>
            `, () => {
                const name = document.getElementById('topicName').value.trim();
                if (!name) { showToast('Please enter a topic name.', 'error'); return false; }
                topic.name = name;
                return true;
            });
        };

        window.deleteTopic = function(yi, si, ui, wi, ti) {
            if (!confirm('Delete this topic and all its subtopics?')) return;
            const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
            week.topics.splice(ti, 1);
            saveStudyData().then(render);
        };

        // Subtopics
        window.addSubtopic = function(yi, si, ui, wi, ti) {
            openModal('Add Subtopic', `
                <div class="form-group">
                    <label>Subtopic Name</label>
                    <input type="text" id="subtopicName" placeholder="e.g. Partial derivatives" />
                </div>
            `, () => {
                const name = document.getElementById('subtopicName').value.trim();
                if (!name) { showToast('Please enter a subtopic name.', 'error'); return false; }
                const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
                if (!topic.subtopics) topic.subtopics = [];
                topic.subtopics.push(name);
                if (!topic.subCompleted) topic.subCompleted = [];
                topic.subCompleted.push(false);
                const allDone = topic.subCompleted.every(Boolean);
                topic.completed = allDone;
                return true;
            });
        };

        window.deleteSubtopic = function(yi, si, ui, wi, ti, si2) {
            if (!confirm('Delete this subtopic?')) return;
            const topic = studyData.years[yi].semesters[si].units[ui].weeks[wi].topics[ti];
            topic.subtopics.splice(si2, 1);
            topic.subCompleted.splice(si2, 1);
            const allDone = topic.subCompleted.every(Boolean);
            topic.completed = allDone;
            saveStudyData().then(render);
        };

        // Assignments
        window.addAssignment = function(yi, si, ui, wi) {
            openModal('Add Assignment', `
                <div class="form-group">
                    <label>Assignment Name</label>
                    <input type="text" id="assName" placeholder="e.g. Quiz 1" />
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="assDue" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="assStatus">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="submitted">Submitted</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks (optional)</label>
                    <input type="text" id="assMarks" placeholder="e.g. 85% or 42/50" />
                </div>
                <div class="form-group">
                    <label>Weighting (%)</label>
                    <input type="number" id="assWeight" placeholder="e.g. 5" min="0" max="100" />
                </div>
            `, () => {
                const name = document.getElementById('assName').value.trim();
                const due = document.getElementById('assDue').value;
                const status = document.getElementById('assStatus').value;
                const marks = document.getElementById('assMarks').value.trim();
                const weight = parseFloat(document.getElementById('assWeight').value) || 0;
                if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
                const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
                if (!week.assignments) week.assignments = [];
                week.assignments.push({ name, due, status, marks, weight });
                return true;
            });
        };

        window.editAssignment = function(yi, si, ui, wi, ai) {
            const ass = studyData.years[yi].semesters[si].units[ui].weeks[wi].assignments[ai];
            openModal('Edit Assignment', `
                <div class="form-group">
                    <label>Assignment Name</label>
                    <input type="text" id="assName" value="${escapeHtml(ass.name)}" />
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="assDue" value="${ass.due || ''}" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="assStatus">
                        <option value="pending" ${ass.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="in-progress" ${ass.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                        <option value="submitted" ${ass.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks</label>
                    <input type="text" id="assMarks" value="${escapeHtml(ass.marks || '')}" />
                </div>
                <div class="form-group">
                    <label>Weighting (%)</label>
                    <input type="number" id="assWeight" value="${ass.weight || ''}" min="0" max="100" />
                </div>
            `, () => {
                const name = document.getElementById('assName').value.trim();
                const due = document.getElementById('assDue').value;
                const status = document.getElementById('assStatus').value;
                const marks = document.getElementById('assMarks').value.trim();
                const weight = parseFloat(document.getElementById('assWeight').value) || 0;
                if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
                ass.name = name;
                ass.due = due;
                ass.status = status;
                ass.marks = marks;
                ass.weight = weight;
                return true;
            });
        };

        window.deleteAssignment = function(yi, si, ui, wi, ai) {
            if (!confirm('Delete this assignment?')) return;
            const week = studyData.years[yi].semesters[si].units[ui].weeks[wi];
            week.assignments.splice(ai, 1);
            saveStudyData().then(render);
        };

        // ─── MODAL HELPERS ───
        function openModal(title, bodyHTML, onSave) {
            const modal = document.getElementById('genericModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            modal.classList.add('open');

            // Store callback
            modal._onSave = onSave;
        }

        document.getElementById('modalCancel').addEventListener('click', () => {
            document.getElementById('genericModal').classList.remove('open');
        });

        document.getElementById('modalSave').addEventListener('click', () => {
            const modal = document.getElementById('genericModal');
            const onSave = modal._onSave;
            if (typeof onSave === 'function') {
                const result = onSave();
                if (result !== false) {
                    modal.classList.remove('open');
                    saveStudyData().then(render);
                    showToast('✅ Saved', 'success');
                }
            }
        });

        // ─── UTILITY ───
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(20px)';
                setTimeout(() => el.remove(), 400);
            }, 3500);
        }

        // ─── SYNC / RESET ───
        document.getElementById('syncBtn').addEventListener('click', async () => {
            showToast('🔄 Syncing...', 'info');
            const loaded = await loadStudyData();
            if (!loaded) {
                studyData = getDefaultData();
                await saveStudyData();
            }
            render();
            showToast('✅ Synced from GitHub', 'success');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('⚠️ Reset ALL data? This will restore the default study plan. Any custom data will be lost.'))
                return;
            studyData = getDefaultData();
            expanded = {};
            saveStudyData().then(() => {
                render();
                showToast('🔄 Reset to default', 'info');
            });
        });

        document.getElementById('addYearBtn').addEventListener('click', window.addYear);

        // ─── FOOTER ───
        function updateFooter() {
            if (window.updateUserFooter) {
                window.updateUserFooter();
                const el = document.getElementById('footerStatus');
                const orig = document.getElementById('userFooterStatus');
                if (el && orig) {
                    el.innerHTML = orig.innerHTML;
                }
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function init() {
            window.showLoading('Loading study data...');

            const loaded = await loadStudyData();
            if (!loaded) {
                studyData = getDefaultData();
                await saveStudyData();
            }

            render();
            updateFooter();
            window.hideLoading();

            // Auto-save on visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    saveStudyData();
                }
            });
        }

        // ─── START ───
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.studyManager = { studyData, render, saveStudyData };
    </script>
</body>
</html>
