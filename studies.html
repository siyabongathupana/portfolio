<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Study Manager · Engineering Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="api.js"></script>
    <script src="shared.js"></script>

    <style>
        /* ─── Same base styles as before ─── */
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #111927;
            --border-subtle: rgba(47, 199, 255, 0.08);
            --text-primary: #e0e8ee;
            --text-secondary: #8a9fb0;
            --accent: #2fc7ff;
            --accent-glow: rgba(47, 199, 255, 0.15);
            --green: #00b894;
            --orange: #fdcb6e;
            --red: #e17055;
            --purple: #a29bfe;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10, 14, 23, 0.85) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 8px 0;
            position: relative;
            z-index: 100;
        }
        .navbar-brand { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; }
        .navbar-brand span { color: var(--accent); }
        .nav-link { color: rgba(255,255,255,0.4) !important; font-size: 0.8rem; transition: 0.2s; letter-spacing: 0.03em; }
        .nav-link:hover { color: var(--accent) !important; }
        .nav-link.active { color: var(--accent) !important; }

        .study-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px 100px;
        }

        .study-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px 0 30px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 30px;
        }
        .study-header h1 {
            font-weight: 800;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .study-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .study-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .study-header .actions .btn {
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 8px 20px;
            transition: 0.25s;
            border: none;
        }
        .btn-sync {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .btn-sync:hover {
            background: rgba(47,199,255,0.12);
            color: var(--accent);
        }
        .btn-primary-glow {
            background: linear-gradient(135deg, var(--accent), #0984e3);
            color: #0a0e17;
        }
        .btn-primary-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(47,199,255,0.2);
            color: #0a0e17;
        }
        .btn-success-glow {
            background: linear-gradient(135deg, var(--green), #00a86b);
            color: white;
        }
        .btn-success-glow:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0,184,148,0.2);
            color: white;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-subtle);
            text-align: center;
            transition: 0.2s;
        }
        .stat-item:hover {
            border-color: rgba(47,199,255,0.2);
            transform: translateY(-2px);
        }
        .stat-item .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
        .stat-item .number.green { color: var(--green); }
        .stat-item .number.orange { color: var(--orange); }
        .stat-item .number.blue { color: var(--accent); }
        .stat-item .number.purple { color: var(--purple); }
        .stat-item .number.red { color: var(--red); }

        /* ─── Semester / Unit structure ─── */
        .semester-section {
            margin-bottom: 32px;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
            background: var(--bg-card);
        }
        .semester-header {
            padding: 16px 24px;
            background: rgba(47,199,255,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .semester-header .semester-name {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .semester-header .semester-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .semester-header .actions {
            display: flex;
            gap: 8px;
        }
        .semester-header .actions .btn {
            border-radius: 40px;
            font-size: 0.7rem;
            padding: 4px 14px;
            border: none;
            transition: 0.2s;
        }
        .btn-add-unit {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
        }
        .btn-add-unit:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .btn-del-semester {
            background: rgba(225,112,85,0.1);
            color: var(--red);
        }
        .btn-del-semester:hover {
            background: rgba(225,112,85,0.2);
            color: var(--red);
        }

        .unit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            padding: 16px 20px;
        }

        .unit-card {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            padding: 16px 18px;
            transition: 0.2s;
            cursor: pointer;
        }
        .unit-card:hover {
            border-color: rgba(47,199,255,0.2);
            transform: translateY(-2px);
            background: rgba(255,255,255,0.04);
        }
        .unit-card .unit-code {
            font-weight: 800;
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.04em;
        }
        .unit-card .unit-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin: 2px 0 6px;
        }
        .unit-card .progress-track {
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .unit-card .progress-track .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--green));
            transition: width 0.6s ease;
        }
        .unit-card .unit-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
        .unit-card .unit-actions {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }
        .unit-card .unit-actions .btn {
            border-radius: 40px;
            font-size: 0.65rem;
            padding: 2px 12px;
            border: none;
            transition: 0.2s;
        }
        .btn-edit-unit {
            background: rgba(47,199,255,0.08);
            color: var(--accent);
        }
        .btn-edit-unit:hover {
            background: rgba(47,199,255,0.15);
        }
        .btn-del-unit {
            background: rgba(225,112,85,0.08);
            color: var(--red);
        }
        .btn-del-unit:hover {
            background: rgba(225,112,85,0.15);
        }

        /* ─── Expanded unit detail (inside semester) ─── */
        .unit-detail {
            display: none;
            padding: 0 20px 20px;
            border-top: 1px solid var(--border-subtle);
            margin-top: 12px;
            animation: slideDown 0.3s ease;
        }
        .unit-detail.open {
            display: block;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .unit-detail .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 12px 0 8px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 16px;
        }
        .unit-detail .detail-header .left .code {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .unit-detail .detail-header .right .btn {
            border-radius: 40px;
            font-size: 0.7rem;
            padding: 4px 14px;
            border: none;
            transition: 0.2s;
        }
        .btn-add-topic {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
        }
        .btn-add-topic:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        .topic-group {
            margin-bottom: 12px;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
        }
        .topic-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.02);
        }
        .topic-header:hover {
            background: rgba(255,255,255,0.04);
        }
        .topic-header .checkbox-custom {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            border: 2px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            background: transparent;
            transition: 0.2s;
        }
        .topic-header .checkbox-custom.checked {
            background: var(--green);
            border-color: var(--green);
        }
        .topic-header .checkbox-custom.checked i {
            color: #fff;
        }
        .topic-header .checkbox-custom i {
            font-size: 11px;
            color: transparent;
        }
        .topic-header .topic-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .topic-header .topic-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .topic-header .topic-actions .btn {
            border-radius: 40px;
            font-size: 0.6rem;
            padding: 2px 10px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .topic-header .topic-actions .btn:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .topic-header .topic-actions .btn-del-topic:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }

        .subtopic-list {
            padding: 0 14px 10px 44px;
            display: none;
        }
        .subtopic-list.open {
            display: block;
        }
        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .subtopic-item:last-child {
            border-bottom: none;
        }
        .subtopic-item .sub-check {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 2px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
        }
        .subtopic-item .sub-check.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .subtopic-item .sub-check.checked i {
            color: #fff;
        }
        .subtopic-item .sub-check i {
            font-size: 9px;
            color: transparent;
        }
        .subtopic-item .sub-label {
            flex: 1;
        }
        .subtopic-item .sub-label.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .subtopic-item .sub-actions .btn {
            border-radius: 40px;
            font-size: 0.55rem;
            padding: 1px 8px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .subtopic-item .sub-actions .btn:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }

        .assignments-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border-subtle);
        }
        .assignments-section .section-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .assignments-section .section-title i {
            color: var(--accent);
        }

        .assignment-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid transparent;
            transition: 0.2s;
            flex-wrap: wrap;
        }
        .assignment-item:hover {
            border-color: var(--border-subtle);
            background: rgba(255,255,255,0.04);
        }
        .assignment-item .ass-name {
            flex: 1;
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 100px;
        }
        .assignment-item .ass-due {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 70px;
        }
        .assignment-item .ass-status {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 10px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .assignment-item .ass-status.pending {
            background: rgba(225,112,85,0.12);
            color: var(--red);
        }
        .assignment-item .ass-status.in-progress {
            background: rgba(253,203,110,0.12);
            color: var(--orange);
        }
        .assignment-item .ass-status.submitted {
            background: rgba(0,184,148,0.12);
            color: var(--green);
        }
        .assignment-item .ass-marks {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 40px;
            text-align: right;
        }
        .assignment-item .ass-actions {
            display: flex;
            gap: 4px;
        }
        .assignment-item .ass-actions .btn {
            border-radius: 40px;
            font-size: 0.6rem;
            padding: 2px 10px;
            border: none;
            transition: 0.2s;
            background: transparent;
            color: var(--text-secondary);
        }
        .assignment-item .ass-actions .btn-edit-ass:hover {
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }
        .assignment-item .ass-actions .btn-del-ass:hover {
            color: var(--red);
            background: rgba(225,112,85,0.05);
        }
        .btn-add-ass {
            background: rgba(255,255,255,0.04);
            color: var(--text-secondary);
            border: 1px dashed var(--border-subtle);
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .btn-add-ass:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47,199,255,0.05);
        }

        /* ─── Modal ─── */
        .modal-custom {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-custom.open {
            display: flex;
        }
        .modal-custom .modal-box {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 28px 32px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-custom .modal-box h3 {
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
        }
        .modal-custom .modal-box .form-group {
            margin-bottom: 14px;
        }
        .modal-custom .modal-box .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .modal-custom .modal-box .form-group input,
        .modal-custom .modal-box .form-group select,
        .modal-custom .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
        }
        .modal-custom .modal-box .form-group input:focus,
        .modal-custom .modal-box .form-group select:focus,
        .modal-custom .modal-box .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,199,255,0.1);
        }
        .modal-custom .modal-box .form-group select option {
            background: #1a2233;
        }
        .modal-custom .modal-box .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-custom .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .modal-custom .modal-box .modal-actions .btn {
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            transition: 0.2s;
        }
        .modal-custom .modal-box .modal-actions .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .modal-custom .modal-box .modal-actions .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }
        .modal-custom .modal-box .modal-actions .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0984e3);
            color: #0a0e17;
        }
        .modal-custom .modal-box .modal-actions .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(47,199,255,0.15);
        }

        /* ─── Toast ─── */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1050;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast-item {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: toastIn 0.3s ease;
            min-width: 240px;
            backdrop-filter: blur(8px);
        }
        .toast-item.success { border-left: 3px solid var(--green); }
        .toast-item.error { border-left: 3px solid var(--red); }
        .toast-item.info { border-left: 3px solid var(--accent); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .study-container { padding: 0 12px 80px; }
            .study-header h1 { font-size: 1.5rem; }
            .unit-grid { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .stat-item .number { font-size: 1.2rem; }
            .semester-header { flex-direction: column; align-items: stretch; }
            .modal-custom .modal-box { padding: 20px; }
        }
        @media (max-width: 480px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
            .study-header .actions .btn { font-size: 0.7rem; padding: 6px 14px; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        .text-muted-light { color: var(--text-secondary); }
        .gap-2 { gap: 8px; }
        .flex-wrap { flex-wrap: wrap; }
        .cursor-pointer { cursor: pointer; }
        .no-select { user-select: none; }
    </style>
</head>
<body>

    <!-- ─── NAV ─── -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand" href="index.html"><span>✦</span> Your<span style="color:#e0e8ee;">Portfolio</span></a>
            <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navStudy">
                <span class="fa fa-bars text-white"></span>

            if (window.SessionManager?.getCurrentUser) {
                const u = window.SessionManager.getCurrentUser();
                if (u) return u;
            }
            try {
                const stored = sessionStorage.getItem('portfolioUser');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.timestamp && Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
                        return data;
                    }
                    sessionStorage.removeItem('portfolioUser');
                }
            } catch {}
            return null;
        }

        async function saveStudyData() {
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const content = JSON.stringify(studyData, null, 2);

                let sha = null;
                try {
                    const existing = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                    if (existing && existing.sha) sha = existing.sha;
                } catch {}

                await GitHubAPI.updateFile(owner, repo, path, studyData, 'Update study data', branch, user.pat, sha);
                console.log('✅ Study data saved to GitHub');
                return true;
            } catch (err) {
                console.error('Save failed:', err);
                showToast('Failed to save: ' + err.message, 'error');
                return false;
            }
        }

        async function loadStudyData() {
            try {
                const { owner, repo, branch } = window.REPO_CONFIG;
                const path = getStudyPath();
                const file = await GitHubAPI.getFileContent(owner, repo, path, branch, user.pat);
                if (file && file.content) {
                    const parsed = JSON.parse(file.content);
                    if (parsed && parsed.semesters) {
                        studyData = parsed;
                        console.log('✅ Study data loaded from GitHub');
                        return true;
                    }
                }
            } catch (err) {
                console.log('No existing study data, initializing...');
            }
            return false;

        function render() {
            renderStats();
            renderSemesters();

        function renderStats() {
            let totalUnits = 0,
                totalTopics = 0,
                doneTopics = 0;
            let totalAssignments = 0,
                pendingAssignments = 0;

            studyData.semesters.forEach(sem => {
                sem.units.forEach(unit => {
                    totalUnits++;
                    const topics = unit.topics || [];
                    totalTopics += topics.length;
                    const done = topics.filter(t => t.completed).length;
                    doneTopics += done;
                    const assignments = unit.assignments || [];
                    totalAssignments += assignments.length;
                    pendingAssignments += assignments.filter(a => a.status === 'pending' || a.status ===
                        'in-progress').length;
                });
            });

            const pct = totalTopics > 0 ? Math.round((doneTopics / totalTopics) * 100) : 0;

            document.getElementById('statSemesters').textContent = studyData.semesters.length;
            document.getElementById('statUnits').textContent = totalUnits;
            document.getElementById('statTopics').textContent = totalTopics;
            document.getElementById('statProgress').textContent = pct + '%';
            document.getElementById('statAssignments').textContent = totalAssignments;
            document.getElementById('statPending').textContent = pendingAssignments;
        }

                    <div class="actions">

                `;
                section.appendChild(header);

                // Unit grid
                const grid = document.createElement('div');
                grid.className = 'unit-grid';
                semester.units.forEach((unit, uIdx) => {
                    const topics = unit.topics || [];
                    const done = topics.filter(t => t.completed).length;
                    const pct = topics.length > 0 ? Math.round((done / topics.length) * 100) : 0;
                    const key = `${sIdx}_${uIdx}`;
                    const isExpanded = expandedUnits[key] || false;

                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.innerHTML = `
                        <div class="unit-code">${escapeHtml(unit.code || '')}</div>
                        <div class="unit-name">${escapeHtml(unit.name || 'Untitled Unit')}</div>
                        <div class="progress-track"><div class="fill" style="width:${pct}%"></div></div>
                        <div class="unit-meta">
                            <span>${done}/${topics.length} topics</span>
                            <span>${pct}%</span>
                        </div>
                        <div class="unit-actions">
                            <button class="btn btn-edit-unit" onclick="editUnit(${sIdx}, ${uIdx})"><i class="fa fa-pencil"></i></button>
                            <button class="btn btn-del-unit" onclick="deleteUnit(${sIdx}, ${uIdx})"><i class="fa fa-trash"></i></button>
                            <button class="btn btn-outline-light" onclick="toggleUnitDetail(${sIdx}, ${uIdx})" style="border:1px solid var(--border-subtle);font-size:0.65rem;padding:2px 10px;">
                                ${isExpanded ? 'Hide' : 'Expand'}
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Detail (expanded)
                    const detail = document.createElement('div');
                    detail.className = `unit-detail ${isExpanded ? 'open' : ''}`;
                    detail.id = `detail_${sIdx}_${uIdx}`;
                    detail.innerHTML = buildUnitDetail(sIdx, uIdx);
                    grid.appendChild(detail);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function buildUnitDetail(sIdx, uIdx) {
            const semester = studyData.semesters[sIdx];
            if (!semester) return '';
            const unit = semester.units[uIdx];
            if (!unit) return '';

            const topics = unit.topics || [];
            const assignments = unit.assignments || [];

            let html = `
                <div class="detail-header">
                    <div class="left">
                        <div class="code">${escapeHtml(unit.code || '')} · ${escapeHtml(unit.name || '')}</div>
                    </div>
                    <div class="right">
                        <button class="btn btn-add-topic" onclick="addTopic(${sIdx}, ${uIdx})"><i class="fa fa-plus"></i> Topic</button>
                    </div>
                </div>
            `;

            // Topics
            topics.forEach((topic, tIdx) => {
                const subTopics = topic.subtopics || [];
                const subDone = (topic.subCompleted || []).filter(Boolean).length;
                const allDone = subDone === subTopics.length && subTopics.length > 0;
                const completed = topic.completed || false;

                html += `
                    <div class="topic-group">
                        <div class="topic-header" onclick="toggleTopic(${sIdx}, ${uIdx}, ${tIdx})">
                            <div class="checkbox-custom ${completed ? 'checked' : ''}" id="topicCheck_${sIdx}_${uIdx}_${tIdx}">
                                <i class="fa fa-check"></i>
                            </div>
                            <div class="topic-name">${escapeHtml(topic.name || 'Untitled Topic')}</div>
                            <div class="topic-meta">${subDone}/${subTopics.length}</div>
                            <div class="topic-actions">
                                <button class="btn" onclick="event.stopPropagation();editTopic(${sIdx}, ${uIdx}, ${tIdx})"><i class="fa fa-pencil"></i></button>
                                <button class="btn btn-del-topic" onclick="event.stopPropagation();deleteTopic(${sIdx}, ${uIdx}, ${tIdx})"><i class="fa fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="subtopic-list ${completed ? 'open' : ''}">
                            ${subTopics.map((sub, si) => {
                                const checked = (topic.subCompleted && topic.subCompleted[si]) || false;
                                return `
                                    <div class="subtopic-item">
                                        <div class="sub-check ${checked ? 'checked' : ''}" onclick="toggleSubtopic(${sIdx}, ${uIdx}, ${tIdx}, ${si})">
                                            <i class="fa fa-check"></i>
                                        </div>
                                        <div class="sub-label ${checked ? 'done' : ''}">${escapeHtml(sub)}</div>
                                        <div class="sub-actions">
                                            <button class="btn" onclick="deleteSubtopic(${sIdx}, ${uIdx}, ${tIdx}, ${si})"><i class="fa fa-times"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                            <div style="margin-top:6px;">
                                <button class="btn btn-add-ass" onclick="addSubtopic(${sIdx}, ${uIdx}, ${tIdx})" style="font-size:0.7rem;padding:2px 12px;">
                                    <i class="fa fa-plus"></i> Add Subtopic
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Assignments
            html += `
                <div class="assignments-section">
                    <div class="section-title">
                        <i class="fa fa-tasks"></i> Assignments
                        <button class="btn btn-add-ass" onclick="addAssignment(${sIdx}, ${uIdx})" style="margin-left:auto;">
                            <i class="fa fa-plus"></i> Add
                        </button>
                    </div>
            `;

            if (assignments.length) {
                assignments.forEach((ass, aIdx) => {
                    const statusClass = ass.status === 'pending' ? 'pending' :
                        ass.status === 'in-progress' ? 'in-progress' : 'submitted';
                    const statusLabel = ass.status === 'pending' ? 'Pending' :
                        ass.status === 'in-progress' ? 'In Progress' : '✅ Submitted';
                    const marksDisplay = ass.marks ? ass.marks : '—';
                    html += `
                        <div class="assignment-item">
                            <div class="ass-name">${escapeHtml(ass.name)}</div>
                            <div class="ass-due">${ass.due || 'No due date'}</div>
                            <div class="ass-status ${statusClass}">${statusLabel}</div>
                            <div class="ass-marks">${marksDisplay}</div>
                            <div class="ass-actions">
                                <button class="btn btn-edit-ass" onclick="editAssignment(${sIdx}, ${uIdx}, ${aIdx})"><i class="fa fa-pencil"></i></button>
                                <button class="btn btn-del-ass" onclick="deleteAssignment(${sIdx}, ${uIdx}, ${aIdx})"><i class="fa fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += `<div class="text-muted-light" style="font-size:0.85rem;padding:8px 0;">No assignments added yet.</div>`;
            }

            html += `</div>`;
            return html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ACTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.toggleUnitDetail = function(sIdx, uIdx) {
            const key = `${sIdx}_${uIdx}`;
            expandedUnits[key] = !expandedUnits[key];
            render();
        };

        window.toggleTopic = function(sIdx, uIdx, tIdx) {
            const semester = studyData.semesters[sIdx];
            if (!semester) return;
            const unit = semester.units[uIdx];
            if (!unit) return;
            const topic = unit.topics[tIdx];
            if (!topic) return;

            const newState = !topic.completed;
            topic.completed = newState;
            if (topic.subtopics && topic.subtopics.length) {
                topic.subCompleted = topic.subtopics.map(() => newState);
            }
            saveStudyData().then(() => {
                render();
                showToast(`${newState ? '✅' : '↩️'} ${topic.name}`, 'info');
            });
        };

        window.toggleSubtopic = function(sIdx, uIdx, tIdx, si) {
            const semester = studyData.semesters[sIdx];
            if (!semester) return;
            const unit = semester.units[uIdx];
            if (!unit) return;
            const topic = unit.topics[tIdx];
            if (!topic) return;

            if (!topic.subCompleted) topic.subCompleted = topic.subtopics.map(() => false);
            topic.subCompleted[si] = !topic.subCompleted[si];
            // Update topic completion
            const allDone = topic.subCompleted.every(Boolean);
            topic.completed = allDone;

            saveStudyData().then(() => {
                render();
                showToast(`${topic.subCompleted[si] ? '✅' : '↩️'} Subtopic`, 'info');
            });
        };

        // ─── Semester CRUD ───
        window.addSemester = function() {
            openModal('Add Semester', `
                <div class="form-group">
                    <label>Semester Name</label>
                    <input type="text" id="semesterName" placeholder="e.g. 2027 Semester 1" />
                </div>
            `, () => {
                const name = document.getElementById('semesterName').value.trim();
                if (!name) { showToast('Please enter a name.', 'error'); return false; }
                studyData.semesters.push({ name: name, units: [] });
                return true;
            });
        };

        window.deleteSemester = function(sIdx) {
            if (!confirm(`Delete semester "${studyData.semesters[sIdx].name}" and all its units?`)) return;
            studyData.semesters.splice(sIdx, 1);
            saveStudyData().then(render);
        };

        // ─── Unit CRUD ───
        window.addUnit = function(sIdx) {
            openModal('Add Unit', `
                <div class="form-group">
                    <label>Unit Code (e.g. BSC106)</label>
                    <input type="text" id="unitCode" placeholder="BSC106" />
                </div>
                <div class="form-group">
                    <label>Unit Name</label>
                    <input type="text" id="unitName" placeholder="Engineering Mathematics 2" />
                </div>
                <div class="form-group">
                    <label>Color (hex code, optional)</label>
                    <input type="text" id="unitColor" placeholder="#2fc7ff" value="#2fc7ff" />
                </div>
            `, () => {
                const code = document.getElementById('unitCode').value.trim();
                const name = document.getElementById('unitName').value.trim();
                const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';
                if (!name) { showToast('Please enter a unit name.', 'error'); return false; }
                studyData.semesters[sIdx].units.push({
                    code: code,
                    name: name,
                    color: color,
                    topics: [],
                    assignments: []
                });
                return true;
            });
        };

        window.editUnit = function(sIdx, uIdx) {
            const unit = studyData.semesters[sIdx].units[uIdx];
            if (!unit) return;
            openModal('Edit Unit', `
                <div class="form-group">
                    <label>Unit Code</label>
                    <input type="text" id="unitCode" value="${escapeHtml(unit.code || '')}" />
                </div>
                <div class="form-group">
                    <label>Unit Name</label>
                    <input type="text" id="unitName" value="${escapeHtml(unit.name || '')}" />
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" id="unitColor" value="${escapeHtml(unit.color || '#2fc7ff')}" />
                </div>
            `, () => {
                const code = document.getElementById('unitCode').value.trim();
                const name = document.getElementById('unitName').value.trim();
                const color = document.getElementById('unitColor').value.trim() || '#2fc7ff';
                if (!name) { showToast('Please enter a unit name.', 'error'); return false; }
                unit.code = code;
                unit.name = name;
                unit.color = color;
                return true;
            });
        };

        window.deleteUnit = function(sIdx, uIdx) {
            if (!confirm('Delete this unit and all its topics and assignments?')) return;
            studyData.semesters[sIdx].units.splice(uIdx, 1);
            saveStudyData().then(render);
        };

        // ─── Topic CRUD ───
        window.addTopic = function(sIdx, uIdx) {
            openModal('Add Topic', `
                <div class="form-group">
                    <label>Topic Name</label>
                    <input type="text" id="topicName" placeholder="e.g. Multivariable Calculus" />
                </div>
            `, () => {
                const name = document.getElementById('topicName').value.trim();
                if (!name) { showToast('Please enter a topic name.', 'error'); return false; }
                const unit = studyData.semesters[sIdx].units[uIdx];
                unit.topics.push({ name: name, subtopics: [], completed: false, subCompleted: [] });
                return true;
            });
        };

        window.editTopic = function(sIdx, uIdx, tIdx) {
            const topic = studyData.semesters[sIdx].units[uIdx].topics[tIdx];
            if (!topic) return;
            openModal('Edit Topic', `
                <div class="form-group">
                    <label>Topic Name</label>
                    <input type="text" id="topicName" value="${escapeHtml(topic.name)}" />
                </div>
            `, () => {
                const name = document.getElementById('topicName').value.trim();
                if (!name) { showToast('Please enter a topic name.', 'error'); return false; }
                topic.name = name;
                return true;
            });
        };

        window.deleteTopic = function(sIdx, uIdx, tIdx) {
            if (!confirm('Delete this topic and all its subtopics?')) return;
            studyData.semesters[sIdx].units[uIdx].topics.splice(tIdx, 1);
            saveStudyData().then(render);
        };

        // ─── Subtopic CRUD ───
        window.addSubtopic = function(sIdx, uIdx, tIdx) {
            openModal('Add Subtopic', `
                <div class="form-group">
                    <label>Subtopic Name</label>
                    <input type="text" id="subtopicName" placeholder="e.g. Partial derivatives" />
                </div>
            `, () => {
                const name = document.getElementById('subtopicName').value.trim();
                if (!name) { showToast('Please enter a subtopic name.', 'error'); return false; }
                const topic = studyData.semesters[sIdx].units[uIdx].topics[tIdx];
                if (!topic.subtopics) topic.subtopics = [];
                topic.subtopics.push(name);
                if (!topic.subCompleted) topic.subCompleted = topic.subtopics.map(() => false);
                else topic.subCompleted.push(false);
                // Update completion status
                const allDone = topic.subCompleted.every(Boolean);
                topic.completed = allDone;
                return true;
            });
        };

        window.deleteSubtopic = function(sIdx, uIdx, tIdx, si) {
            if (!confirm('Delete this subtopic?')) return;
            const topic = studyData.semesters[sIdx].units[uIdx].topics[tIdx];
            topic.subtopics.splice(si, 1);
            topic.subCompleted.splice(si, 1);
            const allDone = topic.subCompleted.every(Boolean);
            topic.completed = allDone;
            saveStudyData().then(render);
        };

        // ─── Assignment CRUD ───
        window.addAssignment = function(sIdx, uIdx) {
            openModal('Add Assignment', `
                <div class="form-group">
                    <label>Assignment Name</label>
                    <input type="text" id="assName" placeholder="e.g. Weekly Quiz" />
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="assDue" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="assStatus">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="submitted">Submitted</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks (optional)</label>
                    <input type="text" id="assMarks" placeholder="e.g. 85% or 42/50" />
                </div>
                <div class="form-group">
                    <label>Weighting (%)</label>
                    <input type="number" id="assWeight" placeholder="e.g. 25" min="0" max="100" />
                </div>
            `, () => {
                const name = document.getElementById('assName').value.trim();
                const due = document.getElementById('assDue').value;
                const status = document.getElementById('assStatus').value;
                const marks = document.getElementById('assMarks').value.trim();
                const weight = parseFloat(document.getElementById('assWeight').value) || 0;
                if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
                const unit = studyData.semesters[sIdx].units[uIdx];
                if (!unit.assignments) unit.assignments = [];
                unit.assignments.push({ name, due, status, marks, weight });
                return true;
            });
        };

        window.editAssignment = function(sIdx, uIdx, aIdx) {
            const ass = studyData.semesters[sIdx].units[uIdx].assignments[aIdx];
            if (!ass) return;
            openModal('Edit Assignment', `
                <div class="form-group">
                    <label>Assignment Name</label>
                    <input type="text" id="assName" value="${escapeHtml(ass.name)}" />
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="assDue" value="${ass.due || ''}" />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="assStatus">
                        <option value="pending" ${ass.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="in-progress" ${ass.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                        <option value="submitted" ${ass.status === 'submitted' ? 'selected' : ''}>Submitted</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks</label>
                    <input type="text" id="assMarks" value="${escapeHtml(ass.marks || '')}" placeholder="e.g. 85% or 42/50" />
                </div>
                <div class="form-group">
                    <label>Weighting (%)</label>
                    <input type="number" id="assWeight" value="${ass.weight || ''}" min="0" max="100" />
                </div>
            `, () => {
                const name = document.getElementById('assName').value.trim();
                const due = document.getElementById('assDue').value;
                const status = document.getElementById('assStatus').value;
                const marks = document.getElementById('assMarks').value.trim();
                const weight = parseFloat(document.getElementById('assWeight').value) || 0;
                if (!name) { showToast('Please enter an assignment name.', 'error'); return false; }
                ass.name = name;
                ass.due = due;
                ass.status = status;
                ass.marks = marks;
                ass.weight = weight;
                return true;
            });
        };

        window.deleteAssignment = function(sIdx, uIdx, aIdx) {
            if (!confirm('Delete this assignment?')) return;
            studyData.semesters[sIdx].units[uIdx].assignments.splice(aIdx, 1);
            saveStudyData().then(render);
        };

        // ─── MODAL HELPERS ───
        function openModal(title, bodyHTML, onSave) {
            const modal = document.getElementById('genericModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            modal.classList.add('open');

            // Store callback
            modal._onSave = onSave;
        }

        document.getElementById('modalCancel').addEventListener('click', () => {
            document.getElementById('genericModal').classList.remove('open');
        });

        document.getElementById('modalSave').addEventListener('click', () => {
            const modal = document.getElementById('genericModal');
            const onSave = modal._onSave;
            if (typeof onSave === 'function') {
                const result = onSave();
                if (result !== false) {
                    modal.classList.remove('open');
                    saveStudyData().then(render);
                    showToast('✅ Saved', 'success');
                }
            }
        });

        // ─── UTILITY ───
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(20px)';
                setTimeout(() => el.remove(), 400);
            }, 3500);
        }

        // ─── SYNC / RESET ───
        document.getElementById('syncBtn').addEventListener('click', async () => {
            showToast('🔄 Syncing...', 'info');
            const loaded = await loadStudyData();
            if (!loaded) {
                // If no data, initialize with default
                studyData = getDefaultData();
                await saveStudyData();
            }
            render();
            showToast('✅ Synced from GitHub', 'success');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('⚠️ Reset ALL data? This will restore default semesters and units. Any custom data will be lost.'))
                return;
            studyData = getDefaultData();
            expandedUnits = {};
            saveStudyData().then(() => {
                render();
                showToast('🔄 Reset to default', 'info');
            });
        });

        document.getElementById('addSemesterBtn').addEventListener('click', window.addSemester);

        // ─── FOOTER ───
        function updateFooter() {
            if (window.updateUserFooter) {
                window.updateUserFooter();
                const el = document.getElementById('footerStatus');
                const orig = document.getElementById('userFooterStatus');
                if (el && orig) {
                    el.innerHTML = orig.innerHTML;
                }
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function init() {
            window.showLoading('Loading study data...');

            const loaded = await loadStudyData();
            if (!loaded) {
                studyData = getDefaultData();
                await saveStudyData();
            }

            render();
            updateFooter();
            window.hideLoading();

            // Auto-save on visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    saveStudyData();
                }
            });
        }

        // ─── START ───
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.studyManager = { studyData, render, saveStudyData };
    </script>
</body>
</html>
