<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification | Your Portfolio</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="auto-encrypt.js"></script>
  <script src="api.js"></script>
  <style>
    .verification-container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .success-icon { color: #28a745; font-size: 4rem; margin-bottom: 20px; }
    .error-icon { color: #dc3545; font-size: 4rem; margin-bottom: 20px; }
    .warning-icon { color: #ffc107; font-size: 4rem; margin-bottom: 20px; }
    .spinner { margin: 20px auto; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #2fc7ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body style="background: #eef3fc;">

<nav class="navbar navbar-expand-lg custom_nav-container pt-3" style="background:#0b2b3b; padding:15px 0;">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span>Your</span> Portfolio</a>
  </div>
</nav>

<div class="container">
  <div class="verification-container" id="verificationContent">
    <div class="spinner" id="loadingSpinner"></div>
    <p id="loadingText">Verifying your email...</p>
  </div>
</div>

<footer class="mt-5">
  <p>© 2026 Your Portfolio</p>
</footer>

<script>
  // IMPORTANT: This token is for verification only - it's from the admin account
  // You need to add this token as a secret in your repository and inject it via GitHub Actions
  // For now, we'll use a prompt to get it (only for testing)
  // In production, this should be handled by a server-side endpoint
  
  async function getServiceToken() {
    // Try to fetch from a hidden endpoint (you'll need to create this)
    // For now, we'll ask the user (not ideal but works for testing)
    return new Promise((resolve) => {
      const token = prompt('Verification requires admin token. Please enter the service token provided by the administrator:');
      resolve(token);
    });
  }

  async function updateGitHubFileWithToken(path, content, message, token) {
    const { owner, repo, branch } = window.REPO_CONFIG;
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    
    let sha = null;
    try {
      const getResp = await fetch(url, {
        headers: { 
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (getResp.ok) {
        const data = await getResp.json();
        sha = data.sha;
      }
    } catch (e) {}
    
    const body = {
      message: message,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
      branch: branch
    };
    if (sha) body.sha = sha;
    
    const resp = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    
    if (!resp.ok) {
      const error = await resp.json();
      throw new Error(`Failed to update ${path}: ${error.message}`);
    }
    
    return resp.json();
  }

  async function readGitHubFile(path) {
    const { owner, repo, branch } = window.REPO_CONFIG;
    const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
    try {
      const resp = await fetch(url);
      if (resp.ok) {
        return await resp.json();
      }
    } catch (e) {}
    return null;
  }

  async function verifyEmail() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');
    
    const container = document.getElementById('verificationContent');
    const spinner = document.getElementById('loadingSpinner');
    const loadingText = document.getElementById('loadingText');
    
    if (!token || !email) {
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-exclamation-triangle error-icon"></i>
        <h3>Invalid Verification Link</h3>
        <p>The verification link is invalid or incomplete.</p>
        <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
      `;
      return;
    }
    
    try {
      const pendingData = await readGitHubFile('data/pending_verification.json');
      const verifiedData = await readGitHubFile('data/verified_users.json');
      
      if (!pendingData) {
        throw new Error('Unable to load verification data');
      }
      
      if (verifiedData && verifiedData.verified && verifiedData.verified.includes(email)) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-check-circle success-icon"></i>
          <h3>Email Already Verified</h3>
          <p>Your email has already been verified.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      const pendingEntry = pendingData.pending.find(p => p.email === email && p.token === token);
      
      if (!pendingEntry) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-times-circle error-icon"></i>
          <h3>Verification Failed</h3>
          <p>The verification link is invalid or has expired.</p>
          <p class="text-muted">Please contact the administrator to request a new verification link.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      if (pendingEntry.expiresAt < Date.now()) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-clock-o warning-icon"></i>
          <h3>Verification Link Expired</h3>
          <p>This verification link has expired (24 hour limit).</p>
          <p>Please contact the administrator to request a new verification link.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      // Get service token from user (or from a secure endpoint)
      // For production, you should create a simple Cloudflare Worker or GitHub API endpoint
      const serviceToken = await getServiceToken();
      
      if (!serviceToken) {
        throw new Error('No service token provided. Please contact the administrator.');
      }
      
      // Update verified_users.json
      const currentVerified = verifiedData?.verified || [];
      const newVerified = { verified: [...currentVerified, email] };
      
      // Update pending_verification.json
      const newPending = { pending: pendingData.pending.filter(p => p.email !== email) };
      
      await updateGitHubFileWithToken('data/verified_users.json', newVerified, `Verify email: ${email}`, serviceToken);
      await updateGitHubFileWithToken('data/pending_verification.json', newPending, `Remove pending verification for ${email}`, serviceToken);
      
      // Also create user's individual verified.json file
      const encUser = encodeURIComponent(email);
      const userVerifiedPath = `data/users/${encUser}/verified.json`;
      const userVerifiedContent = { 
        verified: true, 
        verifiedAt: Date.now(),
        email: email
      };
      
      await updateGitHubFileWithToken(userVerifiedPath, userVerifiedContent, `Mark user ${email} as verified`, serviceToken);
      
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-check-circle success-icon"></i>
        <h3>Email Verified Successfully!</h3>
        <p>Your email has been verified. You can now log in to your account.</p>
        <a href="login.html" class="btn btn-delta mt-3">Proceed to Login</a>
      `;
      
    } catch (error) {
      console.error('Verification error:', error);
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-times-circle error-icon"></i>
        <h3>Verification Failed</h3>
        <p>An error occurred during verification. Please try again or contact support.</p>
        <p class="text-muted">Error: ${error.message}</p>
        <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
      `;
    }
  }
  
  verifyEmail();
</script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
