<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification | Your Portfolio</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <style>
    .verification-container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .success-icon { color: #28a745; font-size: 4rem; margin-bottom: 20px; }
    .error-icon { color: #dc3545; font-size: 4rem; margin-bottom: 20px; }
    .warning-icon { color: #ffc107; font-size: 4rem; margin-bottom: 20px; }
    .spinner { margin: 20px auto; width: 50px; height: 50px; border: 3px solid #f3f3f3; border-top: 3px solid #2fc7ff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body style="background: #eef3fc;">

<nav class="navbar navbar-expand-lg custom_nav-container pt-3" style="background:#0b2b3b; padding:15px 0;">
  <div class="container">
    <a class="navbar-brand" href="index.html"><span>Your</span> Portfolio</a>
  </div>
</nav>

<div class="container">
  <div class="verification-container" id="verificationContent">
    <div class="spinner" id="loadingSpinner"></div>
    <p id="loadingText">Verifying your email...</p>
  </div>
</div>

<footer class="mt-5">
  <p>© 2026 Your Portfolio</p>
</footer>

<script>
  async function verifyEmail() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');
    
    const container = document.getElementById('verificationContent');
    const spinner = document.getElementById('loadingSpinner');
    const loadingText = document.getElementById('loadingText');
    
    if (!token || !email) {
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-exclamation-triangle error-icon"></i>
        <h3>Invalid Verification Link</h3>
        <p>The verification link is invalid or incomplete.</p>
        <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
      `;
      return;
    }
    
    try {
      // Call GitHub API to verify the email
      const { owner, repo, branch, dataPath } = window.REPO_CONFIG;
      const pendingUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/data/pending_verification.json`;
      const verifiedUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/data/verified_users.json`;
      
      // Fetch current pending and verified data
      const [pendingResp, verifiedResp] = await Promise.all([
        fetch(pendingUrl).catch(() => ({ ok: false })),
        fetch(verifiedUrl).catch(() => ({ ok: false }))
      ]);
      
      let pendingData = { pending: [] };
      let verifiedData = { verified: [] };
      
      if (pendingResp.ok) pendingData = await pendingResp.json();
      if (verifiedResp.ok) verifiedData = await verifiedResp.json();
      
      // Check if already verified
      if (verifiedData.verified.includes(email)) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-check-circle success-icon"></i>
          <h3>Email Already Verified</h3>
          <p>Your email has already been verified.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      // Find pending verification
      const pendingEntry = pendingData.pending.find(p => p.email === email && p.token === token);
      
      if (!pendingEntry) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-times-circle error-icon"></i>
          <h3>Verification Failed</h3>
          <p>The verification link is invalid or has expired.</p>
          <p class="text-muted">Please contact the administrator to request a new verification link.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      // Check if token expired
      if (pendingEntry.expiresAt < Date.now()) {
        spinner.style.display = 'none';
        container.innerHTML = `
          <i class="fa fa-clock-o warning-icon"></i>
          <h3>Verification Link Expired</h3>
          <p>This verification link has expired (24 hour limit).</p>
          <p>Please contact the administrator to request a new verification link.</p>
          <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
        `;
        return;
      }
      
      // Verify the email - we need to update the GitHub files
      // Remove from pending, add to verified
      const newPending = pendingData.pending.filter(p => p.email !== email);
      const newVerified = { verified: [...verifiedData.verified, email] };
      
      // Update pending_verification.json
      const updatePendingUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data/pending_verification.json`;
      const updateVerifiedUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data/verified_users.json`;
      
      // Get current SHAs
      let pendingSha = null, verifiedSha = null;
      
      const getPending = await fetch(updatePendingUrl, {
        headers: { 'Authorization': `token ${pendingEntry.token}` }
      });
      if (getPending.ok) {
        const data = await getPending.json();
        pendingSha = data.sha;
      }
      
      const getVerified = await fetch(updateVerifiedUrl, {
        headers: { 'Authorization': `token ${pendingEntry.token}` }
      });
      if (getVerified.ok) {
        const data = await getVerified.json();
        verifiedSha = data.sha;
      }
      
      // Update pending file (remove entry)
      await fetch(updatePendingUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${pendingEntry.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Verify email for ${email}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(newPending, null, 2)))),
          sha: pendingSha,
          branch: branch
        })
      });
      
      // Update verified file (add email)
      await fetch(updateVerifiedUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${pendingEntry.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Add verified email ${email}`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(newVerified, null, 2)))),
          sha: verifiedSha,
          branch: branch
        })
      });
      
      // Also create/update a verification file for this user
      const userVerificationPath = `${dataPath}/users/${encodeURIComponent(email)}/verified.json`;
      const userVerifiedUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${userVerificationPath}`;
      
      await fetch(userVerifiedUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${pendingEntry.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Mark user ${email} as verified`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify({ verified: true, verifiedAt: Date.now() })))),
          branch: branch
        })
      });
      
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-check-circle success-icon"></i>
        <h3>Email Verified Successfully!</h3>
        <p>Your email has been verified. You can now log in to your account.</p>
        <a href="login.html" class="btn btn-delta mt-3">Proceed to Login</a>
      `;
      
    } catch (error) {
      console.error('Verification error:', error);
      spinner.style.display = 'none';
      container.innerHTML = `
        <i class="fa fa-times-circle error-icon"></i>
        <h3>Verification Failed</h3>
        <p>An error occurred during verification. Please try again or contact support.</p>
        <p class="text-muted">Error: ${error.message}</p>
        <a href="login.html" class="btn btn-delta mt-3">Go to Login</a>
      `;
    }
  }
  
  // Run verification
  verifyEmail();
</script>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
