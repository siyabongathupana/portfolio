<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Career Galaxy | Timesheet</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Bootstrap & Font Awesome -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #05080a;
            color: #e0e8ee;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Navbar */
        .navbar {
            background: rgba(5, 8, 10, 0.8) !important;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(47, 199, 255, 0.12);
            position: relative;
            z-index: 100;
            padding: 8px 0;
        }
        .navbar-brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
        .navbar-brand span { color: #2fc7ff; }
        .nav-link { color: rgba(255,255,255,0.6) !important; font-size: 0.85rem; transition: 0.2s; }
        .nav-link:hover { color: #2fc7ff !important; }
        .nav-link.active { color: #2fc7ff !important; }

        /* Controls */
        #controls {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(5, 8, 10, 0.75);
            backdrop-filter: blur(12px);
            padding: 14px 28px;
            border-radius: 60px;
            border: 1px solid rgba(47, 199, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7);
            pointer-events: auto;
        }
        #controls label { font-size: 0.75rem; font-weight: 600; color: #8a9fb0; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
        #controls input[type="range"] {
            width: 180px;
            height: 3px;
            -webkit-appearance: none;
            background: #1a3a44;
            border-radius: 2px;
            outline: none;
            transition: 0.2s;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2fc7ff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(47,199,255,0.4);
            transition: 0.2s;
        }
        #controls input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        #controls .btn {
            border-radius: 40px;
            font-size: 0.75rem;
            padding: 6px 18px;
            font-weight: 600;
            border: none;
            transition: 0.2s;
        }
        #controls .btn-sync { background: rgba(255,255,255,0.08); color: #8a9fb0; }
        #controls .btn-sync:hover { background: rgba(47,199,255,0.2); color: #2fc7ff; }
        #controls .btn-primary { background: #2fc7ff; color: #05080a; }
        #controls .btn-primary:hover { background: #1d9fcf; transform: scale(1.03); }
        #controls .btn-outline-light { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #e0e8ee; }
        #controls .btn-outline-light:hover { background: rgba(255,255,255,0.06); border-color: #2fc7ff; }
        #controls .btn-success { background: #28a745; color: white; }
        #controls .btn-success:hover { background: #1e7e34; }
        #timeLabel { font-size: 0.7rem; color: #8a9fb0; min-width: 60px; text-align: center; font-weight: 600; }
        #syncStatus { font-size: 0.6rem; color: #8a9fb0; font-weight: 500; }

        /* Stats overlay */
        #statsOverlay {
            position: absolute;
            top: 76px;
            left: 24px;
            z-index: 40;
            pointer-events: none;
        }
        #statsOverlay .stat {
            font-size: 1.6rem;
            font-weight: 900;
            color: white;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(47,199,255,0.2);
        }
        #statsOverlay .stat small {
            font-size: 0.7rem;
            font-weight: 400;
            color: #8a9fb0;
            display: block;
            margin-top: -2px;
        }
        #statsOverlay .stat-row { display: flex; gap: 40px; margin-bottom: 8px; }

        /* Side Panel */
        #sidePanel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 420px;
            height: 100%;
            background: rgba(5, 8, 10, 0.92);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(47, 199, 255, 0.15);
            padding: 30px 28px;
            overflow-y: auto;
            transition: right 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
            color: #e0e8ee;
        }
        #sidePanel.open { right: 0; }
        #sidePanel .close-btn {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #5a7d9a;
            transition: 0.2s;
            background: rgba(255,255,255,0.04);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #sidePanel .close-btn:hover { color: #2fc7ff; background: rgba(47,199,255,0.1); }
        #sidePanel h2 { font-weight: 800; color: #2fc7ff; margin-top: 4px; font-size: 1.8rem; letter-spacing: -0.5px; }
        #sidePanel .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        #sidePanel .detail-label { color: #8a9fb0; font-weight: 500; font-size: 0.85rem; }
        #sidePanel .detail-value { font-weight: 600; font-size: 0.95rem; }
        #sidePanel .achievement-tag {
            display: inline-block;
            background: rgba(47,199,255,0.12);
            color: #2fc7ff;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            margin: 3px 4px 0 0;
            border: 1px solid rgba(47,199,255,0.1);
        }
        #sidePanel .skill-tag {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            color: #e0e8ee;
            padding: 3px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            margin: 3px 4px 0 0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        #sidePanel .progress-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }
        #sidePanel .progress-ring .pct {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
        }
        .panel-section-title { font-weight: 700; color: #2fc7ff; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 18px 0 10px; }

        /* Achievement toast */
        #achievementContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
        }
        .achievement-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 8, 10, 0.92);
            backdrop-filter: blur(16px);
            border: 2px solid #2fc7ff;
            border-radius: 28px;
            padding: 32px 56px;
            text-align: center;
            z-index: 300;
            animation: achPop 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 0 80px rgba(47,199,255,0.2);
            pointer-events: none;
        }
        .achievement-toast .icon { font-size: 4rem; margin-bottom: 8px; }
        .achievement-toast .title { font-size: 1.6rem; font-weight: 800; color: #2fc7ff; }
        .achievement-toast .desc { font-size: 0.95rem; color: #e0e8ee; margin-top: 4px; opacity: 0.7; }
        @keyframes achPop {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Toast */
        #toastContainer { position: fixed; bottom: 90px; right: 24px; z-index: 150; }
        #toastContainer .toast { background: rgba(5,8,10,0.85); backdrop-filter: blur(8px); border: 1px solid rgba(47,199,255,0.12); color: #e0e8ee; min-width: 200px; }

        /* Responsive */
        @media (max-width: 768px) {
            #controls { bottom: 16px; padding: 12px 16px; width: 92%; border-radius: 28px; gap: 12px; flex-direction: column; }
            #controls input[type="range"] { width: 100%; }
            #sidePanel { width: 100%; right: -100%; padding: 20px; }
            #statsOverlay { top: 68px; left: 16px; }
            #statsOverlay .stat { font-size: 1.2rem; }
            #statsOverlay .stat-row { gap: 20px; }
            .achievement-toast { padding: 24px 32px; max-width: 90%; }
            .achievement-toast .title { font-size: 1.2rem; }
        }
        @media (max-width: 480px) {
            #controls .btn { font-size: 0.65rem; padding: 4px 12px; }
            #controls label { font-size: 0.65rem; }
            #timeLabel { font-size: 0.6rem; min-width: 50px; }
        }
    </style>

        {
            "imports": {

                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const state = {
            entries: [],
            allDates: [],
            projects: [],
            isReplaying: false,
            isRecording: false,
            mediaRecorder: null,
            recordedChunks: [],
            audioCtx: null,
            musicNodes: [],
            isMuted: false,
            achievements: new Set(),
            currentTimeIdx: 0,
            selectedProject: null,
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // THREE.JS SETUP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const container = document.getElementById('three-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05080a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 500);
        camera.position.set(18, 10, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 0.4;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.3;
        controls.minDistance = 5;
        controls.maxDistance = 80;
        controls.target.set(0, 0, 0);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // POST-PROCESSING (Bloom)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(container.clientWidth, container.clientHeight),
            0.6,  // strength
            0.4,  // radius
            0.2   // threshold
        );
        composer.addPass(bloomPass);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SCENE OBJECTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        let starField, coreGlow, coreParticles, nebulaClouds = [];
        let projectMeshes = [], linkLines = [], energyParticles = [];
        let labelObjects = [];

        // ── Starfield ──
        function createStarfield() {
            const count = 6000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const r = 50 + Math.random() * 150;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
                pos[i*3+2] = r * Math.cos(phi);
                sizes[i] = 0.1 + Math.random() * 0.4;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const mat = new THREE.PointsMaterial({
                color: 0x8899bb,
                size: 0.15,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            starField = new THREE.Points(geo, mat);
            scene.add(starField);
        }
        createStarfield();

        // ── Galaxy Core ──
        function createCore() {
            // Glow sphere
            const coreGeo = new THREE.SphereGeometry(1.8, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({
                color: 0x2fc7ff,
                transparent: true,
                opacity: 0.6,
            });
            coreGlow = new THREE.Mesh(coreGeo, coreMat);
            galaxyGroup.add(coreGlow);

            // Core particle halo
            const count = 800;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = 1.5 + Math.random() * 4;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
                pos[i*3+2] = r * Math.cos(phi);
                const c = new THREE.Color().setHSL(0.58 + Math.random() * 0.08, 0.9, 0.5 + Math.random() * 0.3);
                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            coreParticles = new THREE.Points(geo, mat);
            galaxyGroup.add(coreParticles);
        }
        createCore();

        // ── Nebula clouds (per category) ──
        const categoryColors = {
            'Training': 0x6c5ce7,
            'Meetings': 0xfdcb6e,
            'CFAT': 0x00b894,
            'IFAT': 0x0984e3,
            'Implementation': 0xe17055,
            'Documentation': 0xfd79a8,
            'Graphics': 0xa29bfe,
            'Software': 0x55efc4,
            'Hardware': 0xfab1a0,
            'Study Leave': 0x81ecec,
            'Admin': 0xffeaa7,
            'Back-Punching': 0xd63031,
            'Site': 0xe17055,
            'Other': 0x636e72,
        };
        const categoryPositions = {};

        function createNebulaClouds(projects) {
            // Remove old clouds
            nebulaClouds.forEach(c => galaxyGroup.remove(c));
            nebulaClouds = [];

            const cats = [...new Set(projects.flatMap(p => p.categories))];
            const angleStep = (Math.PI * 2) / Math.max(cats.length, 1);

            cats.forEach((cat, idx) => {
                const angle = idx * angleStep + 0.3;
                const radius = 6 + Math.random() * 3;
                const count = 120;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                const cols = new Float32Array(count * 3);
                const color = new THREE.Color(categoryColors[cat] || 0x636e72);
                for (let i = 0; i < count; i++) {
                    const spread = 2.5 + Math.random() * 3;
                    const theta = angle + (Math.random() - 0.5) * 1.2;
                    const r = radius + (Math.random() - 0.5) * spread * 0.8;
                    const y = (Math.random() - 0.5) * spread * 0.6;
                    pos[i*3] = Math.cos(theta) * r;
                    pos[i*3+1] = y;
                    pos[i*3+2] = Math.sin(theta) * r;
                    const c = color.clone().lerp(new THREE.Color(0xffffff), Math.random() * 0.3);
                    cols[i*3] = c.r;
                    cols[i*3+1] = c.g;
                    cols[i*3+2] = c.b;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
                const mat = new THREE.PointsMaterial({
                    size: 0.5 + Math.random() * 0.5,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.15 + Math.random() * 0.1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true,
                });
                const cloud = new THREE.Points(geo, mat);
                galaxyGroup.add(cloud);
                nebulaClouds.push(cloud);
                categoryPositions[cat] = { angle, radius };
            });
        }

        // ── Build galaxy from projects ──
        function buildGalaxy(projects, timeIdx) {
            // Clear old objects
            projectMeshes.forEach(m => galaxyGroup.remove(m));
            linkLines.forEach(l => galaxyGroup.remove(l));
            energyParticles.forEach(p => galaxyGroup.remove(p));
            labelObjects.forEach(l => galaxyGroup.remove(l));
            projectMeshes = [];
            linkLines = [];
            energyParticles = [];
            labelObjects = [];

            const cutoff = state.allDates[Math.min(timeIdx, state.allDates.length - 1)] || '2024-01-01';
            const filtered = projects.filter(p => p.startDate && p.startDate <= cutoff);

            if (!filtered.length) {
                // Show empty state
                const emptyText = document.createElement('div');
                emptyText.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#5a7d9a;font-size:1.2rem;pointer-events:none;z-index:10;';
                emptyText.textContent = '✦ No projects in this time period';
                document.body.appendChild(emptyText);
                setTimeout(() => emptyText.remove(), 2000);
                return;
            }

            // Create nebula clouds based on categories present
            createNebulaClouds(filtered);

            // Distribute projects on spiral arms
            const numProjects = filtered.length;
            const arms = 4;
            const armAngleOffset = Math.PI * 2 / arms;
            const maxRadius = 14;
            const minRadius = 2.5;

            // Group by category for arm assignment
            const catGroups = {};
            filtered.forEach(p => {
                const cat = p.primaryCategory || 'Other';
                if (!catGroups[cat]) catGroups[cat] = [];
                catGroups[cat].push(p);
            });
            const catList = Object.keys(catGroups);
            const catAngleMap = {};
            catList.forEach((cat, i) => {
                catAngleMap[cat] = (i / catList.length) * Math.PI * 2;
            });

            // Position each project
            filtered.forEach((p, i) => {
                const hours = p.totalHours;
                const size = 0.3 + Math.sqrt(hours) * 0.35;
                const cat = p.primaryCategory || 'Other';
                const baseAngle = catAngleMap[cat] || (i * 0.5);
                const armIndex = Math.floor(i / (numProjects / arms));
                const armAngle = armIndex * armAngleOffset + baseAngle * 0.3;

                // Spiral: radius increases with index, with some randomness
                const t = i / Math.max(numProjects - 1, 1);
                const radius = minRadius + t * t * (maxRadius - minRadius);
                const angle = armAngle + t * 2.5 + (Math.random() - 0.5) * 0.3;
                const yOffset = (Math.random() - 0.5) * 0.8 * (1 - t * 0.5);

                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = yOffset * 0.6;

                p._pos = new THREE.Vector3(x, y, z);
                p._radius = size;
                p._angle = angle;
            });

            // Create spheres with glow
            const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
            filtered.forEach((p) => {
                const pos = p._pos;
                const size = p._radius;

                // Main sphere
                const color = new THREE.Color(categoryColors[p.primaryCategory] || 0x2fc7ff);
                const mat = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.4 + Math.min(p.totalHours / 200, 0.6),
                    roughness: 0.15,
                    metalness: 0.05,
                });
                const mesh = new THREE.Mesh(sphereGeo, mat);
                mesh.scale.set(size, size, size);
                mesh.position.copy(pos);
                mesh.userData = p;
                galaxyGroup.add(mesh);
                projectMeshes.push(mesh);

                // Glow sprite (halo)
                const spriteMap = createGlowSprite(color);
                const spriteMat = new THREE.SpriteMaterial({
                    map: spriteMap,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    opacity: 0.3 + Math.min(p.totalHours / 300, 0.5),
                    depthWrite: false,
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(size * 5, size * 5, 1);
                sprite.position.copy(pos);
                sprite.userData = { isGlow: true };
                galaxyGroup.add(sprite);
                projectMeshes.push(sprite);

                // Label (CSS2DRenderer alternative: use sprite with text? We'll use Three.js Sprite with canvas)
                const label = createLabelSprite(p.title, size);
                label.position.set(pos.x, pos.y + size * 1.8 + 0.6, pos.z);
                label.userData = { isLabel: true };
                galaxyGroup.add(label);
                labelObjects.push(label);
            });

            // ── Curved energy links ──
            const linkMat = new THREE.LineBasicMaterial({
                color: 0x2fc7ff,
                transparent: true,
                opacity: 0.15,
            });

            // Build links between projects that share categories
            const linkSet = new Set();
            for (let i = 0; i < filtered.length; i++) {
                for (let j = i + 1; j < filtered.length; j++) {
                    const a = filtered[i];
                    const b = filtered[j];
                    const shared = a.categories.some(c => b.categories.includes(c));
                    if (shared) {
                        const key = [a.id, b.id].sort().join('-');
                        if (!linkSet.has(key)) {
                            linkSet.add(key);
                            const p1 = a._pos;
                            const p2 = b._pos;
                            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                            const offset = new THREE.Vector3(
                                (Math.random() - 0.5) * 1.5,
                                (Math.random() - 0.5) * 1.0 + 0.5,
                                (Math.random() - 0.5) * 1.5
                            );
                            mid.add(offset);

                            const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
                            const points = curve.getPoints(20);
                            const geo = new THREE.BufferGeometry().setFromPoints(points);
                            const line = new THREE.Line(geo, linkMat.clone());
                            galaxyGroup.add(line);
                            linkLines.push(line);

                            // Energy particles along the curve
                            createEnergyParticles(curve, a, b);
                        }
                    }
                }
            }

            updateStats(filtered);
        }

        // ── Glow sprite texture ──
        function createGlowSprite(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            const c = new THREE.Color(color);
            gradient.addColorStop(0, `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},1)`);
            gradient.addColorStop(0.3, `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.6)`);
            gradient.addColorStop(1, `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0)`);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // ── Label sprite ──
        function createLabelSprite(text, size) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 256, 64);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '600 20px Inter, system-ui, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#e0e8ee';
            const maxWidth = 220;
            let displayText = text;
            if (ctx.measureText(text).width > maxWidth) {
                while (ctx.measureText(displayText + '…').width > maxWidth && displayText.length > 3) {
                    displayText = displayText.slice(0, -1);
                }
                displayText += '…';
            }
            ctx.fillText(displayText, 128, 34);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const mat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false,
                opacity: 0.9,
                sizeAttenuation: true,
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(3.5, 0.9, 1);
            return sprite;
        }

        // ── Energy particles along curves ──
        function createEnergyParticles(curve, a, b) {
            const count = 15;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const progress = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                progress[i] = i / count;
                const pt = curve.getPoint(progress[i]);
                pos[i*3] = pt.x;
                pos[i*3+1] = pt.y;
                pos[i*3+2] = pt.z;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('progress', new THREE.BufferAttribute(progress, 1));

            const mat = new THREE.PointsMaterial({
                color: 0x2fc7ff,
                size: 0.12,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const particles = new THREE.Points(geo, mat);
            particles.userData = { curve, progress: progress.slice(), offset: Math.random() * 100 };
            galaxyGroup.add(particles);
            energyParticles.push(particles);
        }

        // ── Update energy particles (animate along curves) ──
        function updateEnergyParticles(time) {
            energyParticles.forEach(p => {
                const positions = p.geometry.attributes.position.array;
                const prog = p.userData.progress;
                const curve = p.userData.curve;
                const offset = p.userData.offset;
                for (let i = 0; i < prog.length; i++) {
                    let t = (prog[i] + time * 0.08 + offset * 0.01) % 1;
                    const pt = curve.getPoint(t);
                    positions[i*3] = pt.x;
                    positions[i*3+1] = pt.y;
                    positions[i*3+2] = pt.z;
                }
                p.geometry.attributes.position.needsUpdate = true;
            });
        }

        // ── Stats ──
        function updateStats(projects) {
            const totalHours = projects.reduce((s, p) => s + p.totalHours, 0);
            const cats = new Set(projects.flatMap(p => p.categories));
            // Streak: consecutive days with at least one entry
            const dates = [...new Set(state.entries.filter(e => {
                const p = projects.find(p => p.id === e.project);
                return p;
            }).map(e => e.date))].sort();
            let streak = 0;
            for (let i = dates.length - 1; i >= 0; i--) {
                const d = new Date(dates[i]);
                const prev = i > 0 ? new Date(dates[i-1]) : null;
                if (prev && (d - prev) / (1000*60*60*24) <= 1.5) {
                    streak++;
                } else if (i === dates.length - 1) {
                    streak = 1;
                } else {
                    break;
                }
            }

            document.getElementById('statProjects').innerHTML = `${projects.length} <small>Projects</small>`;
            document.getElementById('statHours').innerHTML = `${Math.round(totalHours)} <small>Hours</small>`;
            document.getElementById('statCategories').innerHTML = `${cats.size} <small>Categories</small>`;
            document.getElementById('statStreak').innerHTML = `${streak} <small>Day Streak</small>`;
        }

        // ──────────────────────────────────────────────────────
        // DATA LOADING (GitHub)
        // ──────────────────────────────────────────────────────
        const user = window.SessionManager?.getCurrentUser();
        if (!user) {
            window.location.href = 'login.html?redirect=galaxy';
        }

        async function fetchTimesheet() {
            const { owner, repo, branch, dataPath } = window.REPO_CONFIG;
            const encUser = encodeURIComponent(user.username);
            const path = `${dataPath}/users/${encUser}/timesheet.json`;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;

            const resp = await fetch(url, {
                headers: { Authorization: `token ${user.pat}`, Accept: 'application/vnd.github.v3+json' }
            });
            if (!resp.ok) {
                if (resp.status === 404) return [];
                throw new Error(`GitHub: ${resp.status}`);
            }
            const data = await resp.json();
            const content = atob(data.content.replace(/\n/g, ''));
            try { return JSON.parse(content); } catch { return []; }
        }

        function loadFromCache() {
            try {
                const raw = localStorage.getItem('timesheet_entries_cache');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.entries)) return parsed.entries;
                }
            } catch {}
            return null;
        }

        function saveCache(entries) {
            localStorage.setItem('timesheet_entries_cache', JSON.stringify({ entries, timestamp: Date.now() }));
        }

        // ── Aggregate projects from entries ──
        function aggregateProjects(entries) {
            const map = new Map();
            entries.forEach(e => {
                const name = e.project || 'Unnamed';
                if (!map.has(name)) {
                    map.set(name, {
                        id: name,
                        title: name,
                        totalHours: 0,
                        count: 0,
                        categories: new Set(),
                        dates: [],
                    });
                }
                const p = map.get(name);
                p.totalHours += parseFloat(e.hours) || 0;
                p.count++;
                if (e.category) p.categories.add(e.category);
                if (e.date) p.dates.push(e.date);
            });
            const result = [];
            for (let [name, p] of map) {
                const cats = Array.from(p.categories);
                const catCount = {};
                cats.forEach(c => catCount[c] = (catCount[c] || 0) + 1);
                const sorted = Object.entries(catCount).sort((a,b) => b[1] - a[1]);
                const primary = sorted.length ? sorted[0][0] : 'Other';
                const dates = p.dates.sort();
                const start = dates.length ? dates[0] : null;
                const end = dates.length ? dates[dates.length-1] : null;
                const isActive = end ? (new Date() - new Date(end) < 30*24*60*60*1000) : false;
                result.push({
                    id: name,
                    title: name,
                    totalHours: p.totalHours,
                    count: p.count,
                    categories: cats,
                    primaryCategory: primary,
                    startDate: start,
                    endDate: end,
                    status: isActive ? 'Active' : 'Completed',
                });
            }
            result.sort((a,b) => b.totalHours - a.totalHours);
            return result;
        }

        async function loadData(showLoading = true) {
            if (showLoading) window.showLoading('Fetching from GitHub...');
            try {
                const entries = await fetchTimesheet();
                if (entries.length) {
                    state.entries = entries;
                    saveCache(entries);
                } else {
                    const cached = loadFromCache();
                    if (cached) {
                        state.entries = cached;
                        document.getElementById('syncStatus').textContent = '⚠️ Cached';
                    } else {
                        state.entries = [];
                    }
                }
            } catch (err) {
                console.warn('GitHub fetch failed, using cache', err);
                const cached = loadFromCache();
                if (cached) {
                    state.entries = cached;
                    document.getElementById('syncStatus').textContent = '⚠️ Offline';
                } else {
                    state.entries = [];
                }
            } finally {
                if (showLoading) window.hideLoading();
            }

            // Extract dates
            const dateSet = new Set();
            state.entries.forEach(e => { if (e.date) dateSet.add(e.date); });
            state.allDates = Array.from(dateSet).sort();
            if (!state.allDates.length) state.allDates = [new Date().toISOString().slice(0,10)];

            state.projects = aggregateProjects(state.entries);
            document.getElementById('syncStatus').textContent = state.entries.length ? '● Live' : '● No data';
            document.getElementById('syncStatus').style.color = state.entries.length ? '#28a745' : '#dc3545';

            return state.projects;
        }

        // ──────────────────────────────────────────────────────
        // GALAXY BUILD
        // ──────────────────────────────────────────────────────
        function buildGalaxyFromData(timeIdx) {
            const projects = aggregateProjects(state.entries);
            buildGalaxy(projects, timeIdx);
        }

        // ──────────────────────────────────────────────────────
        // REPLAY
        // ──────────────────────────────────────────────────────
        let replayInterval = null;

        function startReplay() {
            if (state.isReplaying) return;
            state.isReplaying = true;
            let idx = 0;
            const steps = state.allDates.length;
            if (!steps) { state.isReplaying = false; return; }

            // Play music
            playMusic();

            document.getElementById('replayBtn').innerHTML = '<i class="fa fa-stop"></i> Stop';

            replayInterval = setInterval(() => {
                if (idx >= steps) {
                    clearInterval(replayInterval);
                    state.isReplaying = false;
                    document.getElementById('replayBtn').innerHTML = '<i class="fa fa-play"></i> Replay';
                    stopMusic();
                    showToast('🎉 Replay complete!', 'success');
                    // Final achievement check
                    checkAchievements(aggregateProjects(state.entries));
                    return;
                }
                const val = (idx / steps) * 100;
                document.getElementById('timeSlider').value = val;
                document.getElementById('timeLabel').textContent = state.allDates[idx] || 'All';
                buildGalaxyFromData(idx);
                const projs = aggregateProjects(state.entries);
                checkAchievements(projs);
                idx++;
            }, 400);
        }

        function stopReplay() {
            if (replayInterval) {
                clearInterval(replayInterval);
                replayInterval = null;
            }
            state.isReplaying = false;
            document.getElementById('replayBtn').innerHTML = '<i class="fa fa-play"></i> Replay';
            stopMusic();
        }

        // ──────────────────────────────────────────────────────
        // ACHIEVEMENTS
        // ──────────────────────────────────────────────────────
        const achievementDefs = [
            { id: 'first', condition: (p) => p.length >= 1, icon: '🌟', title: 'First Project', desc: 'Your journey begins!' },
            { id: 'ten', condition: (p) => p.length >= 10, icon: '🏆', title: '10 Projects', desc: 'Double digits!' },
            { id: 'hundred_hours', condition: (p) => p.reduce((s,n) => s + n.totalHours, 0) >= 100, icon: '⚡', title: '100 Hours', desc: 'Century mark!' },
            { id: 'five_hundred_hours', condition: (p) => p.reduce((s,n) => s + n.totalHours, 0) >= 500, icon: '🔥', title: '500 Hours', desc: 'Half a thousand!' },
            { id: 'all_completed', condition: (p) => p.length > 0 && p.every(n => n.status === 'Completed'), icon: '🎯', title: 'All Completed', desc: 'Mission accomplished!' },
        ];

        function checkAchievements(projects) {
            achievementDefs.forEach(def => {
                if (!state.achievements.has(def.id) && def.condition(projects)) {
                    state.achievements.add(def.id);
                    showAchievement(def.icon, def.title, def.desc);
                    showToast(`${def.icon} ${def.title} unlocked!`, 'success');
                    // Trigger galaxy flash effect
                    triggerGalaxyFlash();
                }
            });
        }

        function showAchievement(icon, title, desc) {
            const container = document.getElementById('achievementContainer');
            const el = document.createElement('div');
            el.className = 'achievement-toast';
            el.innerHTML = `
                <div class="icon">${icon}</div>
                <div class="title">${title}</div>
                <div class="desc">${desc}</div>
            `;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 3500);
        }

        function triggerGalaxyFlash() {
            bloomPass.strength = 1.5;
            setTimeout(() => { bloomPass.strength = 0.6; }, 600);
        }

        // ──────────────────────────────────────────────────────
        // MUSIC (Web Audio)
        // ──────────────────────────────────────────────────────
        function playMusic() {
            if (state.audioCtx) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                state.audioCtx = ctx;
                const gain = ctx.createGain();
                gain.gain.value = 0.08;
                gain.connect(ctx.destination);

                const freqs = [220, 330, 440, 550, 660];
                const nodes = freqs.map(f => {
                    const osc = ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const g = ctx.createGain();
                    g.gain.value = 0.04 + (f / 660) * 0.04;
                    osc.connect(g);
                    g.connect(gain);
                    osc.start();
                    return osc;
                });
                state.musicNodes = nodes;
                state.musicGain = gain;
            } catch(e) { console.warn('Music not supported', e); }
        }

        function stopMusic() {
            state.musicNodes.forEach(n => { try { n.stop(); } catch(e) {} });
            state.musicNodes = [];
            if (state.audioCtx) {
                try { state.audioCtx.close(); } catch(e) {}
                state.audioCtx = null;
            }
        }

        function toggleMute() {
            state.isMuted = !state.isMuted;
            if (state.musicGain) {
                state.musicGain.gain.value = state.isMuted ? 0 : 0.08;
            }
            document.getElementById('muteBtn').innerHTML = state.isMuted ? '<i class="fa fa-volume-off"></i>' : '<i class="fa fa-volume-up"></i>';
        }

        // ──────────────────────────────────────────────────────
        // RECORDING
        // ──────────────────────────────────────────────────────
        function startRecording() {
            if (state.isRecording) return;
            const stream = renderer.domElement.captureStream(30);
            state.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            state.recordedChunks = [];
            state.mediaRecorder.ondataavailable = (e) => state.recordedChunks.push(e.data);
            state.mediaRecorder.onstop = () => {
                const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `galaxy_${new Date().toISOString().slice(0,10)}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                state.isRecording = false;
                document.getElementById('recordBtn').innerHTML = '<i class="fa fa-video-camera"></i>';
                showToast('📹 Video exported!', 'success');
            };
            state.mediaRecorder.start(100);
            state.isRecording = true;
            document.getElementById('recordBtn').innerHTML = '<i class="fa fa-stop"></i>';
            startReplay();
        }

        function stopRecording() {
            if (state.mediaRecorder && state.isRecording) {
                state.mediaRecorder.stop();
                state.isRecording = false;
                document.getElementById('recordBtn').innerHTML = '<i class="fa fa-video-camera"></i>';
                stopReplay();
            }
        }

        // ──────────────────────────────────────────────────────
        // SIDE PANEL
        // ──────────────────────────────────────────────────────
        function openSidePanel(project) {
            const panel = document.getElementById('sidePanel');
            const content = document.getElementById('panelContent');

            const pct = project.totalHours > 0 ? Math.min(100, (project.totalHours / 400) * 100) : 0;
            const cats = project.categories.map(c =>
                `<span class="achievement-tag">${escapeHtml(c)}</span>`
            ).join('');

            // Generate "skills" from categories + primary
            const skills = [...project.categories];
            if (project.primaryCategory && !skills.includes(project.primaryCategory)) skills.push(project.primaryCategory);
            const skillTags = skills.slice(0, 6).map(s =>
                `<span class="skill-tag">${escapeHtml(s)}</span>`
            ).join('');

            // Related projects (same primary category)
            const related = state.projects
                .filter(p => p.id !== project.id && p.primaryCategory === project.primaryCategory)
                .slice(0, 4);

            content.innerHTML = `
                <div class="close-btn" id="closePanel">✕</div>
                <div style="display:flex;align-items:center;gap:16px;margin-bottom:4px;">
                    <div class="progress-ring" style="background:conic-gradient(#2fc7ff ${pct}%, rgba(255,255,255,0.06) ${pct}%);">
                        <div class="pct">${Math.round(pct)}%</div>
                    </div>
                    <div>
                        <h2 style="margin:0;">${escapeHtml(project.title)}</h2>
                        <div style="font-size:0.8rem;color:#5a7d9a;">${project.status} · ${project.count} entries</div>
                    </div>
                </div>

                <div class="detail-row"><span class="detail-label">⏱ Total Hours</span><span class="detail-value">${project.totalHours.toFixed(1)}</span></div>
                <div class="detail-row"><span class="detail-label">📋 Entries</span><span class="detail-value">${project.count}</span></div>
                <div class="detail-row"><span class="detail-label">📅 Started</span><span class="detail-value">${project.startDate || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">📅 Last Entry</span><span class="detail-value">${project.endDate || 'N/A'}</span></div>
                <div class="detail-row"><span class="detail-label">🏷️ Primary Category</span><span class="detail-value">${escapeHtml(project.primaryCategory)}</span></div>

                <div class="panel-section-title">📂 Categories</div>
                <div style="margin-bottom:8px;">${cats || '<span style="color:#5a7d9a;font-size:0.8rem;">None</span>'}</div>

                <div class="panel-section-title">🛠️ Skills</div>
                <div style="margin-bottom:8px;">${skillTags || '<span style="color:#5a7d9a;font-size:0.8rem;">None</span>'}</div>

                ${related.length ? `
                <div class="panel-section-title">🔗 Related Projects</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
                    ${related.map(p => `<span class="skill-tag" style="cursor:pointer;background:rgba(47,199,255,0.08);border-color:rgba(47,199,255,0.15);" data-id="${p.id}">${escapeHtml(p.title)}</span>`).join('')}
                </div>
                ` : ''}

                <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-sm btn-outline-light" onclick="window.location.href='timesheet.html'">
                        <i class="fa fa-clock-o"></i> Timesheet
                    </button>
                    <button class="btn btn-sm btn-outline-light" onclick="window.location.href='analytics.html'">
                        <i class="fa fa-bar-chart"></i> Analytics
                    </button>
                </div>
            `;

            panel.classList.add('open');

            // Related project click
            content.querySelectorAll('[data-id]').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const p = state.projects.find(pr => pr.id === id);
                    if (p) {
                        panel.classList.remove('open');
                        setTimeout(() => openSidePanel(p), 300);
                        // Fly camera to that project
                        const mesh = projectMeshes.find(m => m.userData && m.userData.id === id);
                        if (mesh) {
                            const pos = mesh.position.clone();
                            flyCameraTo(pos);
                        }
                    }
                });
            });

            // Close button
            document.getElementById('closePanel').addEventListener('click', () => {
                panel.classList.remove('open');
            });
        }

        // ── Fly camera to position ──
        function flyCameraTo(target, duration = 1200) {
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();
            const endTarget = target.clone();
            const endPos = target.clone().add(new THREE.Vector3(
                (Math.random() - 0.5) * 6,
                3 + Math.random() * 4,
                (Math.random() - 0.5) * 6
            ));
            const startTime = Date.now();

            function fly() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
                camera.position.lerpVectors(startPos, endPos, ease);
                controls.target.lerpVectors(startTarget, endTarget, ease);
                controls.update();
                if (t < 1) requestAnimationFrame(fly);
            }
            fly();
        }

        // ──────────────────────────────────────────────────────
        // UTILITY
        // ──────────────────────────────────────────────────────
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m);
        }

        function showToast(msg, type) {
            const container = document.getElementById('toastContainer');
            const id = 'toast-' + Date.now();
            const bg = type === 'success' ? 'rgba(40,167,69,0.15)' : (type === 'error' ? 'rgba(220,53,69,0.15)' : 'rgba(23,162,184,0.15)');
            const border = type === 'success' ? '#28a745' : (type === 'error' ? '#dc3545' : '#17a2b8');
            const html = `
                <div id="${id}" class="toast" role="alert" data-autohide="true" data-delay="3000" style="background:${bg};border-left:3px solid ${border};">
                    <div class="toast-body" style="color:#e0e8ee;font-size:0.85rem;">${msg}</div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            const el = document.getElementById(id);
            $(el).toast('show');
            el.addEventListener('hidden.bs.toast', () => el.remove());
        }

        // ──────────────────────────────────────────────────────
        // CLICK HANDLER (Raycaster)
        // ──────────────────────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const meshes = projectMeshes.filter(m => m.isMesh);
            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                const data = obj.userData;
                if (data && data.id) {
                    const project = state.projects.find(p => p.id === data.id);
                    if (project) {
                        openSidePanel(project);
                        // Fly camera to it
                        const pos = obj.position.clone();
                        flyCameraTo(pos);
                    }
                }
            }
        });

        // ──────────────────────────────────────────────────────
        // INIT
        // ──────────────────────────────────────────────────────
        async function init() {
            window.showLoading('Building your galaxy...');

            // Load data
            await loadData(true);

            // Set slider to max
            const slider = document.getElementById('timeSlider');
            slider.value = 100;
            document.getElementById('timeLabel').textContent = 'All';

            // Build initial galaxy
            buildGalaxyFromData(state.allDates.length - 1);

            // Check initial achievements
            checkAchievements(aggregateProjects(state.entries));

            // ── Controls events ──
            slider.addEventListener('input', () => {
                const val = parseInt(slider.value);
                const idx = Math.floor((val / 100) * (state.allDates.length - 1));
                document.getElementById('timeLabel').textContent = state.allDates[idx] || 'All';
                buildGalaxyFromData(idx);
                if (state.isReplaying) {
                    // If replaying, stop
                    stopReplay();
                }
            });

            document.getElementById('resetViewBtn').addEventListener('click', () => {
                camera.position.set(18, 10, 28);
                controls.target.set(0, 0, 0);
                controls.update();
            });

            document.getElementById('replayBtn').addEventListener('click', () => {
                if (state.isReplaying) {
                    stopReplay();
                } else {
                    startReplay();
                }
            });

            document.getElementById('recordBtn').addEventListener('click', () => {
                if (state.isRecording) {
                    stopRecording();
                } else {
                    startRecording();
                }
            });

            document.getElementById('muteBtn').addEventListener('click', toggleMute);

            document.getElementById('syncBtn').addEventListener('click', async () => {
                document.getElementById('syncStatus').textContent = '⏳ Syncing...';
                await loadData(true);
                buildGalaxyFromData(parseInt(slider.value) / 100 * (state.allDates.length - 1));
                checkAchievements(aggregateProjects(state.entries));
            });

            // Auto-rotate when idle
            let idleTimer = null;
            renderer.domElement.addEventListener('pointerdown', () => {
                controls.autoRotate = false;
                clearTimeout(idleTimer);
            });
            renderer.domElement.addEventListener('pointerup', () => {
                idleTimer = setTimeout(() => {
                    controls.autoRotate = true;
                }, 5000);
            });
            // Start auto-rotate after 5s
            setTimeout(() => { controls.autoRotate = true; }, 5000);

            window.updateUserFooter();
            window.hideLoading();

            // Animation loop
            function animateLoop() {
                requestAnimationFrame(animateLoop);

                // Update energy particles
                updateEnergyParticles(performance.now() / 1000);

                // Pulse core
                if (coreGlow) {
                    const pulse = 1 + Math.sin(performance.now() / 1500) * 0.05;
                    coreGlow.scale.set(pulse, pulse, pulse);
                    coreGlow.material.opacity = 0.4 + Math.sin(performance.now() / 2000) * 0.15;
                }

                // Rotate nebula clouds slowly
                nebulaClouds.forEach((cloud, i) => {
                    cloud.rotation.y += 0.0003 * (i % 3 + 1);
                });

                controls.update();
                composer.render();
            }
            animateLoop();

            // Resize handler
            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
                composer.setSize(w, h);
            });
        }

        // ── Start ──
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Expose for global use
        window.galaxy = { state, buildGalaxyFromData, openSidePanel, flyCameraTo };
    </script>
</body>
</html>
