        /* ── Dark cosmic theme (unchanged) ── */
        body {
            margin: 0;
            padding: 0;
            background: #070b0e;
            color: #e0e8ee;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        .navbar {
            background: rgba(7, 11, 14, 0.85) !important;

            border-bottom: 1px solid rgba(47, 199, 255, 0.15);

            z-index: 100;

        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(7, 11, 14, 0.8);

            padding: 16px 30px;
            border-radius: 60px;

            align-items: center;
            gap: 24px;

            justify-content: center;

        .controls label { font-size: 0.8rem; font-weight: 500; color: #8a9fb0; margin-right: 8px; }
        .controls input[type="range"] {
            width: 200px;
            height: 4px;
            -webkit-appearance: none;
            background: #1a3a44;
            border-radius: 2px;
            outline: none;

        .controls input[type="range"]::-webkit-slider-thumb {

        .controls .btn-primary { background: #2fc7ff; border: none; color: #070b0e; font-weight: 600; }

        .controls .btn-success { background: #28a745; border: none; }
        .controls .btn-sync { background: #6c757d; border: none; color: white; }
        .controls .btn-sync:hover { background: #5a6268; }
        #timeLabel { font-size: 0.8rem; color: #8a9fb0; min-width: 70px; text-align: center; }
        #syncStatus { font-size: 0.7rem; color: #8a9fb0; }

        .side-panel {
            position: fixed;
            top: 0;
            right: -480px;
            width: 420px;
            height: 100%;
            background: rgba(7, 11, 14, 0.95);
            backdrop-filter: blur(14px);
            border-left: 1px solid #2fc7ff;
            padding: 30px 24px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 200;
            box-shadow: -10px 0 40px rgba(0,0,0,0.8);
            color: #e0e8ee;
        }
        .side-panel.open { right: 0; }
        .side-panel .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.6rem;
            cursor: pointer;
            color: #8a9fb0;
            transition: color 0.2s;
        }
        .side-panel .close-btn:hover { color: #2fc7ff; }
        .side-panel h2 { font-weight: 700; color: #2fc7ff; margin-top: 10px; font-size: 1.8rem; }
        .side-panel .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .side-panel .detail-label { color: #8a9fb0; font-weight: 500; }
        .side-panel .detail-value { font-weight: 600; }
        .side-panel .achievement-tag {
            display: inline-block;
            background: rgba(47,199,255,0.15);
            color: #2fc7ff;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            margin: 4px 4px 0 0;
            border: 1px solid rgba(47,199,255,0.2);

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1050; }
        .toast { min-width: 250px; }

        .achievement-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(7, 11, 14, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #2fc7ff;
            border-radius: 24px;
            padding: 30px 50px;
            text-align: center;
            z-index: 300;
            animation: popIn 0.5s ease;
            box-shadow: 0 0 60px rgba(47,199,255,0.3);
            pointer-events: none;
        }
        .achievement-toast .icon { font-size: 4rem; margin-bottom: 10px; }
        .achievement-toast .title { font-size: 1.5rem; font-weight: 700; color: #2fc7ff; }
        .achievement-toast .desc { font-size: 1rem; color: #e0e8ee; margin-top: 6px; }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            80% { transform: translate(-50%, -50%) scale(1.05); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .controls { bottom: 16px; padding: 12px 20px; width: 90%; border-radius: 30px; flex-direction: column; gap: 12px; }
            .controls input[type="range"] { width: 100%; }
            .side-panel { width: 100%; right: -100%; }
        }
    </style>

    <!-- Toast & Achievement containers -->
    <div class="toast-container" id="toastContainer"></div>
    <div id="achievementContainer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;"></div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        (function() {
            'use strict';

            const user = window.SessionManager?.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html?redirect=constellation3d';
                return;
            }

            // ── State ──
            let timesheetEntries = [];
            let allDates = [];
            let currentTimeIndex = 0;
            let isReplaying = false;
            let isRecording = false;
            let mediaRecorder = null;
            let recordedChunks = [];
            let audioContext = null;
            let musicOscillator = null;
            let musicGain = null;
            let isMuted = false;
            let achievementUnlocked = [];

            // ── Three.js setup ──
            const container = document.getElementById('three-container');
            let scene, camera, renderer, controls;
            let projectMeshes = [];
            let linkLines = [];
            let particleSystem;
            let raycaster = new THREE.Raycaster();
            let mouse = new THREE.Vector2();

            function initScene() {
                const width = container.clientWidth;
                const height = container.clientHeight;

                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x070b0e);

                camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(20, 10, 30);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.autoRotate = false;
                controls.rotateSpeed = 0.5;
                controls.target.set(0, 0, 0);

                // Lights
                const ambient = new THREE.AmbientLight(0x404060);
                scene.add(ambient);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 10);
                scene.add(dirLight);
                const backLight = new THREE.DirectionalLight(0x2fc7ff, 0.3);
                backLight.position.set(-10, -5, -10);
                scene.add(backLight);

                createNebula();

                window.addEventListener('resize', onResize);
                animate();
            }

            function createNebula() {
                const count = 3000;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    const radius = 40 + Math.random() * 60;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6;
                    positions[i*3+2] = radius * Math.cos(phi);
                    const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.3, 0.8, 0.3 + Math.random() * 0.3);
                    colors[i*3] = c.r;
                    colors[i*3+1] = c.g;
                    colors[i*3+2] = c.b;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const material = new THREE.PointsMaterial({
                    size: 0.3,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                particleSystem = new THREE.Points(geometry, material);
                scene.add(particleSystem);
            }

            function onResize() {
                const width = container.clientWidth;
                const height = container.clientHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                if (particleSystem) {
                    particleSystem.rotation.y += 0.0003;
                }
                renderer.render(scene, camera);
            }

            // ── GitHub fetch ──
            async function fetchTimesheetFromGitHub() {
                const { owner, repo, branch, dataPath } = window.REPO_CONFIG;
                const encUser = encodeURIComponent(user.username);
                const path = `${dataPath}/users/${encUser}/timesheet.json`;
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;

                const resp = await fetch(url, {
                    headers: {
                        Authorization: `token ${user.pat}`,
                        Accept: 'application/vnd.github.v3+json'
                    }
                });

                if (!resp.ok) {
                    if (resp.status === 404) {
                        // No file – treat as empty
                        return [];
                    }
                    const error = await resp.json();
                    throw new Error(`GitHub error: ${error.message || resp.status}`);
                }

                const data = await resp.json();
                const content = atob(data.content.replace(/\n/g, ''));
                let parsed;
                try { parsed = JSON.parse(content); } catch(e) { parsed = []; }
                if (!Array.isArray(parsed)) parsed = [];
                // Save to localStorage as cache
                localStorage.setItem('timesheet_entries_cache', JSON.stringify({ entries: parsed, timestamp: Date.now() }));
                return parsed;
            }

            // ── Load data (from GitHub) ──
            async function loadTimesheetData(showLoading = true) {
                if (showLoading) window.showLoading('Fetching timesheet from GitHub...');
                try {
                    timesheetEntries = await fetchTimesheetFromGitHub();
                    // Update global for other pages
                    window.__timesheetEntries = timesheetEntries;
                    // Extract all dates
                    const dateSet = new Set();
                    timesheetEntries.forEach(e => { if (e.date) dateSet.add(e.date); });
                    allDates = Array.from(dateSet).sort();
                    if (allDates.length === 0) allDates = [new Date().toISOString().slice(0,10)];
                    document.getElementById('syncStatus').textContent = '✅ Synced';
                    document.getElementById('syncStatus').style.color = '#28a745';
                    return timesheetEntries;
                } catch (err) {
                    console.error(err);
                    // Fallback to localStorage
                    try {
                        const raw = localStorage.getItem('timesheet_entries_cache');
                        if (raw) {
                            const parsed = JSON.parse(raw);
                            if (parsed && Array.isArray(parsed.entries)) {
                                timesheetEntries = parsed.entries;
                                const dateSet = new Set();
                                timesheetEntries.forEach(e => { if (e.date) dateSet.add(e.date); });
                                allDates = Array.from(dateSet).sort();
                                if (allDates.length === 0) allDates = [new Date().toISOString().slice(0,10)];
                                document.getElementById('syncStatus').textContent = '⚠️ Offline (cached)';
                                document.getElementById('syncStatus').style.color = '#ffc107';
                                showToast('Using cached data – sync failed: ' + err.message, 'warning');
                                return timesheetEntries;
                            }
                        }
                    } catch(e2) {}
                    // If all fails, empty
                    timesheetEntries = [];
                    allDates = [new Date().toISOString().slice(0,10)];
                    document.getElementById('syncStatus').textContent = '❌ No data';
                    document.getElementById('syncStatus').style.color = '#dc3545';
                    showToast('Failed to load timesheet data', 'error');
                    return [];
                } finally {
                    if (showLoading) window.hideLoading();
                }
            }

            // ── Aggregate projects ──
            function aggregateProjects(entries) {
                const projectMap = new Map();
                entries.forEach(entry => {
                    const name = entry.project || 'Unnamed';
                    if (!projectMap.has(name)) {
                        projectMap.set(name, {
                            id: name,
                            title: name,
                            totalHours: 0,
                            count: 0,
                            categories: new Set(),
                            dates: []
                        });
                    }
                    const p = projectMap.get(name);
                    p.totalHours += parseFloat(entry.hours) || 0;
                    p.count++;
                    if (entry.category) p.categories.add(entry.category);
                    if (entry.date) p.dates.push(entry.date);
                });
                const projects = [];
                for (let [name, p] of projectMap) {
                    const categories = Array.from(p.categories);
                    const catCount = {};
                    categories.forEach(c => { catCount[c] = (catCount[c] || 0) + 1; });
                    const sortedCats = Object.entries(catCount).sort((a,b) => b[1] - a[1]);
                    const primaryCategory = sortedCats.length ? sortedCats[0][0] : 'N/A';
                    const dates = p.dates.sort();
                    const startDate = dates.length ? dates[0] : null;
                    const endDate = dates.length ? dates[dates.length-1] : null;
                    const lastEntry = endDate;
                    const isActive = lastEntry ? (new Date() - new Date(lastEntry) < 30 * 24 * 60 * 60 * 1000) : false;
                    const status = isActive ? 'Active' : 'Completed';
                    projects.push({
                        id: name,
                        title: name,
                        totalHours: p.totalHours,
                        count: p.count,
                        categories: categories,
                        primaryCategory: primaryCategory,
                        startDate: startDate,
                        endDate: endDate,
                        status: status,
                        photos: [],
                        achievements: []
                    });
                }
                projects.sort((a,b) => b.totalHours - a.totalHours);
                return projects;
            }

            // ── Build graph ──
            function buildGraph(projects, timeIndex) {
                const cutoffDate = allDates[Math.min(timeIndex, allDates.length-1)];
                const filtered = projects.filter(p => {
                    if (!p.startDate) return false;
                    return p.startDate <= cutoffDate;
                });

                const nodeCount = filtered.length;
                const positions = [];
                const radius = 15;
                const phi = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < nodeCount; i++) {
                    const y = 1 - (i / (nodeCount - 1)) * 2;
                    const r = Math.sqrt(1 - y*y);
                    const theta = phi * i;
                    const x = Math.cos(theta) * r;
                    const z = Math.sin(theta) * r;
                    positions.push({
                        x: x * radius,
                        y: y * radius * 0.7,
                        z: z * radius
                    });
                }
                const jitter = 1.5;
                positions.forEach(p => {
                    p.x += (Math.random() - 0.5) * jitter;
                    p.y += (Math.random() - 0.5) * jitter;
                    p.z += (Math.random() - 0.5) * jitter;
                });

                const nodes = filtered.map((p, i) => {
                    let color = 0x2fc7ff;
                    if (p.status === 'Completed') color = 0x28a745;
                    else if (p.status === 'Active') color = 0x2fc7ff;
                    return {
                        ...p,
                        pos: positions[i],
                        radius: Math.max(0.5, Math.sqrt(p.totalHours) * 0.4),
                        color: color
                    };
                });

                const links = [];
                const linkSet = new Set();
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i+1; j < nodes.length; j++) {
                        const a = nodes[i];
                        const b = nodes[j];
                        const share = a.categories.some(c => b.categories.includes(c));
                        if (share) {
                            const key = [a.id, b.id].sort().join('-');
                            if (!linkSet.has(key)) {
                                linkSet.add(key);
                                links.push({ source: a, target: b });
                            }
                        }
                    }
                }
                return { nodes, links };
            }

            // ── Render 3D ──
            function renderGraph(nodes, links) {
                projectMeshes.forEach(m => scene.remove(m));
                linkLines.forEach(l => scene.remove(l));
                projectMeshes = [];
                linkLines = [];

                const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
                nodes.forEach(node => {
                    const mat = new THREE.MeshStandardMaterial({
                        color: node.color,
                        emissive: node.color,
                        emissiveIntensity: 0.3,
                        roughness: 0.2,
                        metalness: 0.1
                    });
                    const mesh = new THREE.Mesh(sphereGeo, mat);
                    mesh.scale.set(node.radius, node.radius, node.radius);
                    mesh.position.set(node.pos.x, node.pos.y, node.pos.z);
                    mesh.userData = node;
                    scene.add(mesh);
                    projectMeshes.push(mesh);
                });

                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x2fc7ff,
                    transparent: true,
                    opacity: 0.3
                });
                links.forEach(link => {
                    const pts = [
                        new THREE.Vector3(link.source.pos.x, link.source.pos.y, link.source.pos.z),
                        new THREE.Vector3(link.target.pos.x, link.target.pos.y, link.target.pos.z)
                    ];
                    const geo = new THREE.BufferGeometry().setFromPoints(pts);
                    const line = new THREE.Line(geo, lineMat);
                    scene.add(line);
                    linkLines.push(line);
                });
            }

            // ── Update scene ──
            function updateScene() {
                const val = parseInt(timeSlider.value);
                const idx = Math.floor((val / 100) * (allDates.length - 1));
                currentTimeIndex = idx;
                timeLabel.textContent = idx < allDates.length ? allDates[idx] : 'All';
                const projects = aggregateProjects(timesheetEntries);
                const { nodes, links } = buildGraph(projects, idx);
                renderGraph(nodes, links);
            }

            // ── Replay ──
            let replayInterval = null;
            let replayIndex = 0;

            function startReplay() {
                if (isReplaying) return;
                isReplaying = true;
                replayIndex = 0;
                const steps = allDates.length;
                playMusic();
                achievementUnlocked = [];

                replayInterval = setInterval(() => {
                    if (replayIndex >= steps) {
                        clearInterval(replayInterval);
                        isReplaying = false;
                        stopMusic();
                        showToast('Replay complete! 🎉', 'success');
                        const projects = aggregateProjects(timesheetEntries);
                        checkAchievements(projects);
                        return;
                    }
                    const val = (replayIndex / steps) * 100;
                    timeSlider.value = val;
                    updateScene();
                    const projects = aggregateProjects(timesheetEntries);
                    const { nodes } = buildGraph(projects, replayIndex);
                    checkAchievements(nodes);
                    replayIndex++;
                }, 500);
            }

            // ── Achievements ──
            const milestones = [
                { id: 'first', condition: (nodes) => nodes.length >= 1, icon: '🌟', title: 'First Project', desc: 'You logged your first project!' },
                { id: 'ten', condition: (nodes) => nodes.length >= 10, icon: '🏆', title: '10 Projects', desc: 'Double digits – impressive!' },
                { id: 'hundred_hours', condition: (nodes) => nodes.reduce((s,n) => s + n.totalHours, 0) >= 100, icon: '⚡', title: '100 Hours', desc: 'Century mark reached!' },
                { id: 'five_hundred_hours', condition: (nodes) => nodes.reduce((s,n) => s + n.totalHours, 0) >= 500, icon: '🔥', title: '500 Hours', desc: 'Half a thousand – you’re on fire!' },
                { id: 'all_completed', condition: (nodes) => nodes.every(n => n.status === 'Completed'), icon: '🎯', title: 'All Completed', desc: 'Every project is finished – mission accomplished!' }
            ];

            function checkAchievements(nodes) {
                milestones.forEach(m => {
                    if (!achievementUnlocked.includes(m.id) && m.condition(nodes)) {
                        achievementUnlocked.push(m.id);
                        showAchievement(m.icon, m.title, m.desc);
                        showToast(m.icon + ' ' + m.title + ' unlocked!', 'success');
                    }
                });
            }

            function showAchievement(icon, title, desc) {
                const container = document.getElementById('achievementContainer');
                const el = document.createElement('div');
                el.className = 'achievement-toast';
                el.innerHTML = `
                    <div class="icon">${icon}</div>
                    <div class="title">${title}</div>
                    <div class="desc">${desc}</div>
                `;
                container.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }

            // ── Music ──
            function playMusic() {
                if (audioContext) return;
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                musicGain = audioContext.createGain();
                musicGain.gain.value = 0.15;
                musicGain.connect(audioContext.destination);

                const freqs = [220, 330, 440, 550];
                const oscillators = freqs.map(f => {
                    const osc = audioContext.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const gain = audioContext.createGain();
                    gain.gain.value = 0.08;
                    osc.connect(gain);
                    gain.connect(musicGain);
                    osc.start();
                    return osc;
                });
                musicOscillator = oscillators;
            }

            function stopMusic() {
                if (musicOscillator) {
                    musicOscillator.forEach(osc => { try { osc.stop(); } catch(e) {} });
                    musicOscillator = null;
                }
                if (audioContext) {
                    audioContext.close().catch(() => {});
                    audioContext = null;
                }
            }

            function toggleMute() {
                isMuted = !isMuted;
                if (musicGain) musicGain.gain.value = isMuted ? 0 : 0.15;
                document.getElementById('muteBtn').innerHTML = isMuted ? '<i class="fa fa-volume-off"></i>' : '<i class="fa fa-volume-up"></i>';
            }

            // ── Recording ──
            function startRecording() {
                if (isRecording) return;
                const stream = renderer.domElement.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `career_replay_${new Date().toISOString().slice(0,10)}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    isRecording = false;
                    document.getElementById('recordBtn').innerHTML = '<i class="fa fa-video-camera"></i> Record';
                    showToast('Video exported!', 'success');
                };
                mediaRecorder.start(100);
                isRecording = true;
                document.getElementById('recordBtn').innerHTML = '<i class="fa fa-stop"></i> Stop';
                startReplay();
            }

            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    document.getElementById('recordBtn').innerHTML = '<i class="fa fa-video-camera"></i> Record';
                }
            }

            // ── Toast ──
            function showToast(msg, type) {
                let container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.style.position = 'fixed';
                    container.style.bottom = '20px';
                    container.style.right = '20px';
                    container.style.zIndex = '1050';
                    document.body.appendChild(container);
                }
                const toastId = 'toast-' + Date.now();
                const bgClass = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-info');
                const html = `<div id="${toastId}" class="toast ${bgClass} text-white" role="alert" data-autohide="true" data-delay="3000"><div class="toast-body">${msg}</div></div>`;
                container.insertAdjacentHTML('beforeend', html);
                const toastEl = document.getElementById(toastId);
                $(toastEl).toast('show');
                toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
            }

            // ── Side Panel ──
            function openSidePanel(project) {
                const pct = project.totalHours > 0 ? Math.min(100, (project.totalHours / 400) * 100) : 0;
                const categoriesHtml = project.categories.length ?
                    project.categories.map(c => `<span class="achievement-tag">${escapeHtml(c)}</span>`).join('') :
                    '<span class="text-muted">None</span>';

                document.getElementById('panelContent').innerHTML = `
                    <div class="close-btn" id="closePanel">&times;</div>
                    <h2>${escapeHtml(project.title)}</h2>
                    <div style="display:flex; align-items:center; gap:16px; margin: 12px 0 20px;">
                        <div style="width:60px;height:60px;border-radius:50%;background:conic-gradient(#2fc7ff ${pct}%, #1a3a44 ${pct}%);position:relative;">
                            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:0.8rem;font-weight:700;color:white;">${Math.round(pct)}%</div>
                        </div>
                        <div>
                            <div style="font-size:0.9rem; color:#8a9fb0;">Completion</div>
                            <div style="font-weight:700;">${Math.round(pct)}%</div>
                        </div>
                    </div>
                    <div class="detail-row"><span class="detail-label">⏱ Total Hours</span><span class="detail-value">${project.totalHours.toFixed(1)}</span></div>
                    <div class="detail-row"><span class="detail-label">📋 Entries</span><span class="detail-value">${project.count}</span></div>
                    <div class="detail-row"><span class="detail-label">📅 First Entry</span><span class="detail-value">${project.startDate || 'N/A'}</span></div>
                    <div class="detail-row"><span class="detail-label">📅 Last Entry</span><span class="detail-value">${project.endDate || 'N/A'}</span></div>
                    <div class="detail-row"><span class="detail-label">⭐ Status</span><span class="detail-value" style="color:${project.status === 'Completed' ? '#28a745' : '#2fc7ff'};">${project.status}</span></div>
                    <div class="detail-row"><span class="detail-label">🏷️ Categories</span><span class="detail-value">${project.categories.join(', ') || 'None'}</span></div>
                    <div class="detail-row"><span class="detail-label">🔹 Primary Category</span><span class="detail-value">${project.primaryCategory}</span></div>

                    <div style="margin-top:20px;">
                        <div style="font-weight:600; color:#2fc7ff; margin-bottom:8px;">📂 Categories</div>
                        <div>${categoriesHtml}</div>
                    </div>

                    <div style="margin-top:24px;">
                        <button class="btn btn-sm btn-outline-info" onclick="window.location.href='timesheet.html'">
                            <i class="fa fa-clock-o"></i> Go to Timesheet
                        </button>
                    </div>
                `;

                document.getElementById('sidePanel').classList.add('open');
                document.getElementById('closePanel').addEventListener('click', function() {
                    document.getElementById('sidePanel').classList.remove('open');
                });
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m);
            }

            // ── Click handler ──
            function onCanvasClick(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(projectMeshes);
                if (intersects.length > 0) {
                    const mesh = intersects[0].object;
                    const projectData = mesh.userData;
                    if (projectData) openSidePanel(projectData);
                }
            }

            // ── Init ──
            async function init() {
                initScene();
                await loadTimesheetData(true);
                timeSlider.value = 100;
                updateScene();

                // Event listeners
                timeSlider.addEventListener('input', updateScene);
                document.getElementById('resetViewBtn').addEventListener('click', () => {
                    timeSlider.value = 100;
                    updateScene();
                    camera.position.set(20, 10, 30);
                    controls.target.set(0, 0, 0);
                    controls.update();
                });
                document.getElementById('replayBtn').addEventListener('click', startReplay);
                document.getElementById('recordBtn').addEventListener('click', function() {
                    if (isRecording) stopRecording();
                    else startRecording();
                });
                document.getElementById('muteBtn').addEventListener('click', toggleMute);
                document.getElementById('syncBtn').addEventListener('click', async () => {
                    document.getElementById('syncStatus').textContent = '⏳ Syncing...';
                    document.getElementById('syncStatus').style.color = '#ffc107';
                    await loadTimesheetData(true);
                    updateScene();
                });
                renderer.domElement.addEventListener('click', onCanvasClick);

                window.updateUserFooter();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
