<!DOCTYPE html>
<html>
<head>
  <title>Set your password | Your Portfolio</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="background:#eef3fc;">
<div class="container mt-5" style="max-width:480px;">
  <div class="card p-4">
    <h3>Set a new password</h3>
    <p class="text-muted">Choose a password you'll remember. This replaces your old passphrase.</p>
    <div class="form-group">
      <label>New password</label>
      <input type="password" id="pw" class="form-control" minlength="8">
    </div>
    <div class="form-group">
      <label>Confirm password</label>
      <input type="password" id="pw2" class="form-control" minlength="8">
    </div>
    <div id="msg" class="alert" style="display:none;"></div>
    <button id="go" class="btn btn-primary btn-block">Save password</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(async () => {
  // Supabase puts a session in the URL hash when the user arrives
  // from a reset email. Calling getSession() consumes it.
  const { data, error } = await window.supabase.auth.getSession();
  if (error || !data.session) {
    document.getElementById('msg').className = 'alert alert-danger';
    document.getElementById('msg').textContent =
      'Link is invalid or expired. Please request a new reset email.';
    document.getElementById('msg').style.display = 'block';
    document.getElementById('go').disabled = true;
  }
})();

document.getElementById('go').addEventListener('click', async () => {
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  const msg = document.getElementById('msg');
  msg.style.display = 'none';

  if (pw.length < 8) {
    msg.className = 'alert alert-danger';
    msg.textContent = 'Password must be at least 8 characters.';
    msg.style.display = 'block';
    return;
  }
  if (pw !== pw2) {
    msg.className = 'alert alert-danger';
    msg.textContent = 'Passwords do not match.';
    msg.style.display = 'block';
    return;
  }

  const { error } = await window.supabase.auth.updateUser({ password: pw });

  if (error) {
    msg.className = 'alert alert-danger';
    msg.textContent = error.message;
    msg.style.display = 'block';
    return;
  }

  msg.className = 'alert alert-success';
  msg.textContent = 'Password set! Redirecting to login…';
  msg.style.display = 'block';
  setTimeout(() => location.href = 'login.html', 1500);
});
</script>
</body>
</html>
