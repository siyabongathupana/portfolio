<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set your password | Your Portfolio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background:#eef3fc; font-family:'Inter',sans-serif; }
    .set-card { max-width:480px; margin:80px auto; background:#fff; border-radius:24px; padding:36px; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
    .set-card h3 { font-weight:700; color:#0b2b3b; margin-bottom:6px; }
    .set-card .sub { color:#5a7d9a; font-size:0.9rem; margin-bottom:22px; }
  </style>
</head>
<body>

<div class="set-card">
  <h3><i class="fa fa-lock" style="color:#2fc7ff;"></i> Set a new password</h3>
  <p class="sub">Your account and data are safe. Just pick a password you'll remember — this replaces your old passphrase.</p>

  <div id="msg" class="alert" style="display:none;"></div>

  <div class="form-group">
    <label>New password</label>
    <input type="password" id="pw" class="form-control" minlength="8" autocomplete="new-password">
    <small class="text-muted">At least 8 characters.</small>
  </div>
  <div class="form-group">
    <label>Confirm password</label>
    <input type="password" id="pw2" class="form-control" minlength="8" autocomplete="new-password">
  </div>
  <button id="go" class="btn btn-block" style="background:#2fc7ff;color:#0a2b33;font-weight:600;border-radius:40px;">
    <i class="fa fa-check"></i> Save password
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
(async () => {
  const ready = await window.authReady;
  if (!ready) {
    show('danger', 'This link is invalid or has expired. Please request a new reset email from the login page.');
    document.getElementById('go').disabled = true;
  }
})();

function show(type, text) {
  const m = document.getElementById('msg');
  m.className = 'alert alert-' + type;
  m.textContent = text;
  m.style.display = 'block';
}

document.getElementById('go').addEventListener('click', async () => {
  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  document.getElementById('msg').style.display = 'none';

  if (pw.length < 8) return show('danger', 'Password must be at least 8 characters.');
  if (pw !== pw2)    return show('danger', 'Passwords do not match.');

  const btn = document.getElementById('go');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving…';

  const { error } = await window.supabase.auth.updateUser({ password: pw });

  if (error) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-check"></i> Save password';
    return show('danger', error.message);
  }

  show('success', 'Password set! Redirecting to login…');
  setTimeout(() => location.href = 'login.html', 1400);
});
</script>
</body>
</html>
