<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard | Your Portfolio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme-dark.css" id="theme-dark-css">
  <script>
  (function(){
    try { if ((localStorage.getItem('site-theme') || 'dark') === 'light') window.__THEME_LIGHT__ = true; } catch(e) {}
  })();
  </script>
  <script>
  (function(){
    if (window.__THEME_LIGHT__) {
      var l = document.getElementById('theme-dark-css');
      if (l) l.disabled = true;
      document.documentElement.classList.add('theme-light');
    } else {
      document.documentElement.classList.add('theme-dark');
    }
  })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="shared.js"></script>
  <script src="auth.js"></script>
  <script src="messaging.js"></script>
  <style>
    .user-badge { background:#2fc7ff; color:white; padding:4px 12px; border-radius:20px; font-size:0.9rem; }
    .cert-thumb-preview { max-width:80px; max-height:80px; margin-top:8px; border-radius:12px; }
    .view-portfolio-btn { background: #28a745; color: white; border-radius: 20px; padding: 6px 16px; margin-right: 10px; transition: 0.2s; display: inline-flex; align-items:center; }
    .view-portfolio-btn:hover { background: #218838; color: white; text-decoration: none; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1050; }
    .toast { min-width: 250px; }
    .logs-panel { text-align: center; padding: 20px; }
    .logs-icon i { font-size: 3rem; color: #2fc7ff; }
    .btn-log { margin: 5px; }
    .empty-state { text-align:center; padding:60px 20px; color:#5a7d9a; }
    .empty-state i { font-size:3rem; margin-bottom:1rem; color:#ccc; }
  </style>
</head>
<body style="background:#eef3fc;">

<div id="dashboard" style="display:none;">
  <div class="container admin-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <h1><i class="fa fa-dashboard"></i> Your Portfolio Dashboard</h1>
      <div class="d-flex align-items-center flex-wrap">
        <span class="user-badge mr-3" id="currentUserDisplay"></span>
        <a href="index.html" class="btn view-portfolio-btn mr-2"><i class="fa fa-eye"></i> View Portfolio</a>
        <button class="btn btn-outline-danger btn-sm mr-2" id="logoutBtn"><i class="fa fa-sign-out"></i> Logout</button>
        <button class="btn btn-outline-success btn-sm" id="downloadDataBtn"><i class="fa fa-download"></i> Export</button>
      </div>
    </div>
    <hr>

    <ul class="nav nav-tabs" id="adminTabs">
      <li class="nav-item">
        <a class="nav-link" href="manage-projects.html"><i class="fa fa-cubes"></i> Projects</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" data-toggle="tab" href="#certificatesTab">Certificates</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="timesheet.html">Timesheet</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-toggle="tab" href="#logsTab">Logs</a>
      </li>
      <li class="nav-item" id="sendMsgTabNav" style="display:none;">
        <a class="nav-link" href="admin-messages.html">Send Message</a>
      </li>
      <li class="nav-item" id="usersTabNav" style="display:none;">
        <a class="nav-link" href="admin-users.html">Users</a>
      </li>
    </ul>

    <div class="tab-content mt-4">

      <div class="tab-pane fade show active" id="certificatesTab">
        <div class="mb-3 d-flex flex-wrap">
          <button class="btn btn-delta mr-2" id="addCertBtn"><i class="fa fa-plus"></i> Add Certificate</button>
          <button class="btn btn-outline-danger mr-2" id="deleteAllCertsBtn"><i class="fa fa-trash"></i> Delete All</button>
          <button class="btn btn-outline-info" id="syncCertsBtn"><i class="fa fa-refresh"></i> Refresh</button>
        </div>
        <div id="certificatesList"></div>
      </div>

      <div class="tab-pane fade" id="logsTab">
        <div class="logs-panel">
          <div class="logs-icon"><i class="fa fa-file-text-o"></i></div>
          <h4>Activity Logs</h4>
          <p class="lead-text">Download your complete activity log as a text file.</p>
          <div class="log-user-select" id="logUserSelectGroup" style="display:none;">
            <select id="logUserSelect" class="form-control form-control-sm" style="width:auto; display:inline-block;">
              <option value="">-- Select user to download logs --</option>
            </select>
          </div>
          <div class="d-flex flex-wrap justify-content-center mt-2">
            <button id="downloadMyLogBtn" class="btn btn-primary btn-log"><i class="fa fa-download"></i> Download My Logs</button>
            <button id="downloadAllLogsBtn" class="btn btn-secondary btn-log" style="display:none;"><i class="fa fa-archive"></i> Download All Logs (ZIP)</button>
          </div>
        </div>
      </div>

    </div>

    <hr>
    <div class="text-center footer-status">
      <span id="userFooterStatus"></span>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal fade" id="certModal" tabindex="-1">
  <div class="modal-dialog modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="certModalTitle">Certificate</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="certForm">
          <input type="hidden" id="certIndex">
          <div><label>Title *</label><input type="text" id="certTitle" class="form-control" required></div>
          <div class="mt-2"><label>Issuer</label><input type="text" id="certIssuer" class="form-control"></div>
          <div class="mt-2"><label>Date (YYYY-MM)</label><input type="text" id="certDate" class="form-control" placeholder="2024-01"></div>
          <div class="mt-2"><label>PDF / Google Drive Link</label><input type="url" id="certLink" class="form-control" placeholder="https://drive.google.com/file/d/.../preview"></div>
          <div class="mt-2">
            <label>Thumbnail Image</label>
            <div class="input-group">
              <input type="url" id="certThumb" class="form-control" placeholder="https://... or upload image">
              <div class="input-group-append">
                <label class="btn btn-outline-secondary mb-0" for="certThumbFile"><i class="fa fa-folder-open"></i> Upload</label>
                <input type="file" id="certThumbFile" accept="image/*" style="display:none">
              </div>
            </div>
            <img id="thumbPreview" class="cert-thumb-preview" style="display:none;">
          </div>
          <button type="submit" class="btn btn-delta mt-3">Save Certificate</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
(async function () {
  'use strict';

  const authUser = await window.authReady;
  if (!authUser) { window.location.href = 'login.html'; return; }

  const user = window.SessionManager.getCurrentUser();
  const isAdmin = window.SessionManager.isAdmin();

  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('currentUserDisplay').textContent = user.email;
  window.updateUserFooter();
  window.showLoading('Loading your dashboard...');

  if (isAdmin) {
    document.getElementById('usersTabNav').style.display = 'block';
    document.getElementById('sendMsgTabNav').style.display = 'block';
    document.getElementById('downloadAllLogsBtn').style.display = 'inline-block';
    document.getElementById('logUserSelectGroup').style.display = 'block';
    populateUserSelect();
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toastId = 'toast-' + Date.now();
    const bgClass = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-info');
    const html = `<div id="${toastId}" class="toast ${bgClass} text-white" role="alert" data-autohide="true" data-delay="3000"><div class="toast-body">${window.escapeHtml(message)}</div></div>`;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(toastId);
    $(toastEl).toast('show');
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
  }

  // ═══ Certificate thumbnail upload ═══
  document.getElementById('certThumbFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const url = await window.uploadImage(file, 'cert-thumbnails');
      document.getElementById('certThumb').value = url;
      const preview = document.getElementById('thumbPreview');
      preview.src = url;
      preview.style.display = 'inline-block';
      showToast('Thumbnail uploaded', 'success');
    } catch (err) {
      showToast('Thumb upload failed: ' + err.message, 'error');
    }
  });

  document.getElementById('certThumb').addEventListener('input', e => {
    const preview = document.getElementById('thumbPreview');
    if (e.target.value) { preview.src = e.target.value; preview.style.display = 'inline-block'; }
    else preview.style.display = 'none';
  });

  // ═══ Certificates list ═══
  async function renderCertificates() {
    try {
      const certs = await window.portfolioData.loadCertificates();
      const container = document.getElementById('certificatesList');
      container.innerHTML = '';
      if (!certs.length) {
        container.innerHTML = '<div class="empty-state"><i class="fa fa-certificate"></i><h5>No certificates added</h5><p>Click "Add Certificate" to create one.</p></div>';
        return;
      }
      certs.forEach((cert, idx) => {
        const card = document.createElement('div');
        card.className = 'card mb-2';
        card.innerHTML = `
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap">
            <div><strong>${window.escapeHtml(cert.title)}</strong> — ${window.escapeHtml(cert.issuer || '')} ${cert.date ? '(' + cert.date + ')' : ''}</div>
            <div>
              <button class="btn btn-sm btn-outline-primary edit-cert" data-index="${idx}">Edit</button>
              <button class="btn btn-sm btn-outline-danger delete-cert" data-index="${idx}">Delete</button>
            </div>
          </div>`;
        container.appendChild(card);
      });

      container.querySelectorAll('.edit-cert').forEach(btn =>
        btn.addEventListener('click', () => openCertModal(parseInt(btn.dataset.index))));
      container.querySelectorAll('.delete-cert').forEach(btn =>
        btn.addEventListener('click', () => deleteCertificate(parseInt(btn.dataset.index))));
    } catch (err) {
      console.error(err);
      showToast('Error loading certificates: ' + err.message, 'error');
    }
  }

  async function deleteCertificate(idx) {
    if (!confirm('Delete this certificate?')) return;
    window.showLoading('Deleting...');
    try {
      const certs = await window.portfolioData.loadCertificates();
      const cert = certs[idx];
      if (!cert) return;
      if (cert.thumbnail) {
        try { await window.deleteImage(cert.thumbnail); } catch (e) { console.warn(e); }
      }
      certs.splice(idx, 1);
      await window.portfolioData.saveCertificates(certs);
      await renderCertificates();
      window.Logger.logActivity('certificate', 'delete', `Deleted certificate: ${cert.title}`);
      showToast('Certificate deleted', 'success');
    } catch (err) {
      showToast('Delete failed: ' + err.message, 'error');
    } finally {
      window.hideLoading();
    }
  }

  async function openCertModal(index = null) {
    const certs = await window.portfolioData.loadCertificates();
    const isEdit = index !== null && certs[index];
    document.getElementById('certModalTitle').innerText = isEdit ? 'Edit Certificate' : 'New Certificate';
    if (isEdit) {
      const c = certs[index];
      document.getElementById('certIndex').value = index;
      document.getElementById('certTitle').value = c.title;
      document.getElementById('certIssuer').value = c.issuer || '';
      document.getElementById('certDate').value = c.date || '';
      document.getElementById('certLink').value = c.link || '';
      document.getElementById('certThumb').value = c.thumbnail || '';
      const preview = document.getElementById('thumbPreview');
      if (preview) {
        preview.src = c.thumbnail || '';
        preview.style.display = c.thumbnail ? 'inline-block' : 'none';
      }
    } else {
      document.getElementById('certIndex').value = '';
      ['certTitle','certIssuer','certDate','certLink','certThumb'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('thumbPreview').style.display = 'none';
    }
    $('#certModal').modal('show');
  }

  document.getElementById('certForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    window.showLoading('Saving...');
    try {
      const certs = await window.portfolioData.loadCertificates();
      const idx = document.getElementById('certIndex').value;
      const newCert = {
        id: (idx !== '' && certs[idx]) ? certs[idx].id : ('cert_' + Date.now()),
        title: document.getElementById('certTitle').value,
        issuer: document.getElementById('certIssuer').value,
        date: document.getElementById('certDate').value,
        link: document.getElementById('certLink').value,
        thumbnail: document.getElementById('certThumb').value,
        isPublic: true
      };
      if (idx !== '' && certs[idx]) certs[idx] = newCert;
      else certs.push(newCert);
      await window.portfolioData.saveCertificates(certs);
      $('#certModal').modal('hide');
      await renderCertificates();
      showToast('Certificate saved', 'success');
    } catch (err) {
      showToast('Save failed: ' + err.message, 'error');
    } finally {
      window.hideLoading();
    }
  });

  // ═══ Buttons ═══
  document.getElementById('addCertBtn').addEventListener('click', () => openCertModal());
  document.getElementById('downloadDataBtn').addEventListener('click', () => window.portfolioData.exportData());

  document.getElementById('deleteAllCertsBtn').addEventListener('click', async () => {
    if (!confirm('PERMANENTLY delete ALL certificates? This cannot be undone.')) return;
    window.showLoading('Deleting all...');
    try {
      const certs = await window.portfolioData.loadCertificates();
      for (const cert of certs) {
        if (cert.thumbnail) { try { await window.deleteImage(cert.thumbnail); } catch (e) { console.warn(e); } }
      }
      await window.portfolioData.saveCertificates([]);
      await renderCertificates();
      window.Logger.logActivity('certificate', 'delete_all', 'Deleted all certificates');
      showToast('All certificates deleted', 'success');
    } catch (err) {
      showToast('Failed: ' + err.message, 'error');
    } finally {
      window.hideLoading();
    }
  });

  document.getElementById('syncCertsBtn').addEventListener('click', async () => {
    window.showLoading('Refreshing...');
    await renderCertificates();
    window.hideLoading();
    showToast('Certificates refreshed', 'success');
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await window.Logger.logActivity('account', 'logout', 'User logged out');
    await window.SessionManager.logout();
    window.location.href = 'login.html';
  });

  // ═══ Logs ═══
  async function downloadLogsForUser(username, isAdminView = false) {
    window.showLoading(`Fetching logs for ${username}...`);
    try {
      let logs;
      if (isAdminView) {
        // Admin viewing another user's logs — get their user_id first
        const { data: profile } = await window.supabase
          .from('profiles').select('id').eq('email', username).maybeSingle();
        if (!profile) { showToast('User not found', 'error'); return; }
        logs = await window.Logger.getLogsForUser(profile.id);
      } else {
        logs = await window.Logger.getLogsForUser(user.id);
      }
      const blob = new Blob([logs], { type: 'text/plain' });
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `logs_${username}_${new Date().toISOString().slice(0,19)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Logs downloaded', 'success');
    } catch (err) {
      showToast(`Failed: ${err.message}`, 'error');
    } finally {
      window.hideLoading();
    }
  }

  async function downloadAllLogs() {
    if (!isAdmin) { showToast('Only admin can do this.', 'error'); return; }
    window.showLoading('Fetching all user logs...');
    try {
      const allLogs = await window.Logger.getAllUserLogs();
      const zip = new JSZip();
      let fileCount = 0;
      for (const [email, logs] of Object.entries(allLogs)) {
        if (logs && logs.trim()) { zip.file(`${email}_activity.txt`, logs); fileCount++; }
      }
      if (fileCount === 0) { showToast('No logs found.', 'error'); return; }
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `all_logs_${new Date().toISOString().slice(0,19)}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded logs for ${fileCount} users`, 'success');
    } catch (err) {
      showToast(`Failed: ${err.message}`, 'error');
    } finally {
      window.hideLoading();
    }
  }

  async function populateUserSelect() {
    try {
      const users = await window.AccountManager.listUsers();
      const select = document.getElementById('logUserSelect');
      if (!select) return;
      select.innerHTML = '<option value="">-- Select user to download logs --</option>';
      for (const u of users) {
        select.innerHTML += `<option value="${window.escapeHtml(u.email)}">${window.escapeHtml(u.email)}</option>`;
      }
    } catch (err) {
      console.error('Populate user select failed:', err);
    }
  }

  document.getElementById('downloadMyLogBtn').addEventListener('click', () =>
    downloadLogsForUser(user.email, false));

  document.getElementById('logUserSelect').addEventListener('change', async (e) => {
    const selected = e.target.value;
    if (selected && isAdmin && selected !== user.email) {
      await downloadLogsForUser(selected, true);
      e.target.value = '';
    }
  });

  document.getElementById('downloadAllLogsBtn').addEventListener('click', downloadAllLogs);

  // Initial render
  await renderCertificates();
  window.hideLoading();
})();
</script>
<script src="theme-toggle.js"></script>
</body>
</html>
