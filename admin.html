<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard | Your Portfolio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="config.js"></script>
  <script src="crypto.js"></script>
  <script src="api.js"></script>
  <script src="shared.js"></script>
  <style>
    .user-badge { background:#2fc7ff; color:white; padding:4px 12px; border-radius:20px; font-size:0.9rem; }
    .cert-thumb-preview { max-width:80px; max-height:80px; margin-top:8px; border-radius:12px; }
    .view-portfolio-btn { background: #28a745; color: white; border-radius: 20px; padding: 6px 16px; margin-right: 10px; transition: 0.2s; display: inline-flex; align-items:center; }
    .view-portfolio-btn:hover { background: #218838; color: white; text-decoration: none; }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1050; }
    .toast { min-width: 250px; }
    .logs-panel { text-align: center; padding: 20px; }
    .logs-icon i { font-size: 3rem; color: #2fc7ff; }
    .btn-log { margin: 5px; }
    .empty-state { text-align:center; padding:60px 20px; color:#5a7d9a; }
    .empty-state i { font-size:3rem; margin-bottom:1rem; color:#ccc; }
  </style>
</head>
<body style="background:#eef3fc;">

<div id="dashboard" style="display:none;">
  <div class="container admin-container">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <h1><i class="fa fa-dashboard"></i> Your Portfolio Dashboard</h1>
      <div class="d-flex align-items-center flex-wrap">
        <span class="user-badge mr-3" id="currentUserDisplay"></span>
        <a href="index.html" class="btn view-portfolio-btn mr-2"><i class="fa fa-eye"></i> View Portfolio</a>
        <button class="btn btn-outline-danger btn-sm mr-2" id="logoutBtn"><i class="fa fa-sign-out"></i> Logout</button>
        <button class="btn btn-outline-success btn-sm" id="downloadDataBtn"><i class="fa fa-download"></i> Export</button>
      </div>
    </div>
    <hr>

    <ul class="nav nav-tabs" id="adminTabs">
      <li class="nav-item">
        <a class="nav-link" href="manage-projects.html"><i class="fa fa-cubes"></i> Projects</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" data-toggle="tab" href="#certificatesTab">Certificates</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="timesheet.html">Timesheet</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-toggle="tab" href="#logsTab">Logs</a>
      </li>
      <li class="nav-item" id="sendMsgTabNav" style="display:none;">
        <a class="nav-link" href="admin-messages.html">Send Message</a>
      </li>
      <li class="nav-item" id="usersTabNav" style="display:none;">
        <a class="nav-link" data-toggle="tab" href="#usersTab">Users</a>
      </li>
    </ul>

    <div class="tab-content mt-4">

      <div class="tab-pane fade show active" id="certificatesTab">
        <div class="mb-3 d-flex flex-wrap">
          <button class="btn btn-delta mr-2" id="addCertBtn"><i class="fa fa-plus"></i> Add Certificate</button>
          <button class="btn btn-outline-danger mr-2" id="deleteAllCertsBtn"><i class="fa fa-trash"></i> Delete All</button>
          <button class="btn btn-outline-info" id="syncCertsBtn"><i class="fa fa-refresh"></i> Refresh</button>
        </div>
        <div id="certificatesList"></div>
      </div>

      <div class="tab-pane fade" id="logsTab">
        <div class="logs-panel">
          <div class="logs-icon"><i class="fa fa-file-text-o"></i></div>
          <h4>Activity Logs</h4>
          <p class="lead-text">Download your complete activity log as a text file.</p>
          <div class="log-user-select" id="logUserSelectGroup" style="display:none;">
            <select id="logUserSelect" class="form-control form-control-sm" style="width:auto; display:inline-block;">
              <option value="">-- Select user to download logs --</option>
            </select>
          </div>
          <div class="d-flex flex-wrap justify-content-center mt-2">
            <button id="downloadMyLogBtn" class="btn btn-primary btn-log"><i class="fa fa-download"></i> Download My Logs</button>
            <button id="downloadAllLogsBtn" class="btn btn-secondary btn-log" style="display:none;"><i class="fa fa-archive"></i> Download All Logs (ZIP)</button>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="usersTab">
        <div class="mb-3 d-flex align-items-center flex-wrap">
          <button class="btn btn-delta mr-2" id="refreshUsersBtn"><i class="fa fa-refresh"></i> Refresh List</button>
          <span class="text-muted">Blocked users cannot log in. Deleting a user permanently removes all their data.</span>
        </div>
        <div id="usersList"></div>
      </div>

    </div>

    <hr>
    <div class="text-center footer-status">
      <span id="userFooterStatus"></span>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal fade" id="certModal" tabindex="-1">
  <div class="modal-dialog modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="certModalTitle">Certificate</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="certForm">
          <input type="hidden" id="certIndex">
          <div><label>Title *</label><input type="text" id="certTitle" class="form-control" required></div>
          <div class="mt-2"><label>Issuer</label><input type="text" id="certIssuer" class="form-control"></div>
          <div class="mt-2"><label>Date (YYYY-MM)</label><input type="text" id="certDate" class="form-control" placeholder="2024-01"></div>
          <div class="mt-2"><label>PDF / Google Drive Link</label><input type="url" id="certLink" class="form-control" placeholder="https://drive.google.com/file/d/.../preview"></div>
          <div class="mt-2">
            <label>Thumbnail Image</label>
            <div class="input-group">
              <input type="url" id="certThumb" class="form-control" placeholder="https://... or upload image">
              <div class="input-group-append">
                <label class="btn btn-outline-secondary mb-0" for="certThumbFile"><i class="fa fa-folder-open"></i> Upload</label>
                <input type="file" id="certThumbFile" accept="image/*" style="display:none">
              </div>
            </div>
            <img id="thumbPreview" class="cert-thumb-preview" style="display:none;">
          </div>
          <button type="submit" class="btn btn-delta mt-3">Save Certificate</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="messaging.js"></script>

<script>
  const user = window.SessionManager?.getCurrentUser();
  if (!user) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('currentUserDisplay').textContent = user.username;
    window.updateUserFooter();
    window.showLoading('Loading your dashboard...');
    initDashboard();
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toastId = 'toast-' + Date.now();
    const bgClass = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-info');
    const html = `<div id="${toastId}" class="toast ${bgClass} text-white" role="alert" data-autohide="true" data-delay="3000"><div class="toast-body">${message}</div></div>`;
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(toastId);
    $(toastEl).toast('show');
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
  }

  async function initDashboard() {
    const isAdmin = window.APP_CONFIG.adminUsers && window.APP_CONFIG.adminUsers.includes(user.username);

    document.getElementById('certThumbFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const url = await window.uploadImageToGitHub(file, user, 'cert_thumbnails');
        document.getElementById('certThumb').value = url;
        const preview = document.getElementById('thumbPreview');
        preview.src = url;
        preview.style.display = 'inline-block';
        window.Logger.log('cert_thumb_upload', `Uploaded certificate thumbnail`);
        showToast('Thumbnail uploaded', 'success');
      } catch (err) {
        showToast('Thumb upload failed: ' + err.message, 'error');
      }
    });

    async function renderCertificates() {
      try {
        const certs = await window.portfolioData.loadCertificates();
        const container = document.getElementById('certificatesList');
        if (!container) return;
        container.innerHTML = '';
        if (certs.length === 0) {
          container.innerHTML = '<div class="empty-state"><i class="fa fa-certificate"></i><h5>No certificates added</h5><p>Click "Add Certificate" to create one.</p></div>';
          return;
        }
        certs.forEach((cert, idx) => {
          const card = document.createElement('div');
          card.className = 'card mb-2';
          card.innerHTML = `
            <div class="card-body d-flex justify-content-between align-items-center flex-wrap">
              <div><strong>${window.escapeHtml(cert.title)}</strong> - ${window.escapeHtml(cert.issuer)} (${cert.date})</div>
              <div>
                <button class="btn btn-sm btn-outline-primary edit-cert" data-index="${idx}">Edit</button>
                <button class="btn btn-sm btn-outline-danger delete-cert" data-index="${idx}">Delete</button>
              </div>
            </div>`;
          container.appendChild(card);
        });

        document.querySelectorAll('.edit-cert').forEach(btn => {
          btn.addEventListener('click', () => openCertModal(parseInt(btn.dataset.index)));
        });
        document.querySelectorAll('.delete-cert').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm('Delete this certificate?')) await safeDeleteCertificate(parseInt(btn.dataset.index));
          });
        });
      } catch (err) {
        console.error('Error rendering certificates:', err);
        showToast('Error loading certificates: ' + err.message, 'error');
      }
    }

    async function safeDeleteCertificate(idx) {
      window.showLoading('Deleting certificate...');
      try {
        const certs = await window.portfolioData.loadCertificates();
        if (!certs[idx]) { window.hideLoading(); return; }
        const thumb = certs[idx].thumbnail;
        if (thumb && thumb.startsWith('https://raw.githubusercontent.com')) {
          try { await window.deleteImageFromGitHub(thumb, user); } catch(e) { console.warn(e); }
        }
        const certTitle = certs[idx].title;
        certs.splice(idx, 1);
        const isEmpty = certs.length === 0;
        await window.portfolioData.saveCertificates(certs, isEmpty);
        await renderCertificates();
        window.Logger.logActivity('certificate', 'delete', `Deleted certificate: ${certTitle}`);
        showToast(`Certificate "${certTitle}" deleted`, 'success');
      } catch (err) {
        showToast('Delete failed: ' + err.message, 'error');
      } finally {
        window.hideLoading();
      }
    }

    async function safeSaveCertificate(certs) {
      window.showLoading('Saving certificate...');
      try {
        await window.portfolioData.saveCertificates(certs);
        await renderCertificates();
        $('#certModal').modal('hide');
        window.Logger.logActivity('certificate', 'save', `Saved certificates`);
        showToast('Certificate saved', 'success');
      } catch (err) {
        showToast('Save failed: ' + err.message, 'error');
      } finally {
        window.hideLoading();
      }
    }

    async function openCertModal(index = null) {
      const certs = await window.portfolioData.loadCertificates();
      const isEdit = index !== null && certs[index];
      document.getElementById('certModalTitle').innerText = isEdit ? 'Edit Certificate' : 'New Certificate';
      if (isEdit) {
        const cert = certs[index];
        document.getElementById('certIndex').value = index;
        document.getElementById('certTitle').value = cert.title;
        document.getElementById('certIssuer').value = cert.issuer;
        document.getElementById('certDate').value = cert.date;
        document.getElementById('certLink').value = cert.link || '';
        document.getElementById('certThumb').value = cert.thumbnail || '';
        const preview = document.getElementById('thumbPreview');
        if (preview) {
          preview.src = cert.thumbnail || '';
          preview.style.display = cert.thumbnail ? 'inline-block' : 'none';
        }
      } else {
        document.getElementById('certIndex').value = '';
        document.getElementById('certTitle').value = '';
        document.getElementById('certIssuer').value = '';
        document.getElementById('certDate').value = '';
        document.getElementById('certLink').value = '';
        document.getElementById('certThumb').value = '';
        const preview = document.getElementById('thumbPreview');
        if (preview) preview.style.display = 'none';
      }
      $('#certModal').modal('show');
    }

    document.getElementById('certForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const certs = await window.portfolioData.loadCertificates();
      const idx = document.getElementById('certIndex').value;
      const newCert = {
        id: (idx !== '' && certs[idx]) ? certs[idx].id : ('cert_' + Date.now()),
        title: document.getElementById('certTitle').value,
        issuer: document.getElementById('certIssuer').value,
        date: document.getElementById('certDate').value,
        link: document.getElementById('certLink').value,
        thumbnail: document.getElementById('certThumb').value,
        updatedAt: Date.now()
      };
      if (idx !== '' && certs[idx]) certs[idx] = newCert;
      else certs.push(newCert);
      await safeSaveCertificate(certs);
    });

    if (isAdmin) {
      const usersTabNav = document.getElementById('usersTabNav');
      if (usersTabNav) usersTabNav.style.display = 'block';
      const sendMsgTabNav = document.getElementById('sendMsgTabNav');
      if (sendMsgTabNav) sendMsgTabNav.style.display = 'block';
      const refreshUsersBtn = document.getElementById('refreshUsersBtn');
      if (refreshUsersBtn) refreshUsersBtn.addEventListener('click', loadUsers);
      const downloadAllLogsBtn = document.getElementById('downloadAllLogsBtn');
      if (downloadAllLogsBtn) downloadAllLogsBtn.style.display = 'inline-block';
      const logUserSelectGroup = document.getElementById('logUserSelectGroup');
      if (logUserSelectGroup) logUserSelectGroup.style.display = 'block';
      loadUsers();
    }

    async function downloadLogsForUser(username, isAdminView = false) {
      window.showLoading(`Fetching logs for ${username}...`);
      try {
        let logs;
        if (isAdminView && username !== user.username) {
          logs = await window.Logger.getLogsForUser(username, user.pat);
        } else {
          logs = await window.Logger.getLogsForUser(user.username, user.pat);
        }
        const blob = new Blob([logs], { type: 'text/plain' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = `logs_${username}_${new Date().toISOString().slice(0,19)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        window.Logger.logActivity('logs', 'download', `Downloaded logs for ${username}`);
        showToast('Logs downloaded', 'success');
      } catch (err) {
        showToast(`Failed to download logs: ${err.message}`, 'error');
      } finally {
        window.hideLoading();
      }
    }

    async function downloadAllLogs() {
      if (!isAdmin) { showToast('Only admin can download all logs.', 'error'); return; }
      window.showLoading('Fetching all user logs...');
      try {
        const users = await window.AccountManager.listUsers(user.pat);
        const zip = new JSZip();
        let fileCount = 0;
        for (const u of users) {
          const logs = await window.Logger.getLogsForUser(u, user.pat);
          if (logs && logs !== 'No logs found for this user.' && logs !== 'Unable to retrieve logs.') {
            zip.file(`${u}_activity.txt`, logs);
            fileCount++;
          }
        }
        if (fileCount === 0) {
          showToast('No logs found for any user.', 'error');
        } else {
          const blob = await zip.generateAsync({ type: 'blob' });
          const a = document.createElement('a');
          const url = URL.createObjectURL(blob);
          a.href = url;
          a.download = `all_logs_${new Date().toISOString().slice(0,19)}.zip`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          window.Logger.logActivity('logs', 'download_all', `Downloaded ZIP of all users' logs (${fileCount} users)`);
          showToast('All logs downloaded', 'success');
        }
      } catch (err) {
        showToast(`Failed to download all logs: ${err.message}`, 'error');
      } finally {
        window.hideLoading();
      }
    }

    async function populateUserSelect() {
      if (!isAdmin) return;
      try {
        const users = await window.AccountManager.listUsers(user.pat);
        const select = document.getElementById('logUserSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Select user to download logs --</option>';
        for (const u of users) {
          select.innerHTML += `<option value="${u}">${u}</option>`;
        }
      } catch (err) {
        console.error('Failed to load user list for logs', err);
      }
    }

    const downloadMyLogBtn = document.getElementById('downloadMyLogBtn');
    if (downloadMyLogBtn) downloadMyLogBtn.addEventListener('click', async () => await downloadLogsForUser(user.username, false));

    const logUserSelect = document.getElementById('logUserSelect');
    if (logUserSelect) {
      logUserSelect.addEventListener('change', async (e) => {
        const selected = e.target.value;
        if (selected && isAdmin) {
          await downloadLogsForUser(selected, true);
          e.target.value = '';
        }
      });
    }

    const downloadAllLogsBtn = document.getElementById('downloadAllLogsBtn');
    if (downloadAllLogsBtn) downloadAllLogsBtn.addEventListener('click', downloadAllLogs);
    await populateUserSelect();

    async function loadUsers() {
      window.showLoading('Loading users...');
      const container = document.getElementById('usersList');
      if (!container) return;
      try {
        const usernames = await window.AccountManager.listUsers(user.pat);
        const blocked = await window.AccountManager.getBlockedUsers();
        container.innerHTML = '';
        if (usernames.length === 0) {
          container.innerHTML = '<div class="empty-state"><i class="fa fa-users"></i><h5>No registered users yet.</h5></div>';
        } else {
          for (const username of usernames) {
            const isBlocked = blocked.includes(username);
            let stats = { projects: 0, certificates: 0 };
            try { stats = await window.AccountManager.getUserStats(username, user.pat); } catch(e) {}
            const card = document.createElement('div');
            card.className = 'card mb-2';
            card.innerHTML = `
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                  <div>
                    <strong>${window.escapeHtml(username)}</strong>
                    ${isBlocked ? '<span class="badge badge-danger ml-2">Blocked</span>' : '<span class="badge badge-success ml-2">Active</span>'}
                    <div class="small text-muted">Projects: ${stats.projects} | Certificates: ${stats.certificates}</div>
                  </div>
                  <div class="mt-2 mt-sm-0">
                    <button class="btn btn-sm ${isBlocked ? 'btn-success' : 'btn-warning'} toggle-block-btn" data-username="${username}">${isBlocked ? 'Unblock' : 'Block'}</button>
                    <button class="btn btn-sm btn-danger delete-user-btn" data-username="${username}">Delete</button>
                  </div>
                </div>
              </div>`;
            container.appendChild(card);
          }
          document.querySelectorAll('.toggle-block-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const username = btn.dataset.username;
              const block = !blocked.includes(username);
              if (!confirm(`${block ? 'Block' : 'Unblock'} "${username}"?`)) return;
              window.showLoading('Updating...');
              try {
                await window.AccountManager.toggleBlock(username, block, user.pat);
                await loadUsers();
                showToast(`User ${block ? 'blocked' : 'unblocked'}`, 'success');
              } catch(err) { showToast('Failed: ' + err.message, 'error'); }
              window.hideLoading();
            });
          });
          document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const username = btn.dataset.username;
              if (!confirm(`Delete all data for "${username}"? This cannot be undone.`)) return;
              window.showLoading('Deleting user...');
              try {
                await window.AccountManager.deleteUser(username, user.pat);
                await loadUsers();
                showToast(`User ${username} deleted`, 'success');
              } catch(err) { showToast('Failed: ' + err.message, 'error'); }
              window.hideLoading();
            });
          });
        }
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Unable to load users: ${err.message}</div>`;
      } finally {
        window.hideLoading();
      }
    }

    const addCertBtn = document.getElementById('addCertBtn');
    if (addCertBtn) addCertBtn.addEventListener('click', () => openCertModal());

    const downloadDataBtn = document.getElementById('downloadDataBtn');
    if (downloadDataBtn) downloadDataBtn.addEventListener('click', () => window.portfolioData.exportData());

    const deleteAllCertsBtn = document.getElementById('deleteAllCertsBtn');
    if (deleteAllCertsBtn) {
      deleteAllCertsBtn.addEventListener('click', async () => {
        if (confirm('PERMANENTLY delete ALL certificates? This action cannot be undone.')) {
          window.showLoading('Deleting all certificates...');
          try {
            const certs = await window.portfolioData.loadCertificates();
            for (const cert of certs) {
              if (cert.thumbnail && cert.thumbnail.startsWith('https://raw.githubusercontent.com')) {
                try { await window.deleteImageFromGitHub(cert.thumbnail, user); } catch(e) { console.warn(e); }
              }
            }
            await window.portfolioData.saveCertificates([], true);
            await renderCertificates();
            window.Logger.logActivity('certificate', 'delete_all', 'Deleted all certificates');
            showToast('All certificates deleted', 'success');
          } catch (err) { showToast('Failed: ' + err.message, 'error'); }
          window.hideLoading();
        }
      });
    }

    const syncCertsBtn = document.getElementById('syncCertsBtn');
    if (syncCertsBtn) {
      syncCertsBtn.addEventListener('click', async () => {
        window.showLoading('Refreshing from GitHub...');
        await renderCertificates();
        window.hideLoading();
        showToast('Certificates refreshed', 'success');
        window.Logger.logActivity('data', 'sync', 'Manually synced certificates from GitHub');
      });
    }

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        window.Logger.logActivity('account', 'logout', 'User logged out');
        window.SessionManager.logout();
        window.location.href = 'login.html';
      });
    }

    setInterval(async () => {
      if (!document.hidden) {
        await renderCertificates();
      }
    }, 60000);

    await renderCertificates();
    window.hideLoading();
  }
</script>
</body>
</html>
