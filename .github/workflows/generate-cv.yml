name: Generate CV PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'data/users/siyabongatshem@gmail.com/projects.json'
      - 'data/users/siyabongatshem@gmail.com/certificates.json'
      - 'scripts/generate_cv.py'
      - 'templates/cv_template.html'
  workflow_dispatch:  # allow manual run

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jinja2 weasyprint

      - name: Generate CV
        run: python scripts/generate_cv.py

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update CV from latest portfolio data"
          git push
