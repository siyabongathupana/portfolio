name: Backup (every 8h, keep 5 releases)

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create backup archive (plain)
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "BACKUP_TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          
          mkdir -p backup_temp/data
          cp -r data/* backup_temp/data/ 2>/dev/null || true
          cp config.js backup_temp/ 2>/dev/null || true
          
          USER_COUNT=$(ls -1 data/users/ 2>/dev/null | wc -l)
          
          cat > backup_temp/backup_info.json << EOF
          {
            "timestamp": "$TIMESTAMP",
            "date": "$(date -Iseconds)",
            "users_count": $USER_COUNT,
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF
          
          tar -czf "backup_${TIMESTAMP}.tar.gz" -C backup_temp .
          rm -rf backup_temp

      - name: Encrypt the backup archive
        run: |
          echo "${{ secrets.BACKUP_PASSWORD }}" > pass.txt
          openssl enc -aes-256-cbc -salt -in "backup_${BACKUP_TIMESTAMP}.tar.gz" \
            -out "backup_${BACKUP_TIMESTAMP}.tar.gz.enc" -pass file:pass.txt
          rm -f pass.txt
          rm -f "backup_${BACKUP_TIMESTAMP}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: backup-${{ env.BACKUP_TIMESTAMP }}
          name: "📦 Backup ${{ env.BACKUP_TIMESTAMP }}"
          body: "🔐 Automated encrypted backup"   # No decryption instructions
          files: backup_*.tar.gz.enc
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the 5 most recent releases
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | .[:-5] | .[].tagName' | while read tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
