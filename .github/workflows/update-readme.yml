name: Update README with Portfolio Data

on:
  push:
    branches:
      - main
    paths:
      - 'data/users/**/projects.json'
      - 'data/users/**/certificates.json'
      - 'data/users/**/timesheet.json'
      - 'data/users/**/logs/*.ndjson'
      - 'scripts/generate_readme.py'
      - 'templates/readme_template.md'
  schedule:
    # Run daily at 00:00 UTC to refresh stats
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pyyaml jinja2 requests python-dateutil
          
      - name: Generate README
        run: |
          python scripts/generate_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet README.md || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🤖 Auto-update README with latest portfolio data [skip ci]"
          git push
