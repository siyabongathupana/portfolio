name: Update README with Portfolio Data

on:
  push:
    branches:
      - main
    paths:
      - 'data/users/**/projects.json'
      - 'data/users/**/certificates.json'
      - 'data/users/**/timesheet.json'
      - '.github/scripts/generate_readme.py'
      - 'templates/readme_template.md'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install jinja2 requests
          
      - name: Debug - List files
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of root:"
          ls -la
          echo "Contents of .github/scripts:"
          ls -la .github/scripts/ || echo ".github/scripts folder not found"
          echo "Contents of templates:"
          ls -la templates/ || echo "templates folder not found"
          
      - name: Generate README
        run: python .github/scripts/generate_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # Only commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update README with latest portfolio data [skip ci]"
          # Pull latest changes (rebase to avoid conflicts) and push
          git pull --rebase origin main
          git push origin main
