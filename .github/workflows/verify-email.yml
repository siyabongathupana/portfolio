name: Email Verification

on:
  push:
    paths:
      - 'data/users/*/account.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-new-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install nodemailer

      - name: Process email verification
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://siyabongathupana.github.io/portfolio' }}
        run: node .github/scripts/emailVerification.js

      - name: Commit updated verification status
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/pending_verification.json data/verified_users.json
          git commit -m "Update email verification status" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME:-main}
