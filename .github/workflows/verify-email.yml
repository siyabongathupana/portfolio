name: Email Verification

on:
  push:
    paths:
      - 'data/users/*/account.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-new-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install nodemailer

      - name: Run email verification script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://siyabongathupana.github.io/portfolio' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/emailVerification.js

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes
          git pull origin main --rebase || true
          
          # Check for changes
          if git diff --quiet data/pending_verification.json data/verified_users.json; then
            echo "No changes to commit"
          else
            git add data/pending_verification.json data/verified_users.json
            git commit -m "Update verification status [skip ci]"
            git push origin main
          fi
