<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Project Map | Your Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Bootstrap & Font Awesome (for UI) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />

    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="api.js"></script>
    <script src="shared.js"></script>

    <style>
        body {
            background: #eef3fc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar (reuse styles) */
        .custom-nav-container {
            background: #0b2b3b;
            padding: 12px 0;
        }
        .navbar-brand span { color: #2fc7ff; }
        .nav-link { color: rgba(255,255,255,0.85) !important; }
        .nav-link:hover { color: #2fc7ff !important; }

        /* Main layout: sidebar + map */
        .map-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .map-sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e2e8f0;
            padding: 20px 16px;
            overflow-y: auto;
            flex-shrink: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.03);
            z-index: 10;
        }
        .map-sidebar h5 {
            font-weight: 700;
            color: #0b2b3b;
            margin-bottom: 16px;
            border-bottom: 2px solid #2fc7ff;
            padding-bottom: 10px;
        }
        .project-list-item {
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            background: #f8fafc;
            border-left: 4px solid #2fc7ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-list-item:hover {
            background: #e6f7ff;
            transform: translateX(4px);
        }
        .project-list-item .proj-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .project-list-item .proj-hours {
            font-size: 0.8rem;
            color: #5a7d9a;
            background: #e9ecef;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .project-list-item .proj-location {
            font-size: 0.7rem;
            color: #8a9fb0;
            margin-top: 2px;
        }

        /* Map container */
        #map {
            flex: 1;
            height: 100%;
            background: #eef3fc;
        }

        /* Popup custom styling */
        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            min-width: 200px;
        }
        .leaflet-popup-content h4 {
            font-weight: 700;
            color: #0b2b3b;
            margin: 0 0 4px 0;
        }
        .leaflet-popup-content .popup-detail {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 2px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .leaflet-popup-content .popup-detail:last-child {
            border-bottom: none;
        }
        .leaflet-popup-content .popup-label {
            color: #5a7d9a;
        }
        .leaflet-popup-content .popup-value {
            font-weight: 600;
            color: #0b2b3b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .map-sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }
            .map-wrapper {
                flex-direction: column;
            }
            #map {
                height: calc(100vh - 200px - 56px); /* adjust for navbar */
            }
        }

        /* Toast container */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
        }
        .toast { min-width: 250px; }
    </style>
</head>
<body>

    <!-- ─── NAV ─── -->
    <nav class="navbar navbar-expand-lg custom_nav-container">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span>Your</span> Portfolio</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMap">
                <span class="fa fa-bars text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMap">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="certificates.html">Certificates</a></li>
                    <li class="nav-item"><a class="nav-link" href="timesheet.html">Timesheet</a></li>
                    <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
                    <li class="nav-item active"><a class="nav-link" href="map.html"><i class="fa fa-map-marker"></i> Map</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Manage</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ─── MAP WRAPPER ─── -->
    <div class="map-wrapper">
        <!-- Sidebar -->
        <div class="map-sidebar" id="sidebar">
            <h5><i class="fa fa-globe"></i> Projects</h5>
            <div id="projectList">
                <div class="text-muted text-center py-3">Loading projects...</div>
            </div>
            <div class="mt-3 small text-muted">
                <i class="fa fa-info-circle"></i> Click a project to zoom in
            </div>
        </div>

        <!-- Map -->
        <div id="map"></div>
    </div>

    <!-- ─── FOOTER (optional) ─── -->
    <footer style="background:#0b2b3b; color:#bdd3e0; text-align:center; padding:10px; margin-top:0;">
        <p class="footer-status"><span id="footerStatus"></span></p>
    </footer>

    <!-- ─── TOAST CONTAINER ─── -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ─── SCRIPTS ─── -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        (function() {
            'use strict';

            const user = window.SessionManager?.getCurrentUser();
            if (!user) {
                window.location.href = 'login.html?redirect=map';
                return;
            }

            // ── Data stores ──
            let projects = {};        // from portfolio
            let timesheetEntries = []; // from timesheet
            let projectData = [];     // aggregated for map

            // ── Coordinates for known clients ──
            const locationMap = {
                'Sasol': { lat: -26.2485, lng: 28.0763, city: 'Secunda, SA' },
                'Omnia': { lat: -26.1447, lng: 28.2248, city: 'Johannesburg, SA' },
                'Eskom': { lat: -26.2041, lng: 28.0473, city: 'Johannesburg, SA' },
                'MIBK': { lat: 40.7128, lng: -74.0060, city: 'New York, USA' }, // placeholder
                'Default': { lat: 0, lng: 0, city: 'Unknown' }
            };

            function getLocationForProject(projectName) {
                // Try to match client name or project title
                const lower = projectName.toLowerCase();
                for (const [key, loc] of Object.entries(locationMap)) {
                    if (lower.includes(key.toLowerCase())) {
                        return loc;
                    }
                }
                // Fallback: use a random location? Better to use default (0,0) or center of map
                return locationMap['Default'];
            }

            // ── Load data ──
            async function loadData() {
                try {
                    // Load projects from portfolio
                    const projData = await window.portfolioData.loadProjectsForView();
                    projects = projData;

                    // Load timesheet entries from global or localStorage
                    if (window.__timesheetEntries && Array.isArray(window.__timesheetEntries)) {
                        timesheetEntries = window.__timesheetEntries;
                    } else {
                        // Try localStorage
                        const raw = localStorage.getItem('timesheet_entries_cache');
                        if (raw) {
                            const parsed = JSON.parse(raw);
                            if (parsed && Array.isArray(parsed.entries)) {
                                timesheetEntries = parsed.entries;
                            }
                        }
                    }

                    // Aggregate: for each project in portfolio, get total hours, count, role from project metadata
                    const aggregated = {};
                    for (const [id, proj] of Object.entries(projects)) {
                        const title = proj.title || 'Unnamed';
                        // Sum hours from timesheet entries that match this project (by title)
                        const entries = timesheetEntries.filter(e => e.project && e.project.toLowerCase() === title.toLowerCase());
                        const totalHours = entries.reduce((sum, e) => sum + (parseFloat(e.hours) || 0), 0);
                        const count = entries.length;
                        // Get role from project (userRole) or from first entry's category?
                        const role = proj.userRole || (entries.length > 0 ? entries[0].category : 'N/A');
                        const status = proj.status || 'N/A';
                        const client = proj.client || title;
                        // Location
                        const loc = getLocationForProject(title);
                        aggregated[id] = {
                            id,
                            title,
                            client,
                            totalHours,
                            count,
                            role,
                            status,
                            lat: loc.lat,
                            lng: loc.lng,
                            city: loc.city,
                            proj
                        };
                    }

                    // Also include projects from timesheet that are not in portfolio? (optional)
                    // We'll only include those in portfolio for now.

                    projectData = Object.values(aggregated);
                    // Sort by total hours descending
                    projectData.sort((a, b) => b.totalHours - a.totalHours);

                    return projectData;
                } catch (err) {
                    console.error('Error loading data:', err);
                    showToast('Failed to load data: ' + err.message, 'error');
                    return [];
                }
            }

            // ── Render map ──
            let map = null;
            let markers = [];

            function renderMap(data) {
                if (!data.length) {
                    document.getElementById('projectList').innerHTML = `
                        <div class="text-muted text-center py-3">No projects with location data.</div>
                    `;
                    // Still show a world map with a default view
                    if (!map) {
                        map = L.map('map').setView([20, 0], 2);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors'
                        }).addTo(map);
                    }
                    return;
                }

                // Initialize map if not already
                if (!map) {
                    map = L.map('map').setView([20, 0], 2);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                }

                // Clear old markers
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                // Add markers for each project
                data.forEach(proj => {
                    if (proj.lat === 0 && proj.lng === 0) {
                        // Skip if no location (use a fallback)
                        return;
                    }
                    const marker = L.marker([proj.lat, proj.lng], {
                        title: proj.title
                    }).addTo(map);

                    // Popup content
                    const popupContent = `
                        <div>
                            <h4>${escapeHtml(proj.title)}</h4>
                            <div class="popup-detail">
                                <span class="popup-label">Client</span>
                                <span class="popup-value">${escapeHtml(proj.client)}</span>
                            </div>
                            <div class="popup-detail">
                                <span class="popup-label">Total Hours</span>
                                <span class="popup-value">${proj.totalHours.toFixed(1)}</span>
                            </div>
                            <div class="popup-detail">
                                <span class="popup-label">Entries</span>
                                <span class="popup-value">${proj.count}</span>
                            </div>
                            <div class="popup-detail">
                                <span class="popup-label">Role</span>
                                <span class="popup-value">${escapeHtml(proj.role)}</span>
                            </div>
                            <div class="popup-detail">
                                <span class="popup-label">Status</span>
                                <span class="popup-value">${escapeHtml(proj.status)}</span>
                            </div>
                            <div class="popup-detail">
                                <span class="popup-label">Location</span>
                                <span class="popup-value">${escapeHtml(proj.city)}</span>
                            </div>
                        </div>
                    `;
                    marker.bindPopup(popupContent);

                    // Store reference to project data
                    marker._projectData = proj;

                    // On click, zoom to marker
                    marker.on('click', function() {
                        map.flyTo(this.getLatLng(), 10, { duration: 1.5 });
                    });

                    markers.push(marker);
                });

                // If we have markers, fit bounds
                if (markers.length) {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds().pad(0.2));
                }

                // Update sidebar list
                updateSidebar(data);
            }

            function updateSidebar(data) {
                const container = document.getElementById('projectList');
                if (!data.length) {
                    container.innerHTML = `<div class="text-muted text-center py-3">No projects.</div>`;
                    return;
                }
                let html = '';
                data.forEach(proj => {
                    html += `
                        <div class="project-list-item" data-id="${proj.id}">
                            <div>
                                <div class="proj-name">${escapeHtml(proj.title)}</div>
                                <div class="proj-location"><i class="fa fa-map-marker"></i> ${escapeHtml(proj.city)}</div>
                            </div>
                            <div class="proj-hours">${proj.totalHours.toFixed(1)}h</div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                // Add click listeners to zoom to marker
                container.querySelectorAll('.project-list-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const proj = data.find(p => p.id === id);
                        if (!proj) return;
                        // Find marker for this project
                        const marker = markers.find(m => m._projectData && m._projectData.id === id);
                        if (marker) {
                            map.flyTo(marker.getLatLng(), 10, { duration: 1.5 });
                            marker.openPopup();
                        }
                    });
                });
            }

            // ── Toast helper ──
            function showToast(msg, type) {
                let container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    container.style.position = 'fixed';
                    container.style.bottom = '20px';
                    container.style.right = '20px';
                    container.style.zIndex = '1050';
                    document.body.appendChild(container);
                }
                const toastId = 'toast-' + Date.now();
                const bgClass = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-info');
                const html = `<div id="${toastId}" class="toast ${bgClass} text-white" role="alert" data-autohide="true" data-delay="3000"><div class="toast-body">${msg}</div></div>`;
                container.insertAdjacentHTML('beforeend', html);
                const toastEl = document.getElementById(toastId);
                $(toastEl).toast('show');
                toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m);
            }

            // ── Init ──
            async function init() {
                window.showLoading('Loading map data...');
                try {
                    const data = await loadData();
                    renderMap(data);
                    window.updateUserFooter();
                    document.getElementById('footerStatus').innerHTML = document.getElementById('userFooterStatus')?.innerHTML || '';
                } catch (err) {
                    console.error(err);
                    showToast('Error loading map: ' + err.message, 'error');
                } finally {
                    window.hideLoading();
                }
            }

            // ── Listen for timesheet updates ──
            document.addEventListener('timesheetUpdated', async () => {
                // Reload data and update map
                const data = await loadData();
                renderMap(data);
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
