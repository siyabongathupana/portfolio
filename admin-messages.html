<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Messaging | Your Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="shared.js"></script>
    <script src="auth.js"></script>
    <style>
        .admin-msg-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .user-selector {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            background: #f8fafc;
        }
        .user-checkbox {
            margin-right: 10px;
        }
        .select-all-row {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .progress-status {
            font-size: 0.9rem;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2fc7ff;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body style="background:#eef3fc;">

<nav class="navbar navbar-expand-lg custom_nav-container pt-3" style="background:#0b2b3b; padding:15px 0;">
    <div class="container">
        <a class="navbar-brand" href="index.html"><span>Your</span> Portfolio</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMsg">
            <span class="fa fa-bars text-white"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMsg">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="admin.html"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                <li class="nav-item active"><a class="nav-link" href="admin-messages.html"><i class="fa fa-envelope"></i> Send Message</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html">View Site</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container admin-msg-container">
    <h2><i class="fa fa-paper-plane"></i> Send Message to Users</h2>
    <p class="text-muted">Compose a message and send it to all users or selected individuals.</p>

    <div class="info-box">
        <i class="fa fa-info-circle"></i> <strong>How it works:</strong> Messages are saved to the Supabase database and appear in the recipient's inbox bell.
    </div>

    <form id="sendMessageForm">
        <div class="form-group">
            <label><input type="radio" name="recipientType" value="all" checked> All Users</label>
            <label class="ml-3"><input type="radio" name="recipientType" value="selected"> Selected Users</label>
        </div>

        <div id="selectedUsersContainer" style="display: none;">
            <label>Select Users:</label>
            <div class="user-selector" id="usersListContainer">
                <div class="select-all-row">
                    <label><input type="checkbox" id="selectAllUsers"> Select All</label>
                </div>
                <div id="userCheckboxes"></div>
            </div>
        </div>

        <div class="form-group mt-3">
            <label>Subject</label>
            <input type="text" id="msgSubject" class="form-control" placeholder="Message subject" required>
        </div>

        <div class="form-group">
            <label>Message Body</label>
            <textarea id="msgBody" rows="6" class="form-control" placeholder="Write your message here..." required></textarea>
        </div>

        <div id="progressStatus" class="progress-status mt-2"></div>

        <button type="submit" class="btn btn-delta btn-block"><i class="fa fa-send"></i> Send Message</button>
    </form>
    <div class="mt-4 text-center">
        <a href="admin.html" class="btn btn-outline-secondary">← Back to Dashboard</a>
    </div>
</div>

<footer class="mt-5">
    <p>© 2026 Your Portfolio</p>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    (async function() {
        const authUser = await window.authReady;
        if (!authUser) { window.location.href = 'login.html?redirect=admin-messages'; return; }

        const user = window.SessionManager.getCurrentUser();
        const isAdmin = window.SessionManager.isAdmin();
        if (!isAdmin) {
            document.body.innerHTML = '<div class="container text-center mt-5"><h3>Access Denied</h3><p>Admin privileges required.</p><a href="index.html" class="btn btn-delta">Go Home</a></div>';
            return;
        }

        let allUsers = [];
        let bannedEmails = [];

        async function loadUsers() {
            try {
                const profiles = await window.AccountManager.listUsers();
                bannedEmails = profiles.filter(p => p.banned).map(p => p.email);
                allUsers = profiles.filter(p => !p.banned && p.email !== user.email).map(p => p.email);

                const container = document.getElementById('userCheckboxes');
                container.innerHTML = '';
                if (!allUsers.length) {
                    container.innerHTML = '<div class="text-muted">No other active users found.</div>';
                    return;
                }
                for (const u of allUsers) {
                    const div = document.createElement('div');
                    div.className = 'form-check';
                    const safeId = 'u_' + u.replace(/[^a-z0-9]/gi, '_');
                    div.innerHTML = `
                        <input type="checkbox" class="form-check-input user-checkbox" value="${u.replace(/"/g, '&quot;')}" id="${safeId}">
                        <label class="form-check-label" for="${safeId}">${window.escapeHtml(u)}</label>
                    `;
                    container.appendChild(div);
                }
                document.getElementById('selectAllUsers').addEventListener('change', (e) => {
                    document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = e.target.checked);
                });
            } catch(err) {
                console.error(err);
                document.getElementById('userCheckboxes').innerHTML = '<div class="alert alert-danger">Failed to load users.</div>';
            }
        }

        function getSelectedUsers() {
            const recipientType = document.querySelector('input[name="recipientType"]:checked').value;
            if (recipientType === 'all') return allUsers;
            const selected = [];
            document.querySelectorAll('.user-checkbox:checked').forEach(cb => selected.push(cb.value));
            return selected;
        }

        async function sendToUser(email, messageObj) {
            await window.Messages.send({
                recipientEmail: email,
                subject: messageObj.subject,
                body: messageObj.body
            });
        }

        async function sendBulkMessages(recipients, messageObj, onProgress) {
            const results = { success: [], fail: [] };
            let index = 0;
            const concurrency = 5;

            async function worker() {
                while (index < recipients.length) {
                    const i = index++;
                    const email = recipients[i];
                    try {
                        await sendToUser(email, messageObj);
                        results.success.push(email);
                    } catch (err) {
                        console.error(`Failed for ${email}`, err);
                        results.fail.push(email);
                    }
                    if (onProgress) onProgress(results.success.length, results.fail.length, recipients.length);
                }
            }
            await Promise.all(Array(concurrency).fill().map(() => worker()));
            return results;
        }

        document.getElementById('sendMessageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const subject = document.getElementById('msgSubject').value.trim();
            const body = document.getElementById('msgBody').value.trim();
            if (!subject || !body) { alert("Please fill subject and body."); return; }
            const recipients = getSelectedUsers();
            if (!recipients.length) { alert("No users selected."); return; }
            if (!confirm(`Send message to ${recipients.length} user(s)?`)) return;

            const progressDiv = document.getElementById('progressStatus');
            progressDiv.innerHTML = `<div class="alert alert-info">Sending to ${recipients.length} users...</div>`;

            const updateProgress = (sent, failed, total) => {
                progressDiv.innerHTML = `<div class="alert alert-info">Sent: ${sent}, Failed: ${failed}, Remaining: ${total - sent - failed}</div>`;
            };

            try {
                const results = await sendBulkMessages(recipients, { subject, body }, updateProgress);
                if (results.fail.length === 0) {
                    progressDiv.innerHTML = `<div class="alert alert-success">✅ Message sent to ${results.success.length} user(s).</div>`;
                    document.getElementById('msgSubject').value = '';
                    document.getElementById('msgBody').value = '';
                    await window.Logger.logActivity('admin', 'send_message', `Sent "${subject}" to ${results.success.length} users`);
                } else {
                    progressDiv.innerHTML = `<div class="alert alert-warning">⚠️ Sent to ${results.success.length}, failed for ${results.fail.length}.</div>`;
                }
            } catch (err) {
                progressDiv.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
            }
            setTimeout(() => { progressDiv.innerHTML = ''; }, 8000);
        });

        document.querySelectorAll('input[name="recipientType"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const showSelected = document.querySelector('input[name="recipientType"]:checked').value === 'selected';
                document.getElementById('selectedUsersContainer').style.display = showSelected ? 'block' : 'none';
            });
        });

        loadUsers();
    })();
</script>
</body>
</html>
