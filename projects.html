<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Projects | Your Portfolio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="crypto.js"></script>
  <script src="api.js"></script>
  <script src="shared.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .project-type-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      z-index: 1;
    }
    .badge-deltaV {
      background: #0b2b3b;
      color: #2fc7ff;
    }
    .badge-general {
      background: #2fc7ff;
      color: #0b2b3b;
    }
    .project-card {
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 8px;
    }
    .status-completed { background: #28a745; color: white; }
    .status-ongoing { background: #2fc7ff; color: white; }
    .status-paused { background: #ffc107; color: #333; }
    .status-planned { background: #6c757d; color: white; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom_nav-container pt-3" style="background:#0b2b3b; padding:15px 0;">
  <div class="container"><a class="navbar-brand" href="index.html"><span>Your</span> Portfolio</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navAll"><span class="fa fa-bars text-white"></span></button>
    <div class="collapse navbar-collapse" id="navAll">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item active"><a class="nav-link" href="projects.html">All Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="certificates.html">Certificates</a></li>
        <li class="nav-item"><a class="nav-link" href="timesheet.html">Timesheet</a></li>
        <li class="nav-item"><a class="nav-link" href="lifeos.html">Smart Life OS</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Manage</a></li>
        <li class="nav-item">
          <button class="btn theme-toggle ml-2" id="themeToggleBtn" aria-label="Toggle dark/light mode">
            <i class="fa fa-moon-o"></i> <span id="themeToggleText">Dark</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center mb-5">
    <h2>All <span style="color:#2fc7ff;">Your</span> Projects</h2>
    <p id="projectsSubtext">Complete portfolio of all your projects</p>
  </div>
  <div class="row" id="allProjectsGrid"></div>
  <div id="noProjectsMsg" class="empty-state" style="display: none;">
    <i class="fa fa-folder-open-o"></i>
    <h4>No projects found</h4>
    <p>Add your first project in the <a href="admin.html">Admin Panel</a>.</p>
  </div>
</div>

<footer>
  <p>© 2026 Engineering Portfolio</p>
  <p class="footer-status"><span id="userFooterStatus"></span></p>
</footer>

<script>
  function getStatusBadgeClass(status) {
    switch(status) {
      case 'Completed': return 'status-completed';
      case 'Ongoing': return 'status-ongoing';
      case 'Paused': return 'status-paused';
      default: return 'status-planned';
    }
  }

  function getProjectTypeBadge(project) {
    const isDeltaV = project.projectCategory === 'deltaV' || project.controllerType;
    if (isDeltaV) {
      return '<span class="project-type-badge badge-deltaV"><i class="fa fa-microchip"></i> DeltaV</span>';
    }
    return '<span class="project-type-badge badge-general"><i class="fa fa-code"></i> General</span>';
  }

  function renderAllProjects() {
    window.showLoading('Loading all projects...');
    window.portfolioData.loadProjectsForView().then(data => {
      const projects = Object.values(data);
      const grid = document.getElementById('allProjectsGrid');
      const noMsg = document.getElementById('noProjectsMsg');
      const subtext = document.getElementById('projectsSubtext');
      const user = window.SessionManager.getCurrentUser();
      
      if (user) {
        subtext.innerHTML = `Showing YOUR projects (${projects.length} total) | <a href="admin.html" style="color:#2fc7ff;">Add more</a>`;
      } else {
        subtext.innerHTML = 'Complete portfolio of automation & control projects';
      }

      if (projects.length === 0) {
        grid.innerHTML = '';
        noMsg.style.display = 'block';
        window.hideLoading();
        return;
      }
      noMsg.style.display = 'none';
      grid.innerHTML = '';

      projects.forEach(proj => {
        const isDeltaV = proj.projectCategory === 'deltaV' || proj.controllerType;
        const firstImg = (proj.selectedImages && proj.selectedImages[0])?.url || 'https://picsum.photos/id/40/400/200';
        const statusClass = getStatusBadgeClass(proj.status);
        const statusText = proj.status || 'Planned';
        const projectTypeBadge = getProjectTypeBadge(proj);
        
        // Determine display text based on project type
        let techInfo = '';
        if (isDeltaV) {
          techInfo = `${proj.projectType || 'DCS'} · DeltaV ${proj.deltaVVersion || 'N/A'} · ${proj.controllerType || 'MD'} controller`;
        } else {
          techInfo = `${proj.industry || 'General Engineering'} · ${proj.duration || 'Variable duration'}`;
        }
        
        const card = `
          <div class="col-lg-4 col-md-6 mb-4">
            <div class="project-card" onclick="window.location.href='project-details.html?id=${proj.id}'">
              ${projectTypeBadge}
              <img src="${firstImg}" class="project-img" alt="${window.escapeHtml(proj.title)}">
              <h4 class="mt-3">${window.escapeHtml(proj.title)}</h4>
              <div class="mb-2">
                <span class="status-badge ${statusClass}">${statusText}</span>
                <span class="tech-tag">${proj.client ? window.escapeHtml(proj.client.substring(0, 20)) : (proj.controllerType || 'Various')}</span>
              </div>
              <p class="mt-2">${window.escapeHtml((proj.shortDesc || proj.description || '').substring(0, 100))}...</p>
              <div class="d-flex justify-content-between align-items-center mt-auto">
                <button class="btn btn-sm btn-outline-delta" onclick="event.stopPropagation(); window.location.href='project-details.html?id=${proj.id}'">
                  <i class="fa fa-info-circle"></i> View Details
                </button>
                <button class="btn btn-sm btn-delta" onclick="event.stopPropagation(); window.generateProjectReport('${proj.id}')">
                  <i class="fa fa-file-pdf-o"></i> PDF Report
                </button>
              </div>
              <div class="mt-2 text-muted" style="font-size:0.7rem;">${techInfo}</div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
      window.protectImages();
      window.hideLoading();
    }).catch(e => {
      console.error(e);
      window.hideLoading();
    });
  }

  window.onload = function() {
    window.updateUserFooter();
    renderAllProjects();
    
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (themeToggleBtn) {
      const updateButton = () => {
        const isDark = document.body.classList.contains('dark-theme');
        const icon = themeToggleBtn.querySelector('i');
        const text = themeToggleBtn.querySelector('#themeToggleText');
        if (isDark) {
          if (icon) icon.className = 'fa fa-sun-o';
          if (text) text.textContent = 'Light';
        } else {
          if (icon) icon.className = 'fa fa-moon-o';
          if (text) text.textContent = 'Dark';
        }
      };
      themeToggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (document.body.classList.contains('dark-theme')) {
          document.body.classList.remove('dark-theme');
          localStorage.setItem('portfolio-theme', 'light');
        } else {
          document.body.classList.add('dark-theme');
          localStorage.setItem('portfolio-theme', 'dark');
        }
        updateButton();
      });
      updateButton();
    }
  };
</script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
